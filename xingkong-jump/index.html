<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0b14" />
<title>星空跳一跳</title>
<link rel="icon" href="assets/icon.jpg" />
<link rel="apple-touch-icon" href="assets/icon.jpg" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="hud-left">
    <div class="stat"><div class="num" id="scoreNum">0</div><div class="lbl">分 数</div></div>
    <div class="stat stars"><div class="num" id="starNum">★ 0</div><div class="lbl">星 星</div></div>
    <div class="stat" id="combo"><div class="num" id="comboNum">×2</div><div class="lbl">连 击</div></div>
  </div>
  <div class="hud-title">星空跳一跳</div>
  <div class="hud-right">
    <div class="icon-btn" id="muteBtn" title="静音" aria-label="静音">
      <svg class="ico-spk" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M4 9v6h3.2L12 19.2V4.8L7.2 9H4zm11.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/>
        <path fill="currentColor" d="M13 3.1v2.1c2.9.9 5 3.6 5 6.8s-2.1 5.9-5 6.8v2.1c4-.9 7-4.5 7-8.9s-3-8-7-8.9z"/>
      </svg>
      <svg class="ico-mute" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M4 9v6h3.2L12 19.2V4.8L7.2 9H4zm11.5 3c0-.5-.1-1-.3-1.4l1.5-1.5c.5.9.8 1.9.8 2.9 0 1.8-1 3.3-2.5 4v-2.1c.6-.5 1-1.2 1-2z"/>
        <path fill="currentColor" d="M19.1 4.1 4.1 19.1l1.4 1.4 15-15-1.4-1.4z"/>
      </svg>
    </div>
  </div>
</div>

<div id="hudBottom">
  <div class="constel-wrap">
    <div class="constel-name" id="constelName">星座</div>
    <div id="constelHud"><canvas id="constelCv" width="120" height="120"></canvas></div>
  </div>
</div>

<div class="overlay show" id="startOv">
  <div class="panel">
    <img class="brand-icon" src="assets/icon.jpg" width="96" height="96" alt="星空跳一跳">
    <h1 class="brand">星空跳一跳</h1>
    <p class="sub">跳一跳星空改良版<br>按住蓄力 · 松手起跳 · 踩星连击</p>
    <div class="records" id="startRecords" hidden></div>
    <p class="storage-tip" id="storageTip"></p>
    <div class="btn" id="startBtn">开 始</div>
  </div>
</div>

<div class="overlay" id="endOv">
  <div class="panel">
    <h2 class="end-title">本局摘要</h2>
    <div class="summary" id="endSummary"></div>
    <canvas id="endConstel" width="600" height="220"></canvas>
    <div class="btn" id="againBtn">再 来 一 局</div>
    <div class="btn ghost" id="saveCardBtn">保 存 摘 要 卡</div>
    <div class="btn ghost" id="postNoteBtn" hidden>发 布 笔 记</div>
  </div>
</div>

<div class="overlay" id="expOv">
  <div class="panel">
    <h2 class="end-title" style="font-size:19px;letter-spacing:4px;">本 局 摘 要 卡</h2>
    <div id="expWrap"><img id="expImg" alt="摘要卡" /></div>
    <div class="btn" id="saveBtn">保 存 图 片</div>
    <div class="btn ghost" id="postNoteExpBtn" hidden>发 布 笔 记</div>
    <div class="btn ghost" id="expClose">关 闭</div>
    <p class="hint" id="expHint"></p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="src/app.js"></script>
</body>
</html>
