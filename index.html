<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loomis Arcade</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:ui-sans-serif,system-ui,sans-serif;background:#111;color:#f5f5f5}
  main{width:min(920px,92vw)}
  h1{font-size:1.4rem;margin:0 0 .4rem}
  p{opacity:.7;margin:0 0 1rem}
  h2{font-size:.95rem;opacity:.55;margin:1.4rem 0 .6rem;font-weight:600}
  ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  a{display:block;padding:14px;border-radius:14px;background:#1c1c1c;color:inherit;text-decoration:none}
  a:hover{background:#262626}
</style>
</head>
<body>
<main>
  <h1>Loomis Arcade</h1>
  <p>网页体验版（?platform=web 会隐藏小红书专属能力）</p>
  <h2>小游戏</h2>
  <ul>
    <li><a href="./word-card-tale/?platform=web">词卡物语</a></li>
    <li><a href="./xingkong-jump/?platform=web">星空跳一跳</a></li>
    <li><a href="./panda-puzzle/?platform=web">熊猫拼图</a></li>
    <li><a href="./rabbit-bead/?platform=web">兔格拼豆</a></li>
  </ul>
  <h2>小工具</h2>
  <ul>
    <li><a href="./incense-timer/?platform=web">焚香计时</a></li>
    <li><a href="./food-map/?platform=web">美食地图</a></li>
    <li><a href="./cinema-seat/?platform=web">影厅模拟器</a></li>
    <li><a href="./wind-chime/?platform=web">风铃物语</a></li>
    <li><a href="./paper-lantern/?platform=web">纸灯夜航</a></li>
    <li><a href="./baohongshu/?platform=web">爆红书</a></li>
    <li><a href="./crop-grid/?platform=web">轻映</a></li>
    <li><a href="./ticket-stub/?platform=web">帧藏</a></li>
  </ul>
</main>
</body>
</html>
