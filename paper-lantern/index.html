<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1430" />
<title>纸灯夜航</title>
<link rel="icon" href="assets/icon.jpg" />
<link rel="apple-touch-icon" href="assets/icon.jpg" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="hud-stack">
    <div class="score" id="scoreNum">0</div>
    <div class="spark-pill" id="sparkPill"><span class="spark-ico"></span>灯火 <span id="sparkNum">0</span></div>
  </div>
  <div class="icon-btn" id="muteBtn" title="静音" aria-label="静音">
    <svg class="ico-spk" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path fill="currentColor" d="M4 9v6h3.2L12 19.2V4.8L7.2 9H4zm11.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/>
      <path fill="currentColor" d="M13 3.1v2.1c2.9.9 5 3.6 5 6.8s-2.1 5.9-5 6.8v2.1c4-.9 7-4.5 7-8.9s-3-8-7-8.9z"/>
    </svg>
    <svg class="ico-mute" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path fill="currentColor" d="M4 9v6h3.2L12 19.2V4.8L7.2 9H4zm11.5 3c0-.5-.1-1-.3-1.4l1.5-1.5c.5.9.8 1.9.8 2.9 0 1.8-1 3.3-2.5 4v-2.1c.6-.5 1-1.2 1-2z"/>
      <path fill="currentColor" d="M19.1 4.1 4.1 19.1l1.4 1.4 15-15-1.4-1.4z"/>
    </svg>
  </div>
</div>

<div class="overlay show" id="startOv">
  <div class="panel">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 96 96" width="92" height="92">
        <defs>
          <radialGradient id="glowDev" cx="50%" cy="45%" r="50%">
            <stop offset="0%" stop-color="#ffe9a8"/>
            <stop offset="55%" stop-color="#ffb347"/>
            <stop offset="100%" stop-color="#c45a1a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="48" cy="48" r="42" fill="url(#glowDev)" opacity="0.55"/>
        <ellipse cx="48" cy="22" rx="14" ry="5" fill="#5a3a28"/>
        <path d="M34 24h28l4 8v28c0 10-8 18-18 18s-18-8-18-18V32l4-8z" fill="#ffc56a"/>
        <path d="M38 32h20v28c0 6-4.5 11-10 11s-10-5-10-11V32z" fill="#ffe2a0" opacity="0.7"/>
        <rect x="46" y="12" width="4" height="12" rx="2" fill="#5a3a28"/>
        <line x1="48" y1="78" x2="48" y2="88" stroke="#d4a060" stroke-width="2"/>
        <circle cx="48" cy="90" r="3" fill="#ff9a4a"/>
      </svg>
    </div>
    <h1 class="brand">纸灯夜航</h1>
    <p class="sub">轻点升起 · 钻进花灯门洞<br>攒一路星火，别撞灯柱与河面</p>
    <div class="best-pill" id="bestHint"><span class="dot"></span>最高 <span id="bestNum">0</span></div>
    <div class="btn" id="startBtn">开 始</div>
  </div>
</div>

<div class="overlay" id="endOv">
  <div class="panel">
    <div class="end-badge">本 局</div>
    <h2 class="end-title">灯 熄 了</h2>
    <div class="end-score"><span id="endScore">0</span></div>
    <div class="best-pill" id="endBest"><span class="dot"></span>最高 0</div>
    <div class="best-pill" id="endSpark"><span class="dot spark"></span>灯火 0</div>
    <div class="best-pill" id="endCombo"><span class="dot spark"></span>最大连击 ×0</div>
    <div class="btn" id="againBtn">再来一盏</div>
    <div class="btn ghost" id="saveCardBtn">导出贺卡</div>
  </div>
</div>

<div class="overlay" id="expOv">
  <div class="panel">
    <h2 class="end-title exp-title">灯 火 贺 卡</h2>
    <div id="expWrap"><img id="expImg" alt="灯火贺卡" /></div>
    <div class="btn" id="saveBtn">保 存 图 片</div>
    <div class="btn ghost close-bottom" id="expClose">关 闭</div>
  </div>
</div>

<script src="src/app.js?v=lantern4"></script>
</body>
</html>
