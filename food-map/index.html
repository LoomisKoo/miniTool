<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>美食图鉴</title>
<link rel="stylesheet" href="style.css?v=20260913f">
</head>
<body>
<div id="app">
  <!-- 顶部导航 -->
  <header class="nav" id="nav">
    <h1 id="navH1">美食图鉴</h1>
  </header>

  <!-- 地图页 -->
  <section class="screen active" id="mapScreen">
    <div class="mapwrap">
      <canvas id="map"></canvas>
      <div class="map-loc" id="mapLoc" aria-live="polite">中国</div>
      <div class="map-hint" id="mapHint">拖动旋转地球 · 双指缩放 · 放大进入平面 · 点亮点看美食</div>
      <!-- 缩放控件 -->
      <div class="zoomctl">
        <button id="zin" aria-label="放大">＋</button>
        <button id="zout" aria-label="缩小">－</button>
        <button id="zreset" aria-label="回到世界">⌂</button>
      </div>
      <!-- 聚合列表：挂在地图区域内，不贴根容器底 -->
      <section class="cluster-dlg" id="clusterDlg" aria-hidden="true">
        <div class="grabber"></div>
        <div class="cluster-head">
          <h2 id="cTitle">附近美食</h2>
          <p id="cSub"></p>
          <button class="cluster-close" id="clusterClose" aria-label="关闭">×</button>
        </div>
        <div class="cluster-scroll"><div class="cluster-list" id="clusterList"></div></div>
      </section>
    </div>
  </section>

  <!-- 名录页 -->
  <section class="screen" id="listScreen">
    <div class="searchbar">
      <div class="search">
        <svg viewBox="0 0 24 24" class="sicon"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" type="search" placeholder="搜索菜名 / 省市 / 食材" autocomplete="off">
      </div>
      <button class="filter-toggle" id="filterBtn" title="筛选">筛</button>
      <button class="fav-toggle" id="favFilter" title="只看收藏">♥</button>
    </div>
    <div class="filter-chips" id="filterActive" hidden></div>
    <div class="list-scroll"><div class="sections" id="list"></div></div>
  </section>

  <!-- 筛选面板 -->
  <section class="filter-dlg" id="filterDlg" aria-hidden="true" hidden>
    <div class="filter-mask" id="filterMask"></div>
    <div class="filter-panel">
      <div class="grabber"></div>
      <div class="filter-head">
        <h2>筛选</h2>
        <button type="button" class="filter-reset" id="filterReset">清空</button>
        <button type="button" class="sheet-close" id="filterClose" aria-label="关闭">×</button>
      </div>
      <div class="filter-scroll" id="filterBody"></div>
      <div class="filter-foot">
        <button type="button" class="filter-apply" id="filterApply">查看结果</button>
      </div>
    </div>
  </section>

  <!-- 底部 Tab -->
  <nav class="tabbar">
    <button class="tab active" data-tab="map">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <span>地图</span>
    </button>
    <button class="tab" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>名录</span>
    </button>
  </nav>

  <!-- 单点美食详情（固定高度，内容可滚） -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div class="sheet-titlewrap">
        <h2 id="sName"></h2>
        <p id="sSub"></p>
      </div>
      <button class="heart" id="sHeart" aria-label="收藏">♡</button>
      <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    </div>
    <div class="sheet-scroll">
      <div class="meta-row" id="sMeta"></div>
      <div class="detail-block" id="sTagsBlock" hidden>
        <div class="detail-label">特色标签</div>
        <div class="chip-row" id="sTags"></div>
      </div>
      <div class="detail-block" id="sIngBlock" hidden>
        <div class="detail-label">主要食材</div>
        <div class="chip-row" id="sIng"></div>
      </div>
      <div class="detail-block" id="sCookBlock" hidden>
        <div class="detail-label">烹饪方式</div>
        <div class="chip-row" id="sCook"></div>
      </div>
      <p class="place-desc" id="placeDesc"></p>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script src="land.js?v=20260908g"></script>
<script src="prov-land.js?v=20260908g"></script>
<script src="data.js?v=20260908k"></script>
<script src="app.js?v=20260913e"></script>
</body>
</html>
