<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>词卡物语 · 封面</title>
<link rel="stylesheet" href="style.css">
<style>
  .poster *, .poster *::before, .poster *::after { animation: none !important; transition: none !important; }
  html, body { margin: 0; width: 1080px; height: 1440px; overflow: hidden; background: #0d0816; }
  .poster {
    position: relative; width: 1080px; height: 1440px; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 52%, rgba(120,60,150,.55) 0, transparent 70%),
      linear-gradient(180deg, #1a0f2e 0%, #120a22 45%, #0b0714 100%);
    font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  }
  /* preview 的机体尺寸是固定的：画布按半尺寸渲染再放大 2 倍，机体和弹幕一起变大 */
  #ship {
    position: absolute; left: 0; top: 0; width: 540px; height: 720px; transform: scale(2); transform-origin: 0 0;
    -webkit-mask: linear-gradient(to top, #000 52%, transparent 74%); mask: linear-gradient(to top, #000 52%, transparent 74%);
  }
  .mon { position: absolute; image-rendering: pixelated; filter: drop-shadow(0 10px 12px rgba(0,0,0,.6)); }

  .logo { position: absolute; top: 64px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 26px; }
  .logo-mark svg { display: block; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .logo-txt { display: flex; flex-direction: column; align-items: center; }
  .logo-cn {
    font-size: 138px; font-weight: 900; letter-spacing: 10px; line-height: 1;
    background: linear-gradient(180deg, #fff7d6 0%, #ffd77a 42%, #e59a2c 58%, #ffe9a8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #3a1640;
    filter: drop-shadow(0 6px 0 #3a1640) drop-shadow(0 14px 18px rgba(0,0,0,.7));
  }
  .logo-en {
    margin-top: 14px; display: flex; align-items: center; gap: 16px;
    font: 600 26px/1 Didot, Georgia, serif; letter-spacing: 12px; color: #f3d48c;
  }
  .logo-en::before, .logo-en::after { content: ''; width: 70px; height: 2px; background: linear-gradient(90deg, transparent, #f3d48c); }
  .logo-en::after { transform: scaleX(-1); }

  .cw { position: absolute; width: 330px; height: 406px; transform-origin: center center; }
  .cw .card { box-shadow: 0 30px 50px rgba(0,0,0,.65); }
  .c-left  { left: 90px; top: 450px; transform: scale(1.2) rotate(-15deg); }
  .c-right { left: 660px; top: 450px; transform: scale(1.2) rotate(15deg); }
  .c-hero  { left: 375px; top: 430px; transform: scale(1.5) rotate(-2deg); }

  .badge {
    position: absolute; left: 760px; top: 290px; transform: rotate(12deg);
    padding: 16px 30px 18px; border-radius: 18px;
    background: linear-gradient(135deg, #ff6b9a, #ffb347 35%, #ffe066 55%, #5fe0a0 78%, #6fb6ff);
    color: #2a0f2e; font-weight: 900; text-align: center; line-height: 1;
    box-shadow: 0 8px 0 #4a1f5c, 0 16px 24px rgba(0,0,0,.55);
    border: 4px solid #fff4e0;
  }
  .badge b { display: block; font-size: 64px; letter-spacing: 1px; }
  .badge span { display: block; margin-top: 6px; font-size: 30px; letter-spacing: 4px; }
</style>
</head>
<body>
<div class="poster">
  <canvas id="ship"></canvas>
  <div id="mons"></div>
  <div class="logo">
    <div class="logo-mark" id="logoMark"></div>
    <div class="logo-txt">
      <div class="logo-cn">词卡物语</div>
      <div class="logo-en">WORD CARD TALE</div>
    </div>
  </div>
  <div class="cw c-left" id="cLeft"></div>
  <div class="cw c-right" id="cRight"></div>
  <div class="cw c-hero" id="cHero"></div>
  <div class="badge"><b>0.3%</b><span>隐藏款</span></div>
</div>
<script src="glyphs.js"></script>
<script src="words.js"></script>
<script src="words-bulk.js"></script>
<script src="frames.js"></script>
<script src="card.js"></script>
<script src="fx.js"></script>
<script src="sfx.js"></script>
<script src="stages.js"></script>
<script src="battle.js"></script>
<script src="poster.js"></script>
</body>
</html>
