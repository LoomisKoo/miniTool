<div id="stage"><canvas id="c"></canvas></div>

<div id="bottom-ui">
<div id="timebar"><div id="clock">05:00</div></div>

<div id="main-presets">
  <div class="presets-row" id="presetsRow">
    <div class="preset-chips" id="presetChips">
      <button class="chip on" data-s="300">5 分</button>
      <button class="chip" data-s="900">15 分</button>
      <button class="chip" data-s="1800">30 分</button>
      <button class="chip" data-s="3600">1 时</button>
    </div>
    <div class="scene-wrap" id="sceneWrap">
      <button class="scene-thumb" id="btnScene" type="button" aria-label="环境"></button>
      <div class="scene-pop" id="scenePop">
        <button type="button" class="scene-opt sc" data-k="night" aria-label="夜雨"></button>
        <button type="button" class="scene-opt sc" data-k="bamboo" aria-label="竹林"></button>
        <button type="button" class="scene-opt sc" data-k="temple" aria-label="古寺"></button>
        <button type="button" class="scene-opt sc on" data-k="silent" aria-label="默照"></button>
      </div>
    </div>
  </div>
  <button class="chip ash-chip" id="btnAsh" title="弹香灰">
    <span class="ash-icon">⌇</span> 弹灰
  </button>
</div>
<div id="dock">
  <button class="dock-btn dock-icon-btn" id="btnPanel" aria-label="自定义时长">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 13V9m0-5v2m-4.2 1.8L8.8 8m6.4 2.8L15.2 8"/></svg>
  </button>
  <div class="dock-main-slot">
    <button class="dock-main" id="btnGo" data-mode="idle" aria-label="点香">
      <span class="go-text">点香</span>
      <svg class="go-ico go-ico-pause" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2"/>
        <rect x="14" y="5" width="4" height="14" rx="1.2"/>
      </svg>
      <svg class="go-ico go-ico-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5.5v13l11-6.5z"/>
      </svg>
    </button>
  </div>
  <button class="dock-btn dock-icon-btn" id="btnReset" aria-label="重置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 13.7-5.7M20 7v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7M4 17v-4h4"/></svg>
  </button>
</div>
</div>
<div id="panel">
  <div id="panel-bg"></div>
  <div id="panel-body">
    <div class="handle"></div>
    <div class="panel-title">自定义时长</div>
    <div class="p-label"><span>时</span><span>分</span><span>秒</span></div>
    <div class="picker-wrap">
      <div class="picker-col" id="colH"></div>
      <div class="picker-col" id="colM"></div>
      <div class="picker-col" id="colS"></div>
    </div>
    <div class="panel-btns">
      <button class="ok" id="btnApply">确定</button>
      <button class="red" id="btnCancel">取消</button>
    </div>
  </div>
</div>
