.top,.detail-top,.chat-head,.inbox-head{top:0!important}
/* 浮层仍从容器导航栏下方开始（偏移量保持），但用同色把导航栏那一截填实，避免透过看到上一页 */
.detail-back,.activity-back,.chat-back{background:#1A191F;box-shadow:0 calc(-1 * var(--xhs-nav)) 0 0 #1A191F}
.modal-back{box-shadow:0 calc(-1 * var(--xhs-nav)) 0 0 rgba(0,0,0,.38)}
/* 详情页 / 私信页 底部栏：改为 sticky 钉在滚动容器底部。
   fixed 会被父级 .detail-back/.chat-back 的 transform（滑入动画）变成「相对滚动容器」，
   于是底栏会跟着列表一起滚走；sticky 不受 transform 影响。 */
.detail-bottom,.chat-compose{position:sticky!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;transform:none!important;width:100%!important;max-width:100%!important;margin:0!important;flex:none!important;z-index:5!important}
/* 内容不足一屏时也把底栏顶到最底部 */
.detail{display:flex!important;flex-direction:column}
.detail-content,.chat-body{flex:1 0 auto}
.detail-bottom,.chat-compose{margin-top:auto!important}
.detail-bottom .comment-form{flex:1 1 0!important;min-width:0!important;max-width:52%!important}
.detail-bottom .comment-form input{flex:1 1 auto!important;min-width:0!important}
/* 聊天页改为「上中下三段」弹性布局：头部固定、消息区自己滚动、输入栏永远贴底。
   完全不依赖 sticky/fixed，因此在任何浏览器、任何滚动位置都不会跑位。 */
.chat-back{display:flex!important;flex-direction:column;overflow:hidden!important}
.chat-page{flex:1 1 auto!important;width:100%!important;min-height:0!important;height:auto!important;margin:0!important;display:flex!important;flex-direction:column;overflow:hidden}
.chat-head{flex:0 0 auto!important;position:relative!important;top:auto!important}
.chat-body{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch}
.chat-compose{position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;flex:0 0 auto!important;width:100%!important;max-width:100%!important;margin:0!important;z-index:6!important}
/* ===== 首次进入：昵称 + 性别 引导页（盖住全屏，必须填完才能进） ===== */
.onboard{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:200;display:none;align-items:center;justify-content:center;padding:24px 18px 24px;padding-bottom:calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));background:radial-gradient(circle at 72% 10%,rgba(255,36,66,.3),transparent 46%),linear-gradient(160deg,#141018,#221b27 58%,#110e15);box-sizing:border-box}
.onboard.open{display:flex}
body.onboarding .bottom,body.onboarding .new-comments,body.onboarding .dm-layer{display:none!important}
.onboard-card{width:100%;max-width:360px;max-height:100%;overflow:auto;background:#fff;border-radius:22px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:obIn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes obIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.onboard-logo{text-align:center;font-size:26px;font-weight:800;letter-spacing:-1px;color:#222}
.onboard-logo i{font-style:normal;color:var(--red)}
.onboard-sub{text-align:center;color:#999;font-size:13px;line-height:1.6;margin:8px 0 22px}
.onboard-field{margin-bottom:16px}
.onboard-field>label{display:block;font-size:12px;color:#888;margin-bottom:8px}
.onboard-field input{width:100%;height:46px;border:0;border-radius:12px;background:#f6f6f8;padding:0 14px;font-size:15px;outline:none;color:#222}
.onboard-field input:focus{background:#fff;box-shadow:0 0 0 2px rgba(255,36,66,.32)}
.gender-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gender-picker button{height:44px;border-radius:12px;background:#f6f6f8;color:#777;font-size:14px;transition:.15s}
.gender-picker button.on{background:#fff0f2;color:var(--red);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--red)}
.onboard-err{margin:0;min-height:17px;color:var(--red);font-size:12px;line-height:17px}
.onboard-btn{width:100%;height:48px;border-radius:24px;background:var(--red);color:#fff;font-weight:700;font-size:16px;margin-top:8px}
.onboard-btn:active{transform:scale(.985)}
.profile-name .profile-gender{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;margin-left:8px;border-radius:50%;background:rgba(255,255,255,.14);font-size:13px;font-weight:500;color:rgba(255,255,255,.72);line-height:22px;text-align:center;flex:none;align-self:center;overflow:hidden}
.profile-name .profile-gender .g-sym{font-size:13px;width:100%;height:100%;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-weight:700}
/* 性别符号：女 ♀ 红、男 ♂ 蓝、未填 人形图标 */
.g-sym{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-weight:700;font-size:1.05em}
.g-sym.female{color:#ff2442}
.g-sym.male{color:#2f74e0}
.g-sym.other{color:#9a9aa4}
.g-sym svg{width:.86em;height:.86em;display:block;margin:0 auto}
.avatar.has-photo,.big-avatar.has-photo,.avatar-edit.has-photo{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent;font-size:0!important}
.big-avatar{position:relative;overflow:hidden;cursor:pointer;border-width:1px!important}
.profile-page .big-avatar{box-shadow:0 0 0 1px rgba(255,255,255,.55),0 5px 18px rgba(0,0,0,.35)!important}
.avatar-edit{position:relative;width:76px;height:76px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,#5d7da8,#e6a7bd);color:#fff;border:1px solid rgba(255,255,255,.55)}
body.dark .avatar-edit{border-color:#4a4952}
body.dark .onboard-card{background:#1F1E25}
body.dark .onboard-logo{color:#F5F4F7}
body.dark .onboard-field input,body.dark .gender-picker button{background:#2A2931;color:#E8E6EE}
body.dark .gender-picker button.on{background:#3A2530;color:#FF9DB8;box-shadow:inset 0 0 0 1.5px #FF6B7E}
/* ===== 弹窗改版（发布图文 / 编辑资料 共用）=====
   ①去掉顶部那条灰色指示条（两边都由右上角的圆形关闭键来表达「可关闭」）
   ②关闭键：右上角、圆形浅灰底，白底弹窗上更醒目，点按区域也更大
   ③添加图片：从整行大色块收成「圆角正方形」缩略块，符合发布页的图片位直觉 */
.modal{padding-top:18px}
#profile-modal .modal{display:flex;flex-direction:column;max-height:calc(100% - var(--xhs-nav))!important}
#profile-modal.activity-back{padding-top:calc(var(--xhs-top) + 29px)!important}
.profile-edit-page{display:flex;flex-direction:column;overflow:hidden}
.profile-edit-page>.inbox-head{flex:none}
.profile-edit-page .nav-save{margin-left:auto;flex:none;height:30px;padding:0 14px;border-radius:15px;background:var(--red);color:#fff;font-size:13px;font-weight:600}
.edit-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px}
.edit-scroll .fields{max-width:100%}
.modal .handle,.modal>.handle{display:none!important}
.modal>.close{position:absolute!important;right:14px!important;top:14px!important;width:32px!important;height:32px!important;min-width:32px!important;max-width:32px!important;padding:0!important;margin:0!important;border-radius:50%!important;background:#f1f1f3;color:#6b6b73;font-size:19px!important;line-height:1!important;display:flex!important;align-items:center!important;justify-content:center!important;z-index:3;transition:.15s}
.modal>.close:active{background:#e3e3e7;transform:scale(.94)}
.modal h2{padding-right:44px}
.upload{width:104px!important;height:104px!important;min-height:0!important;max-width:104px!important;border-radius:16px!important;align-self:flex-start;margin:0!important;gap:3px}
.upload strong{font-size:25px;line-height:1}
.upload span{font-size:11px;line-height:1.3;padding:0 6px}
.upload img{border-radius:16px}
.upload:active{background:#f0f0f2}
/* 图片是必填项：标红星；点「发布笔记」漏图时给方块描红 + 轻微抖动，不用只靠 toast */
.upload .req{color:var(--red);font-style:normal;margin-left:1px;font-weight:700}
.field label .req{color:var(--red);font-style:normal;margin-left:2px;font-weight:700}
.upload.missing{background:#fff3f5!important;box-shadow:inset 0 0 0 1.5px var(--red)!important;animation:shakeX .42s}
.upload.missing span,.upload.missing strong{color:var(--red)!important}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
body.dark .upload.missing{background:#3A2530!important}
body.dark .modal>.close{background:#2A2931;color:#C8C6D0}
body.dark .modal>.close:active{background:#34333C}
body.dark .upload:active{background:#2E2D36}
/* ===== 发现页：话题热搜卡（可点）=====
   .hot 从装饰性 div 改成 button，所以要自己声明文字对齐、flex 布局和按压反馈 */
.hot{display:flex;flex-direction:column;align-items:flex-start;gap:5px;flex:0 0 auto;text-align:left;font:inherit;cursor:pointer;transition:.15s}
.hot .hot-rank{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--red)}
.hot .hot-meta{font-size:11.5px;color:#999}
.hot:active{transform:scale(.97)}
.shuffle{padding:5px 11px;border-radius:14px;background:#f5f5f5;color:#666;font-size:12px;transition:.15s}
.shuffle:active{background:#ececec;transform:scale(.96)}
body.dark .shuffle{background:#292930;color:#C8C6D0}
/* ===== 话题聚合页 ===== */
.topic-page .inbox-head{position:sticky;top:0;z-index:6;height:52px;padding:0 15px;display:flex;align-items:center;border-radius:0;border:0;border-bottom:1px solid var(--ih-line);background:var(--ih-bg);color:var(--ih-fg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.topic-page .inbox-title{font-size:17px;font-weight:600;line-height:52px;margin:0;color:inherit}
.topic-hero{padding:20px 18px 18px;background:radial-gradient(circle at 82% 0%,rgba(255,36,66,.16),transparent 58%),linear-gradient(180deg,#fff6f7,#fff)}
.topic-emoji{font-size:34px;line-height:1}
.topic-hero h1{font-size:22px;margin:10px 0 6px}
.topic-hero p{margin:0 0 12px;color:#999;font-size:12.5px}
.topic-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:#999;font-size:12px}
.topic-meta b{color:#222;font-size:13px;font-variant-numeric:tabular-nums}
.topic-join{margin-top:15px;height:36px;padding:0 18px;border-radius:18px;background:var(--red);color:#fff;font-size:13px;font-weight:600;transition:.15s}
.topic-join:active{transform:scale(.97);opacity:.9}
.topic-notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px;padding:3px}
.topic-notes .card{display:block;width:100%;margin:0}
.topic-notes .cover{height:180px;border-radius:3px}
.topic-more{padding:16px 15px 6px;font-size:15px;font-weight:700}
body.dark .topic-hero{background:radial-gradient(circle at 82% 0%,rgba(255,36,66,.2),transparent 58%),linear-gradient(180deg,#221b22,#1A191F)}
body.dark .topic-meta b{color:#F5F4F7}
/* 顶栏：安全区 + 容器导航（规范）；浮层用 padding 让出，内部自己滚，避免 sticky 顶到容器按钮上 */
html,body{width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
.chat-back,.detail-back,.activity-back,.modal-back{
  top:0!important;right:0!important;bottom:0!important;left:0!important;
  width:auto!important;max-width:none!important;
  padding-top:var(--xhs-nav)!important;
  box-sizing:border-box;
  box-shadow:none!important;
  overflow-x:hidden!important;
  overscroll-behavior:none;
}
.chat-back,.detail-back,.activity-back{
  display:none!important;
  transform:none!important;
}
.chat-back.open,.detail-back.open,.activity-back.open{
  display:flex!important;
  flex-direction:column;
  overflow:hidden!important;
  visibility:visible!important;
  pointer-events:auto!important;
}
.detail,.chat-page,.activity-page{
  flex:1 1 auto!important;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  min-height:0!important;
  margin:0!important;
  overflow-x:hidden!important;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.detail{
  display:flex!important;
  flex-direction:column;
  overflow:hidden!important;
}
.detail-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.chat-page{display:flex!important;flex-direction:column;overflow:hidden!important}
.detail-top{
  flex:0 0 auto!important;
  position:relative!important;
  top:auto!important;
  z-index:6!important;
  background:#1A191F!important;
}
.chat-head,.activity-page>.inbox-head,.topic-page .inbox-head{
  flex:0 0 auto!important;
  position:relative!important;
  top:auto!important;
}
body.tab-messages .app{
  padding-top:var(--xhs-nav)!important;
  box-sizing:border-box;
  overflow-x:hidden;
}
body.tab-home .app,body.tab-explore .app{
  padding-top:var(--xhs-top)!important;
  box-sizing:border-box;
  overflow-x:hidden;
}
body.tab-me .app{padding-top:0!important}
body.tab-messages #page>.inbox-head{height:0!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden}
body.tab-me #page .profile-hero{padding-top:calc(var(--xhs-nav) + 28px)}
.profile-page .profile-row.profile-user{margin-top:0;align-items:flex-start}
body.tab-home .top,body.tab-explore .top{height:var(--nav-h)}
.inbox-cats{padding-top:12px}
.detail-content .c-text,.detail-content p.c-text{margin:0!important;padding:0}
.dm-layer{top:var(--xhs-nav)!important}
.dm-toast{top:8px!important}
.detail-cover{
  flex:none!important;
  height:280px!important;
  min-height:220px!important;
  max-height:70vh;
  margin:0!important;
  border-radius:0!important;
}
.detail-cover.has-image{
  height:320px!important;
  min-height:240px!important;
}
.detail-content{padding:16px 20px 28px!important}
.detail-content h1,.detail-content p,.detail-content .tag,.comment-head,.detail-content .comment{padding-left:0;padding-right:0}
.nav-back,#close-detail,#close-chat,[data-inbox-back],[data-topic-back],[data-user-back]{
  position:relative;z-index:2;flex:none;
  width:48px!important;min-width:48px;height:48px!important;
  font-size:40px!important;line-height:46px!important;font-weight:200;
  padding:0!important;display:flex!important;align-items:center;justify-content:center;
  margin-left:-12px!important
}
.nav-head,.detail-top,.chat-head,.activity-page>.inbox-head,.topic-page .inbox-head{
  position:relative!important;display:flex!important;align-items:center!important;
}
.nav-title,.chat-head h3{
  position:absolute;left:52px;right:52px;margin:0!important;
  text-align:center;font-size:16px;font-weight:600;line-height:48px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
}
.nav-spacer{width:48px;min-width:48px;height:1px;margin-left:auto;flex:none}
.top{justify-content:center!important}
.top .logo{width:100%;text-align:center}
.detail-top .detail-author{position:absolute!important;left:48px;right:80px;top:0;bottom:0;margin:0!important;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.detail-top .follow-btn{position:relative;z-index:2;margin-left:auto!important;flex:none;width:auto!important;height:auto!important;font-size:13px!important}
.user-page .follow-btn{width:auto!important;height:28px!important;font-size:13px!important;line-height:1;padding:0 12px}
.chat-back,.detail-back,.activity-back{
  display:flex!important;flex-direction:column;
  visibility:hidden;pointer-events:none;
  transform:translate3d(100%,0,0)!important;

}
.chat-back.open,.detail-back.open,.activity-back.open{

}
.chat-back.closing,.detail-back.closing,.activity-back.closing{
  visibility:visible!important;pointer-events:none!important;
  transform:translate3d(100%,0,0)!important;
}
body.tab-me #page .profile-hero{padding-top:calc(var(--xhs-nav) + 28px)!important}
.user-page .profile-hero{padding-top:16px}
#user.activity-back{padding-top:calc(var(--xhs-top) + 15px)!important}
#detail.detail-back{padding-top:calc(var(--xhs-top) + 29px)!important}
.user-page{display:flex!important;flex-direction:column;overflow:hidden!important}
.user-page>.inbox-head{flex:none}
.user-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.user-page .profile-edit-btn.followed{opacity:.75}

</style>

<body class="onboarding">
<div class="app">
<main class="scroll" id="page"></main>
<nav class="bottom">
  <button data-tab="home" class="active">首页</button>
  <button data-tab="explore">发现</button>
  <button id="open-publish" aria-label="发布"><span class="publish">＋</span></button>
  <button data-tab="messages">消息<i class="badge" id="nav-badge" style="display:none">0</i></button>
  <button data-tab="me">我</button>
</nav>
</div>
<div class="modal-back" id="publish-modal">
  <section class="modal">
    <button class="close" id="close-publish">×</button>
    <h2>发布图文</h2>
    <label class="upload" id="upload"><strong>＋</strong><span>添加图片<i class="req">*</i></span><img id="upload-img" alt="作品预览"></label>
    <input id="file-input" type="file" accept="image/*" hidden>
    <div class="fields">
      <div class="field"><label>选择内容分类<i class="req">*</i></label><div class="category" id="categories"></div></div>
      <div class="field"><label>标题<i class="req">*</i></label><input id="post-title" maxlength="35" placeholder="记录一下今天的生活"></div>
      <div class="field"><label>正文 <span class="hint">选填，最多 100 字</span></label><textarea id="post-desc" maxlength="100" placeholder="分享你的生活和发现…"></textarea></div>
    </div>
    <button class="publish-btn" id="publish-post">发布笔记</button>
  </section>
</div>
<div class="activity-back" id="profile-modal">
  <section class="activity-page profile-edit-page">
    <section class="inbox-head nav-head">
      <button class="nav-back" data-edit-back>‹</button>
      <span class="nav-title">编辑资料</span>
      <button type="button" class="nav-save" id="save-profile">保存</button>
    </section>
    <div class="edit-scroll">
      <div class="fields">
        <div class="field"><label>头像</label><button type="button" class="avatar-edit" id="edit-avatar" data-pick-avatar></button></div>

        <div class="field"><label>简介 <span class="hint">选填，最多 80 字</span></label><textarea id="edit-bio" maxlength="80" placeholder="介绍一下自己，让别人更了解你…"></textarea></div>
        <div class="field">
          <label>标签 <span class="hint" id="tag-count">最多 6 个</span></label>
          <div class="tag-picker" id="tag-picker"></div>
          <div class="tag-add"><input id="tag-input" maxlength="10" placeholder="自定义标签，例如「露营」"><button id="tag-add-btn">添加</button></div>
          <div class="tag-selected" id="tag-selected"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<input id="avatar-input" type="file" accept="image/*" hidden>
<div class="detail-back" id="detail"></div>
<div class="activity-back" id="activity"></div>
<div class="activity-back" id="topic"></div>
<div class="chat-back" id="chat"></div>
<div class="activity-back" id="user"></div>
<div class="dm-layer" id="dm-layer"></div>

<div class="toast" id="toast"></div>

function probeCoverAR(id,src){
  if(!src||imageAR[id])return;
  let im=new Image();
  im.onload=()=>{
    if(!im.naturalWidth)return;
    /* 封面只取 1:1 / 3:4 / 4:3 三种，照片接近哪种就用哪种，多余裁切（background-size:cover） */
    let r=im.naturalWidth/im.naturalHeight;
    let opts=[["1/1",1],["3/4",.75],["4/3",4/3]];
    let best=opts[0];for(let o of opts)if(Math.abs(o[1]-r)<Math.abs(best[1]-r))best=o;
    imageAR[id]=best[0];
    document.querySelectorAll(`[data-id="${id}"] .cover, .detail-cover[data-cover-id="${id}"]`).forEach(el=>el.style.setProperty("--cover-ar",best[0]));
  };
  im.src=src;
}

}

function pickText(pool,recentList,cap){let available=pool.filter(text=>!recentList.includes(text));if(!available.length){for(let i=recentList.length-1;i>=0;i--)if(pool.includes(recentList[i]))recentList.splice(i,1);available=pool.slice()}let text=available[Math.floor(Math.random()*available.length)];recentList.push(text);if(recentList.length>cap)recentList.shift();return text}

/* ===== 粉丝自动回复：先按情绪挑一组，再在组内去重；
   同一个人不重复、全局最近用过的也不再用，所以不容易撞话 ===== */
const recentReplies=[],recentRepliesByConv=new Map();
function makeReply(name,kind){
  let isBiz=BIZ_USERS.some(b=>b.name===name);
  let all=replyShocked.concat(replyHappy,replyShy,replyThanks,replyTopic,replyUnseenSeen,replyBiz);
  let groups=isBiz?[replyBiz]:(kind==="unseen"?[replyUnseenSeen,replyShocked]:[replyShocked,replyHappy,replyShy,replyThanks,replyTopic]);
  let preferred=groups[Math.floor(Math.random()*groups.length)];
  let used=recentRepliesByConv.get(name)||[];
  let isFree=t=>!used.includes(t)&&!recentReplies.includes(t);
  let available=preferred.filter(isFree);
  if(!available.length){
    /* 先只清掉「这一组」的历史，优先保证情绪/场景对得上，实在没有再退到全量池 */
    for(let i=recentReplies.length-1;i>=0;i--)if(preferred.includes(recentReplies[i]))recentReplies.splice(i,1);
    available=preferred.filter(t=>!used.includes(t));
  }
  if(!available.length)available=all.filter(isFree);
  if(!available.length){recentReplies.length=0;available=all.filter(t=>!used.includes(t))}
  if(!available.length){used=[];available=all.slice()}
  let text=available[Math.floor(Math.random()*available.length)];
  used.push(text);recentRepliesByConv.set(name,used);
  recentReplies.push(text);if(recentReplies.length>70)recentReplies.shift();
  return text;
}

function dmLayer(){return document.querySelector("#dm-layer")}
let dmToastEl=null,dmHideTimer=null,dmSwapTimer=null,dmVisible=false,dmSwiped=false;
const DM_ENTER="transform .34s cubic-bezier(.22,1,.36,1),opacity .34s ease";
const DM_RESTING="translateY(0) scale(1)";
function clearDmNotifies(){clearTimeout(dmHideTimer);clearTimeout(dmSwapTimer);let layer=dmLayer();if(layer)layer.innerHTML="";dmToastEl=null;dmVisible=false}
function hideDmToast(){
  clearTimeout(dmHideTimer);clearTimeout(dmSwapTimer);
  let el=dmToastEl;if(!el)return;
  dmVisible=false;
  el.style.transition="transform .22s ease,opacity .22s ease";
  el.style.transform="translateY(-160%) scale(.97)";el.style.opacity="0";el.style.pointerEvents="none";
}
function paintDmToast(m){dmToastEl.dataset.name=m[1];dmToastEl.innerHTML=`<i class="avatar">${m[0]}</i><div class="dm-body"><b>${esc(m[1])}</b><small>${esc(m[2])}</small></div><span class="dm-time">${timeLabel(m[6]||Date.now())}</span>`}
function showDmToast(){
  let el=dmToastEl;if(!el)return;
  clearTimeout(dmHideTimer);
  el.style.transition="none";
  el.style.transform="translateY(-160%) scale(.97)";el.style.opacity="0";
  void el.offsetWidth;
  el.style.transition=DM_ENTER;
  el.style.transform=DM_RESTING;el.style.opacity="1";el.style.pointerEvents="";
  dmVisible=true;
  dmHideTimer=setTimeout(hideDmToast,4200);
}
/* 手势：按住这条通知往上推，推过阈值（或甩得够快）就飞走消失；没推够松手回弹；轻点仍然打开会话 */
function bindDmSwipe(el){
  let active=false,pid=null,sy=0,dy=0,baseTy=0,baseScale=1,lastY=0,lastT=0,vy=0;
  const start=e=>{
    if(!dmVisible)return;
    active=true;dmSwiped=false;pid=e.pointerId;sy=e.clientY;dy=0;vy=0;lastY=sy;lastT=e.timeStamp;
    clearTimeout(dmHideTimer);clearTimeout(dmSwapTimer);
    /* 抓住当前实际位置当基准，避免在入场动画途中接管时跳一下 */
    let cs=getComputedStyle(el),m=cs.transform;
    baseTy=0;baseScale=1;
    if(m&&m.indexOf("matrix")===0){let p=m.slice(m.indexOf("(")+1,-1).split(",").map(Number);baseScale=p[0]||1;baseTy=p[5]||0}
    el.style.transition="none";
    el.style.transform=`translateY(${baseTy}px) scale(${baseScale})`;
    el.style.opacity=cs.opacity;
    try{el.setPointerCapture(pid)}catch(_){}
  };
  const move=e=>{
    if(!active||e.pointerId!==pid)return;
    dy=e.clientY-sy;
    if(e.timeStamp>lastT){vy=(e.clientY-lastY)/Math.max(1,e.timeStamp-lastT);lastY=e.clientY;lastT=e.timeStamp}
    let ty=baseTy+dy,up=-ty;
    if(up>6)dmSwiped=true;
    if(up>0){
      el.style.transform=`translateY(${ty}px) scale(${Math.max(.9,baseScale-up/900)}) rotate(${Math.max(-7,-up/18)}deg)`;
      el.style.opacity=String(Math.max(0,1-up/150));
    }else{
      el.style.transform=`translateY(${baseTy+dy*.28}px) scale(${baseScale})`;
      el.style.opacity="1";
    }
  };
  const end=e=>{
    if(!active||(e.pointerId!==undefined&&e.pointerId!==pid))return;
    active=false;
    let up=-(baseTy+dy),fastUp=vy<-0.35;
    if(up>44||(fastUp&&up>14))flingDmToast(el);else springBackDmToast(el);
  };
  el.addEventListener("pointerdown",start);
  el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("lostpointercapture",()=>{if(active){active=false;springBackDmToast(el)}});
  /* 拖动过就不算点击，避免一甩就误开聊天 */
  el.addEventListener("click",e=>{if(dmSwiped){e.preventDefault();e.stopPropagation();dmSwiped=false}},true);
}
function springBackDmToast(el){
  el.style.transition="transform .26s cubic-bezier(.22,1,.36,1),opacity .26s ease";
  el.style.transform=DM_RESTING;el.style.opacity="1";el.style.pointerEvents="";
  dmVisible=true;
  clearTimeout(dmHideTimer);
  dmHideTimer=setTimeout(hideDmToast,3200);
}
function flingDmToast(el){
  clearTimeout(dmHideTimer);clearTimeout(dmSwapTimer);
  dmVisible=false;
  el.style.transition="transform .26s cubic-bezier(.4,0,.9,.5),opacity .26s ease-in";
  el.style.transform="translateY(-160%) scale(.94) rotate(-4deg)";
  el.style.opacity="0";el.style.pointerEvents="none";
  if(dmToastEl===el)dmToastEl=null;
  setTimeout(()=>{if(el.isConnected)el.remove()},270);
}
function notifyDm(m){

  if(!m||m[3]!=="私信")return;
  if(currentTab==="messages")return;
  if(document.querySelector("#chat")?.classList.contains("open"))return;
  if(document.querySelector("#detail")?.classList.contains("open"))return;
  let layer=dmLayer();if(!layer)return;
  /* 整个页面只维护 1 个 toast 节点：新消息先把旧消息向上顶走，再自己从顶部推入 */
  if(!dmToastEl||!dmToastEl.isConnected){
    dmToastEl=document.createElement("button");dmToastEl.type="button";dmToastEl.className="dm-toast";
    dmToastEl.style.transform="translateY(-160%) scale(.97)";dmToastEl.style.opacity="0";dmToastEl.style.pointerEvents="none";
    dmToastEl.addEventListener("click",()=>{if(dmSwiped)return;let name=dmToastEl.dataset.name;hideDmToast();openChat(name)});
    bindDmSwipe(dmToastEl);
    layer.appendChild(dmToastEl);
  }
  clearTimeout(dmHideTimer);clearTimeout(dmSwapTimer);
  if(dmVisible){
    dmVisible=false;
    dmToastEl.style.transition="transform .19s ease,opacity .19s ease";
    dmToastEl.style.transform="translateY(-160%) scale(.97)";dmToastEl.style.opacity="0";
    dmSwapTimer=setTimeout(()=>{if(dmToastEl){paintDmToast(m);showDmToast()}},195);
  }else{
    paintDmToast(m);showDmToast();
  }
}

/* ===== 粉丝自动回复：延迟 1~3 秒，像真人打完字才发出来 ===== */
const pendingReplies=new Map();
function deliverReply(c,text){
  let layer=document.querySelector("#chat");
  let viewing=layer&&layer.classList.contains("open")&&chatOpenName===c.name;
  c.msgs.push({text,me:false,ts:Date.now()});c.ts=Date.now();
  if(viewing){
    let body=document.querySelector("#chat-body");
    if(body){appendChatRow(body,{me:false,text:text,avatar:c.avatar});body.scrollTop=body.scrollHeight}
  }else{
    c.unread+=1;refreshUnread();updateBadges();
  }
}
function scheduleAutoReply(c){
  /* 连着发好几条时只回一次，否则像机器人应答 */
  if(pendingReplies.has(c.name))return;
  let lastInbound=[...c.msgs].reverse().find(m=>!m.me);
  let kind=lastInbound&&lastInbound.kind==="unseen"?"unseen":"";
  /* 大多数粉丝会回，少部分「忙着去了」，这样不至于每条都秒回 */
  if(Math.random()<.08)return;
  let timer=setTimeout(()=>{
    pendingReplies.delete(c.name);
    deliverReply(c,makeReply(c.name,kind));
  },900+Math.random()*2100);
  pendingReplies.set(c.name,timer);
}
let chatOpenName=null;
function openChat(name){
  let c=conversations.get(name);if(!c)return;
  chatOpenName=name;
  hideNewComments();/* 立刻收起详情页的新评论提示条，不必等下一次 syncDetailLive */
  markConversationRead(name);refreshUnread();updateBadges();
  let messages=c.msgs.slice(-CONV_MSG_CAP);
  document.querySelector("#chat").innerHTML=`<section class="chat-page"><header class="chat-head nav-head"><button id="close-chat" class="nav-back">‹</button><h3 class="nav-title"></h3><span class="nav-spacer"></span></header><div class="chat-body" id="chat-body"></div><form class="chat-compose" id="chat-form"><input id="chat-input" placeholder="说点什么…"><button>发送</button></form></section>`;
  document.querySelector(".chat-head h3").textContent=String(name);
  let box=document.querySelector("#chat-body");
  if(!messages.length){let empty=document.createElement("div");empty.className="empty";empty.innerHTML="<b>✉</b>还没有消息";box.appendChild(empty)}
  else{let lastTs=0;messages.forEach(m=>{appendChatRow(box,{me:m.me,text:m.text,avatar:c.avatar,timeText:(!lastTs||m.ts-lastTs>300000)?fullTimeLabel(m.ts):""});lastTs=m.ts})}
  let layer=document.querySelector("#chat");bumpLayer(layer);
  requestAnimationFrame(()=>{if(box)box.scrollTop=box.scrollHeight});
  document.querySelector("#close-chat").onclick=()=>{chatOpenName=null;closeLayer("chat")};

    views：按 S 曲线逼近目标值（快启动 + 饱和），容量上限只随时间线性缓慢抬高

   heat 随开播时长升到 1；转化率从 0.7x 逼近 1.0x，私信占比最低。
   数字按完整速率增长，通知按类型节流，避免刷屏、也保证私信最不频繁。 */
let startTime=Date.now();

   点赞 5.0%（真实区间 3%~8%，所以不会再出现「点赞占浏览 10%+」的脏数据）
   收藏 1.5%   关注 1.4%   评论 0.45%

const HOT={like:.05,collect:.015,follow:.014,comment:.0045};

const DM_LAG=3000;        /* 私信只比点赞慢 3 秒：刷新后几秒内就开始有人私信，不必干等 */

const BIZ_MIN_LIKES=2000,BIZ_RATIO=.1;

const BIZ_OPEN=["你好，在吗？","打扰一下，冒昧私信～","hi～方便聊两句吗？"];
const BIZ_PITCH=["看到你的笔记数据很好，我们想聊聊内容合作。","我们的产品和你的人设很契合，想寄样给你试试。","想问一下你的图文可以授权我们转载吗？","有长期合作的需求，方便的话加个联系方式聊。","这条笔记我们想投一下薯条，聊聊分成？","我们品牌在找达人合作，报价可以谈。"];
/* 各类通知的最小间隔（毫秒）：数字照常增长，通知按类型节流，
   私信间隔最长（且生成速率最低）→ 私信永远是最不频繁的互动 */
const NOTIFY_GAP={like:800,collect:1000,follow:900,comment:1100,dm:3600};
let lastNotifyAt={};
/* 热度曲线：起步快、后续饱和。开播几秒内就能有明显的浏览与互动，
   之后自然放缓，绝不会像复利那样越滚越爆炸 */
function heatAt(elapsed){return 1-Math.exp(-elapsed/45000)}
/* 转化率随热度从 0.7x 升到 1.0x，只从下方逼近目标值，永远不超过上限 */
function rateMultiplier(elapsed){return .7+heatAt(elapsed)*.3}
/* 单篇笔记的浏览目标：S 曲线（快启动 + 饱和），容量上限只随时间线性缓慢抬高 */
const VIEW_BASE_CAP=260000,VIEW_CAP_GROWTH=.4,VIEW_TAU=180000;

function targetsFor(p,elapsed){

}
/* 私信目标量：用「DM_LAG 之前的浏览水平」× 类目强度，因此私信天然滞后于点赞；
   这个值是累计上限，发不完的额度会一直留着（不再被丢弃） */
function dmTargetFor(p,lifetime){
  let lagged=viewsTarget(Math.max(0,lifetime-DM_LAG));
  let rate=DM_RATE[p.cat]||DM_RATE_DEFAULT;
  return Math.round(lagged*rate*rateMultiplier(lifetime));

/* 爆红时流量会集中砸在最火的那条笔记上 */

/* 私信来路：绝大多数是新面孔只打一声招呼；约 8% 会回访一次（每人最多 2 条），不再轮询叠消息 */
const DM_USER_CAP=900;
const dmUsers=[];
function newDmUser(){
  let used=new Set(dmUsers.map(u=>u.name));
  for(const n of conversations.keys())used.add(n);
  let name,guard=0;

const DM_REVISIT=.08;
const DM_PER_PERSON_MAX=2;
function inboundCount(c){return c.msgs.reduce((n,m)=>n+(m.me?0:1),0)}

  if(Math.random()<DM_REVISIT){
    let back=[...conversations.values()].filter(c=>inboundCount(c)>0&&inboundCount(c)<DM_PER_PERSON_MAX);
    if(back.length){let c=back[Math.floor(Math.random()*back.length)];return{name:c.name,avatar:c.avatar}}
  }
  let u=newDmUser();
  if(dmUsers.length<DM_USER_CAP&&!dmUsers.some(x=>x.name===u.name))dmUsers.push(u);

/* 爆款后期混入商务合作私信：通常连发两条（先打招呼，再谈合作） */
function pushBizDm(){

  let unused=BIZ_USERS.filter(b=>!conversations.has(b.name));
  if(!unused.length)return null;
  let b=unused[Math.floor(Math.random()*unused.length)],c=conversationOf(b.name,b.avatar);

/* 个人主页数据统一由「我的笔记」汇总，粉丝/获赞/收藏/浏览一起涨，不会各自漂移 */
function syncProfileStats(){let likes=0,collects=0,views=0,followers=0,comments=0;posts.forEach(p=>{if(p.author!=="我")return;likes+=p.likes||0;collects+=p.collects||0;views+=p.views||0;followers+=p.followers||0;comments+=p.commentCount||0});profileStats.likes=likes;profileStats.collects=collects;profileStats.views=views;profileStats.followers=followers;interactions.like=likes;interactions.collect=collects;interactions.follow=followers;interactions.comment=comments}
const LEAK_KEYS=["like","collect","follow","comment"];
/* 原来「每 300ms 补 12% 差距」换成连续时间常数，每帧按真实 dt 推进，帧率高低都不影响速度 */
const VIEW_TAU_MS=300/Math.log(1/(1-.12));
/* ===== 每帧推进：数字「长」和「逐个递增」都在这里 =====
   以前这些事在 300ms 的定时器里做：目标值一次跳一大截，再靠「每帧放行 1」慢慢抽干，
   于是变成「抽 150ms、停 150ms」的阵发感。现在目标每帧重算，欠账始终很小，
   数字就均匀地一个一个往上走。 */
function simStep(dt){
  if(!engineOn)return;
  posts.forEach(p=>{
    if(p.author!=="我")return;
    let lifetime=Date.now()-(p.startTs||startTime),target=viewsTarget(lifetime),cur=p.views||0;
    let next=cur+(target-cur)*(1-Math.exp(-dt/VIEW_TAU_MS));
    if(next<=cur&&target>cur)next=cur+1;      /* 永远在动，不会卡住 */
    p.views=Math.floor(next>target?target:next);
    p.aMetric=p.aMetric||{like:0,collect:0,follow:0,comment:0,dm:0};
    p.tMetric=targetsFor(p,lifetime);
    /* 每帧每个指标最多放行 +1：界面上的数字永远是一格一格跳，不会一次跳一大截 */
    for(const k of LEAK_KEYS)if(p.aMetric[k]<p.tMetric[k])p.aMetric[k]+=1;
    p.likes=p.aMetric.like+(p.userLike||0);p.collects=p.aMetric.collect+(p.userCollect||0);p.followers=p.aMetric.follow;
    p.commentCount=p.aMetric.comment;
    /* 评论数也是 +1 地长，文本跟着一条条补上（最新的放最前），详情页才有最新内容可插入 */
    p.comments=p.comments||[];
    for(let i=0;i<p.commentCount-p.comments.length;i++)p.comments.unshift(makeComment(p));

function frameLoop(now){

  let dt=Math.min(120,now-lastFrameAt);

/* 定时器只负责私信投递和通知：数字本身已经交给每帧的 simStep 了 */
function engineTick(){
  let elapsed=Date.now()-startTime,heat=heatAt(elapsed),minePosts=posts.filter(p=>p.author==="我");
  if(!minePosts.length)return null;
  let hot=pickHotPost(minePosts),grew=[],dms=0;
  minePosts.forEach(p=>{
    p.aMetric=p.aMetric||{like:0,collect:0,follow:0,comment:0,dm:0};
    /* 数字增长不在这里做；这里只对比「上个 tick 的快照」看哪个指标长过，用来发通知 */
    p.snap=p.snap||{like:0,collect:0,follow:0,comment:0};
    if(p===hot)for(const k of LEAK_KEYS)if(p.aMetric[k]>p.snap[k]&&!grew.includes(k))grew.push(k);
    p.snap={like:p.aMetric.like,collect:p.aMetric.collect,follow:p.aMetric.follow,comment:p.aMetric.comment};
    /* 私信：欠账累积（不丢额度）+ 每 tick 限速渗出，慢慢渗出来而不是齐刷刷涌入 */
    let lifetime=Date.now()-(p.startTs||startTime);
    let dmTarget=dmTargetFor(p,lifetime);
    if(dmTarget>p.aMetric.dm){
      let add=Math.min(DM_TICK_MAX,dmTarget-p.aMetric.dm);
      p.aMetric.dm+=add;
      let biz=p.likes>=BIZ_MIN_LIKES;
      for(let i=0;i<add;i++){
        if(biz&&Math.random()<BIZ_RATIO){pushBizDm();continue}
        let u=pickDmUser();
        /* 爆火之后消息回不过来，会有一部分人写「你可能看不到这条」式的留言 */
        let unseen=!!biz&&Math.random()<UNSEEN_RATIO;

}
/* ===== 发现页「热门笔记」增量刷新 =====
   榜单排序每帧都在变（自己的笔记爆红时会一路往上挤），但整段 innerHTML 重写会
   ①数字闪一下 ②点♥刚好卡在重写瞬间就丢点击，所以这里只做「最小移动量重排」：
   已存在的卡片换位置，缺的用 card() 补一个新节点，掉出榜单的删掉。 */
let hotRankKey="";
function patchHotNotes(){
  let box=document.querySelector("#page .hot-notes");
  if(!box)return;
  let ranked=hotPosts();
  let key=ranked.map(p=>String(p.id)).join(",");
  if(key===hotRankKey)return;
  hotRankKey=key;
  let have=new Map();
  [...box.children].forEach(el=>have.set(el.dataset.id,el));
  let cursor=box.firstElementChild;
  ranked.forEach(p=>{
    let id=String(p.id),el=have.get(id);
    if(!el){
      let shell=document.createElement("div");shell.innerHTML=card(p);el=shell.firstElementChild;have.set(id,el);
    }
    if(el!==cursor)box.insertBefore(el,cursor);
    cursor=el.nextElementSibling;
  });
  /* cursor 之后剩下的都是被挤出榜单的旧卡片 */
  while(cursor){let next=cursor.nextElementSibling;cursor.remove();cursor=next}
}
/* ===== 消息列表增量刷新：只改每行的未读数/时间/预览，并按新消息把行挪到顶部 =====
   以前整页重渲染要等 2 秒一次，中间新来的私信攒着一块儿冒出来，未读数就是「一批批」跳的；
   现在每条私信进来就地 +1，行顺序用最小移动量重排（不会打断正在按的点击） */
let lastMsgVersion=-1;
function rowRefs(el){
  if(!el._refs||!el._refs.b.isConnected)el._refs={b:el.querySelector("b"),small:el.querySelector("small"),meta:el.querySelector(".message-meta"),time:el.querySelector(".message-meta>span")};
  return el._refs;
}
function patchMessageList(){
  let box=document.querySelector("#page .message-group");if(!box)return;
  let rows=conversationRows();
  let have=new Map();box.querySelectorAll(".message").forEach(el=>have.set(el.dataset.name,el));
  if(rows.length)box.querySelector(".empty")?.remove();
  let cursor=box.firstElementChild;
  for(const row of rows){
    let el=have.get(row.name);
    if(!el){
      el=document.createElement("div");el.className="message";el.dataset.name=row.name;el.dataset.chat="1";
      el.innerHTML=`<i class="avatar"></i><div class="message-body"><b></b><small></small></div><div class="message-meta"><span></span></div>`;
    }
    let r=rowRefs(el);
    el.classList.toggle("unread",!!row.unread);
    el.dataset.unread=row.unread||1;
    setText(el.querySelector(".avatar"),row.avatar);
    let av=el.querySelector(".avatar");if(av)av.dataset.user=row.name;
    setText(r.b,row.name);setText(r.small,row.preview);setText(r.time,timeLabel(row.ts));
    let badge=r.meta.querySelector(".chat-badge");
    if(row.unread>0){
      if(!badge){badge=document.createElement("span");badge.className="chat-badge";r.meta.appendChild(badge)}
      setText(badge,row.unread>99?"99+":row.unread);
    }else badge?.remove();
    if(el!==cursor)box.insertBefore(el,cursor);
    cursor=el.nextElementSibling;
  }
  /* 剩下的都是已经被挤掉的旧会话 */
  while(cursor){let next=cursor.nextElementSibling;if(cursor.classList.contains("message"))cursor.remove();cursor=next}
}
function makeActivity(kind,piece){
  let name=randomName(),avatar=avatars[Math.floor(Math.random()*avatars.length)];
  rememberUser(name,avatar);
  if(kind==="like"){markUserLiked(name,piece.id);return[avatar,name,`点赞了你的笔记《${piece.title}》`,"点赞和收藏","unread",1]}
  if(kind==="collect"){markUserCollected(name,piece.id);return[avatar,name,"收藏了你的笔记，准备以后慢慢看","收藏","unread",1]}
  if(kind==="follow")return[avatar,name,"关注了你，想和你成为朋友","新增关注","unread",1];
  if(kind==="comment"){markUserCommented(name,piece.id,avatar);return[avatar,name,`评论了你的笔记：${makeComment(piece)}`,"评论","unread",1]}
  return null;
}
let lastDMNotifyAt=0;
/* 填写昵称和性别（引导页）之前，引擎完全不跑：不会长数字、不会弹私信通知 */
/* 私信列表从 0 条开始，全靠引擎一条条投递进来，刷新后能看到它自己长起来 */
setInterval(()=>{
  if(!engineOn)return;
  dripOthers();
  let r=engineTick();if(!r)return;let{piece,grew,dms}=r;
  let now=Date.now();
  /* 数字照常增长，通知按类型节流；私信弹窗间隔最长，所以私信不会比点赞/关注/收藏/评论更频繁 */
  for(const k of grew){
    if(now-(lastNotifyAt[k]||0)<(NOTIFY_GAP[k]||1000))continue;
    lastNotifyAt[k]=now;
    let m=makeActivity(k,piece);if(m){m[6]=now;liveMessages.unshift(m);liveVersion++};
  }
  if(dms>0&&now-lastDMNotifyAt>=(NOTIFY_GAP.dm||4000)){
    lastDMNotifyAt=now;let c=conversationRows()[0];
    if(c)notifyDm([c.avatar,c.name,c.preview,"私信","",c.unread,c.ts]);
  }
  liveMessages=liveMessages.slice(0,150);save();updateBadges();
  /* 首页/个人页不再整页重渲染：数字由每帧的 patchLiveNumbers 贴着 DOM 改，
     整页换 innerHTML 会带来一次重排 → 数字会「顿一下」。
     消息列表改成有私信进来就地打补丁，未读数跟着 +1，而不是等整页重渲染。 */
  if(currentTab==="messages"){
    if(messageFilter==="all"){if(dmVersion!==lastMsgVersion){lastMsgVersion=dmVersion;patchMessageList()}}
    else if(liveVersion!==lastLiveVersion){lastLiveVersion=liveVersion;patchActivityList()}
  }
  syncDetailLive();
},300);
/* ===== 首页其他笔记的模拟数据 =====
   浏览量由点赞反推（点赞率 5%），收藏、评论再由浏览量派生，四个数字互相自洽。
   注意：爆红曲线只跑 author==="我"；别人只偶尔 drip +1，不会暴涨。 */
function seedOtherStats(){
  posts.forEach(p=>{
    if(p.author==="我")return;
    /* 无条件覆盖：enrichPosts() 之前已经用随机数填过 collects / commentCount，
       这里按真实转化率重算，四个数字才互相对得上（点赞率 5%、收藏 1.5%、评论 0.45%） */
    p.views=Math.round((p.likes||0)/HOT.like);
    p.collects=Math.round(p.views*HOT.collect);
    p.commentCount=Math.max(p.comments.length,Math.round(p.views*HOT.comment));
    p.followers=Math.round((p.likes||0)*HOT.follow/HOT.like);
    p.tags=p.tags||[p.cat];
  });
}
seedOtherStats();
render();
/* ===== 首次进入：必须先填昵称 + 性别，填完才放行 =====
   校验失败的提示走卡片里的文案（不是 alert，不会被浏览器拦、也不需要关按钮），
   昵称和性别都会写进本地资料，下次进来直接跳过这一步。 */
const ONBOARD_KEY="baohongshu-onboard";
let obGender="";
/* 性别用符号表示：女 ♀ 红色、男 ♂ 蓝色；没填性别时用简单的人形图标 */
function genderEmoji(g){
  if(g==="女")return `<span class="g-sym female"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 15v7M8 19h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>`;
  if(g==="男")return `<span class="g-sym male"><svg viewBox="0 0 24 24"><circle cx="9" cy="15" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 10L20 4M16.5 4H20v3.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  return `<span class="g-sym other"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.2" fill="currentColor"/><path d="M3.8 21c0-4.5 3.7-7.2 8.2-7.2s8.2 2.7 8.2 7.2z" fill="currentColor"/></svg></span>`;
}
function genderText(g){return g==="女"||g==="男"?g:"保密"}
function onboardSaved(){try{return JSON.parse(localStorage.getItem(ONBOARD_KEY)||"null")}catch(e){return null}}
function obErr(text){document.querySelector("#ob-err").textContent=text||""}
function paintGender(){
  document.querySelectorAll("#ob-gender button").forEach(b=>b.classList.toggle("on",b.dataset.gender===obGender));
  document.querySelectorAll("#edit-gender button").forEach(b=>b.classList.toggle("on",b.dataset.egender===obGender));
}
function openOnboard(){
  let saved=onboardSaved()||{};
  obGender=saved.gender||myProfile.gender||"";
  let name=(myProfile.name&&myProfile.name!==PROFILE_DEFAULTS.name)?myProfile.name:(saved.name||"");
  document.querySelector("#ob-name").value=name;
  obErr("");
  paintGender();
  document.querySelector("#onboard").classList.add("open");
  document.body.classList.add("onboarding");
  setTimeout(()=>document.querySelector("#ob-name").focus(),260);
}
function closeOnboard(){
  document.querySelector("#onboard").classList.remove("open");
  document.body.classList.remove("onboarding");
}
document.querySelector("#ob-gender").addEventListener("click",e=>{let b=e.target.closest("[data-gender]");if(!b)return;obGender=b.dataset.gender;obErr("");paintGender()});
document.querySelector("#ob-name").addEventListener("input",()=>obErr(""));
document.querySelector("#ob-name").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();document.querySelector("#ob-start").click()}});
document.querySelector("#ob-start").onclick=()=>{
  let input=document.querySelector("#ob-name"),name=input.value.trim().slice(0,12);
  if(!name){obErr("请先填写昵称");input.focus();return}
  if(!obGender){obErr("请选择性别");return}
  myProfile={...myProfile,name,gender:obGender};
  localStorage.setItem(PROFILE_KEY,JSON.stringify(myProfile));
  localStorage.setItem(ONBOARD_KEY,JSON.stringify({name,gender:obGender,ts:Date.now()}));
  closeOnboard();
  startEngine();
  if(currentTab==="me")renderMe();
  toast(`欢迎你，${name}`);
};
/* 老用户（已填过昵称和性别）直接进，不闪引导页 */
if(onboardSaved()){startEngine();closeOnboard()}else openOnboard();
</script>
