<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff8fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1922">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>高质量人生指南</title>
<!--__ICON_LINKS__-->
<style>
  /* ---------- 设计令牌（马卡龙：粉主色 + 紫/黄/绿/蓝点缀，紧凑小圆角） ---------- */
  :root{
    --bg:#fff8fb; --bg-elev:#fff; --ink:#3d3346; --ink-2:#6e6478; --muted:#a39aab;
    --line:#f3e6ee; --line-soft:#fbf3f7; --accent:#f2729c; --accent-deep:#de4f80; --accent-bg:#ffe9f1;
    --lav:#9b87f5; --lav-bg:#f0ecff; --sun:#f5b73b; --sun-bg:#fff4d9;
    --mint:#3fbf98; --mint-bg:#e2f7ef; --sky:#5aa9f0; --sky-bg:#e5f2ff;
    --peach:#ffb59a; --peach-bg:#fff0ea; --star:#ffb020;
    --evA:#3fbf98; --evB:#f0a23b; --evC:#a39aab;
    --chrome:rgba(255,248,251,.9);
    --press:#fbeef4; --chip:#fff;
    --shadow-card:0 2px 8px rgba(222,79,128,.06);
    --shadow-lift:0 6px 18px rgba(222,79,128,.12);
    --shadow-chrome:0 -1px 0 var(--line);

    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);

    --dur-push:340ms; --dur-fade:150ms; --dur-acc:320ms; --dur-press:120ms;

    --r:12px; --r-lg:14px; --r-pill:999px;
    /* 顶 inset：刘海 --safe-t + 小红书容器导航 --nav-h（见 xiaohongshu/guidelines.md） */
    --safe-t:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-b:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    --nav-h:0px;
    --xhs-nav:calc(var(--safe-t) + var(--nav-h));
    --tab-h:calc(54px + var(--safe-b));
  }
  /* tools/pack.mjs 打小红书包时给 <html> 加 env-xhs：容器自带约 44px 顶栏 */
  html.env-xhs{--nav-h:44px}
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1d1922; --bg-elev:#28232e; --ink:#f7f2fa; --ink-2:#cfc4d6; --muted:#958aa0;
      --line:#3a3242; --line-soft:#2f2936; --accent:#ff8fb3; --accent-deep:#ff79a6; --accent-bg:#40283a;
      --lav:#b3a3ff; --lav-bg:#2f2a48; --sun:#ffcb5c; --sun-bg:#3d3424;
      --mint:#6ad6b2; --mint-bg:#213a33; --sky:#82bdf6; --sky-bg:#22324a;
      --peach:#ffb59a; --peach-bg:#3d2c2a; --star:#ffc24d;
      --evA:#6ad6b2; --evB:#ffc05c; --evC:#958aa0;
      --chrome:rgba(29,25,34,.9);
      --press:#352d3c; --chip:#28232e;
      --shadow-card:0 2px 8px rgba(0,0,0,.3);
      --shadow-lift:0 6px 18px rgba(0,0,0,.4);
      --shadow-chrome:0 -1px 0 var(--line);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{ -webkit-text-size-adjust:100%; }
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}

  /* 应用外壳：整页不滚动，滚动交给每个 .page */
  body{
    background:var(--bg);
    color:var(--ink);
    font:1rem/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    max-width:640px; margin:0 auto;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  input{font:inherit}
  a{color:#4a6ea8;text-decoration:none}
  @media (prefers-color-scheme: dark){ a{color:#7fa8e0} }

  /* ---------- 顶栏：常驻搜索（不再有第二个搜索框） ---------- */
  .topbar{flex:none;background:var(--chrome);backdrop-filter:saturate(160%) blur(16px);
    -webkit-backdrop-filter:saturate(160%) blur(16px);padding:calc(8px + var(--xhs-nav)) 14px 8px;z-index:20}
  .tbrow{display:flex;align-items:center;gap:2px}
  .tbback{flex:none;width:0;height:34px;border-radius:50%;background:var(--press);color:var(--ink);
    opacity:0;overflow:hidden;pointer-events:none;font-size:1.4375rem;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0 0 2px;
    transition:width var(--dur-fade) var(--ease-out),opacity var(--dur-fade) var(--ease-out)}
  body.searching .tbback{width:34px;opacity:1;pointer-events:auto;margin-right:8px}
  .tbback:active{transform:scale(.9)}
  .searchbox{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--bg-elev);
    border:1.5px solid var(--line);border-radius:var(--r);padding:7px 11px;
    transition:border-color var(--dur-fade) var(--ease-out)}
  body.searching .searchbox{border-color:var(--accent)}
  .sico{flex:none;font-size:.875rem;opacity:.5;line-height:1}
  #q{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:16px;padding:0}
  #q::placeholder{color:var(--muted);opacity:.72}
  @media (prefers-color-scheme: dark){
    #q::placeholder{color:rgba(247,242,250,.55);opacity:1}
  }
  .sclr{flex:none;width:0;opacity:0;overflow:hidden;pointer-events:none;color:var(--muted);font-size:.8125rem;line-height:1;
    transition:width var(--dur-fade) var(--ease-out),opacity var(--dur-fade) var(--ease-out)}
  body.searching .sclr{width:18px;opacity:1;pointer-events:auto}
  /* 精选/收藏 tab：顶栏只藏视觉仍占位，避免与首页切换时 #stack 高度突变 */
  body.search-chrome-off .topbar{visibility:hidden;pointer-events:none}
  body.search-chrome-off .topbar *{pointer-events:none}
  /* 二级列表页：真正卸掉顶栏，把空间交给 listhead；小红书仍用 --xhs-nav 让开容器导航 */
  body.search-chrome-gone .topbar{display:none}
  body.search-chrome-gone #stack{margin-top:var(--xhs-nav)}
  body.search-chrome-gone .page > .h1:first-child{margin-top:0}

  /* ---------- 页面层 ---------- */
  #stack{flex:1;position:relative;min-height:0;overflow:hidden}
  .page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;background:var(--bg);padding:0 14px 32px}
  .page[hidden]{display:none}
  .page.animating{will-change:transform,opacity}

  /* ---------- 排版：字号分级、字距随字号变 ---------- */
  .h1{font-size:1.375rem;font-weight:700;letter-spacing:-0.021em;line-height:1.25;margin:18px 2px 3px}
  .sub{color:var(--muted);font-size:.8125rem;letter-spacing:0.002em;margin:0 2px 14px;line-height:1.5}
  .seclabel{font-size:.75rem;color:var(--ink-2);font-weight:700;letter-spacing:0.03em;margin:18px 2px 8px;
    display:flex;align-items:center;gap:6px}
  .seclabel::before{content:'';width:6px;height:6px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  .seclabel .delgrp{font-size:.75rem;letter-spacing:.02em;color:#a2543a;padding:2px 0}

  /* 按场景 / 按章节：留在顶部，它是下面列表的控制项，滚走就没法切了 */
  .segwrap{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
    margin:0 -14px;padding:8px 14px 6px}
  .seg{display:flex;gap:4px;background:var(--line-soft);border-radius:10px;padding:3px;margin:0}
  .seg button{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:.8125rem;color:var(--muted);
    transition:background var(--dur-fade) ease,color var(--dur-fade) ease}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700;border:0;box-shadow:none}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .seclist{margin-top:4px}
  .cell{--c:var(--accent);--cb:var(--accent-bg);background:var(--cb);border-radius:var(--r);padding:10px 4px 8px;
    text-align:center;transition:transform var(--dur-press) var(--ease-out)}
  .cell:nth-child(5n+2){--c:var(--lav);--cb:var(--lav-bg)}
  .cell:nth-child(5n+3){--c:var(--sun);--cb:var(--sun-bg)}
  .cell:nth-child(5n+4){--c:var(--mint);--cb:var(--mint-bg)}
  .cell:nth-child(5n+5){--c:var(--sky);--cb:var(--sky-bg)}
  .cell:active{transform:scale(.94)}
  .cell .ico{font-size:1.25rem;display:block;margin-bottom:4px;line-height:1}
  .cell .nm{font-size:.71875rem;font-weight:700;line-height:1.25;display:block;color:var(--ink)}
  .cell .ct{font-size:.625rem;color:color-mix(in srgb,var(--c) 75%,var(--ink));margin-top:2px;display:block;font-weight:600}

  .row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);
    width:100%;transition:background var(--dur-press) ease}
  .row:active{background:var(--press)}
  .row .num{--c:var(--accent);--cb:var(--accent-bg);flex:0 0 24px;height:24px;border-radius:7px;background:var(--cb);color:var(--c);
    font-size:.6875rem;font-weight:800;display:flex;align-items:center;justify-content:center}
  .row:nth-child(5n+2) .num{--c:var(--lav);--cb:var(--lav-bg)}
  .row:nth-child(5n+3) .num{--c:var(--sun);--cb:var(--sun-bg)}
  .row:nth-child(5n+4) .num{--c:var(--mint);--cb:var(--mint-bg)}
  .row:nth-child(5n+5) .num{--c:var(--sky);--cb:var(--sky-bg)}
  .row .tt{flex:1;font-size:.875rem;line-height:1.35;min-width:0;letter-spacing:-0.006em}
  .row .tt em{font-style:normal;display:block;font-size:.71875rem;color:var(--muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ct{font-size:.75rem;color:var(--muted);flex:none}
  .row .arw{color:var(--muted);font-size:1.125rem;flex:none;opacity:.5}

  /* ---------- 卡片 ---------- */
  .card{background:var(--bg-elev);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:12px 13px 11px;margin-bottom:8px;box-shadow:var(--shadow-card);
    transition:box-shadow 220ms var(--ease-out),border-color 220ms ease}
  .card.open{box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .card-head{display:flex;align-items:flex-start;gap:8px}
  .card-head h3{margin:0;font-size:.9375rem;font-weight:700;line-height:1.4;letter-spacing:-0.01em;flex:1}
  .star{font-size:1.125rem;line-height:1;color:var(--muted);opacity:.45;padding:1px 0 0;flex:none;
    transition:transform 160ms var(--ease-out),color 160ms ease,opacity 160ms ease}
  .star.on{color:var(--star);opacity:1;transform:scale(1.12)}
  .star:active{transform:scale(.82)}
  .plain{margin:5px 0 0;font-size:.875rem;line-height:1.6;color:var(--ink-2)}
  .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .bg{font-size:.625rem;padding:2px 7px;border-radius:6px;background:var(--line-soft);color:var(--ink-2);
    white-space:nowrap;font-weight:600}
  .bg.a{color:var(--mint);background:var(--mint-bg)}
  .bg.b{color:var(--sun);background:var(--sun-bg)}
  .bg.c{color:var(--evC);background:var(--line-soft)}
  .bg.roi3{color:var(--accent-deep);background:var(--accent-bg)}
  .bg.roi2{color:var(--sky);background:var(--sky-bg)}
  .bg.warn{color:#e5675a;background:#ffece8}
  @media (prefers-color-scheme: dark){ .bg.warn{color:#ff9b8c;background:#43282a} }

  /* ---------- 展开 / 收起：grid-template-rows 0fr→1fr（不用 height） ---------- */
  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-acc) var(--ease-out)}
  .card.open .detail{grid-template-rows:1fr}
  .detail-inner{overflow:hidden;min-height:0;opacity:0;
    transition:opacity 160ms ease}
  .card.open .detail-inner{opacity:1;transition:opacity 240ms ease 90ms}

  .whyline{font-size:.71875rem;color:var(--muted);margin-top:9px;line-height:1.5}
  .detail-panel{margin-top:10px;padding:10px 11px;border-radius:10px;background:var(--line-soft)}
  .drow{margin-top:8px;font-size:.8125rem;line-height:1.55}
  .drow:first-child{margin-top:0}
  .dl{display:inline-block;font-size:.625rem;font-weight:700;color:var(--accent-deep);background:var(--accent-bg);
    padding:1px 6px;border-radius:5px;margin-bottom:3px}
  .dv{color:var(--ink-2);word-break:break-word}
  .drow.srcplain .dv{font-size:.8125rem}
  .refs{display:flex;flex-wrap:wrap;gap:6px}
  .refchip{font-size:.6875rem;padding:3px 8px;border-radius:6px;background:var(--lav-bg);
    color:var(--lav);line-height:1.4;text-align:left;font-weight:600}
  .refchip:active{opacity:.8}
  .detail-actions{display:flex;gap:6px;margin-top:10px}
  .detail-actions .act{flex:1;min-width:0;padding:7px 10px;border-radius:8px;font-size:.78125rem;font-weight:700;
    text-align:center;border:none;
    transition:transform var(--dur-press) var(--ease-out),background var(--dur-press) ease,opacity 160ms ease}
  .detail-actions .act:active{transform:scale(.97)}
  .act-src{background:var(--sky-bg);color:var(--sky)}
  .act-src:active{opacity:.85}
  .act-share{background:var(--accent);color:#fff;border:0}
  .act-share:active{opacity:.92}
  abbr.term{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}

  /* ---------- 列表页头部（跟随本页一起滑入） ---------- */
  .listhead{position:sticky;top:0;z-index:30;background:var(--chrome);backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);padding:10px 14px 12px;display:flex;align-items:center;gap:10px;
    margin:0 -14px 10px;box-shadow:0 1px 0 var(--line-soft)}
  .back{flex:none;width:32px;height:32px;border-radius:10px;background:var(--accent-bg);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;font-size:1.4375rem;line-height:1;
    padding:0 0 2px;transition:transform var(--dur-press) var(--ease-out),background var(--dur-press) ease}
  .back:active{transform:scale(.9)}
  .listhead .t{flex:1;min-width:0}
  .listhead .t b{display:block;font-size:.96875rem;font-weight:650;letter-spacing:-0.011em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listhead .t span{font-size:.71875rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:1px}
  .fbtn{font-size:.75rem;padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg-elev);
    color:var(--ink-2);flex:none;transition:transform var(--dur-press) var(--ease-out),background var(--dur-press) ease}
  .fbtn:active{transform:scale(.95)}
  .fbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .more{width:100%;padding:10px;margin-top:4px;border-radius:var(--r);border:1.5px dashed color-mix(in srgb,var(--accent) 35%,var(--line));
    color:var(--accent-deep);font-size:.8125rem;font-weight:600;text-align:center;background:var(--bg-elev)}
  .more:active{background:var(--press)}

  /* ---------- 收藏列表 ---------- */
  .mine-page{padding-top:10px}
  .mine-page .empty{padding:24px 8px 16px;line-height:1.55;margin:0;font-size:.8125rem}
  .mine-page .card{margin-bottom:8px;padding:13px 13px 11px}

  /* ---------- 精选 ---------- */
  .pick-page{padding-top:10px}
  .hero{position:relative;overflow:hidden;color:#fff;border-radius:var(--r-lg);
    padding:14px 14px 13px;margin-top:0;
    background:linear-gradient(120deg,#ff8db3 0%,#f9a3c7 45%,#b9a5ff 100%);
    box-shadow:0 6px 16px rgba(242,114,156,.25)}
  .hero::after{content:'✿';position:absolute;pointer-events:none;line-height:1;
    font-size:2.75rem;right:-6px;bottom:-12px;color:rgba(255,255,255,.22)}
  @media (prefers-color-scheme: dark){
    .hero{background:linear-gradient(120deg,#c45a86,#a1609a 50%,#6e5cc4)}
  }
  .hero .tag{font-size:.6875rem;font-weight:700;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:6px}
  .hero-top,.hero h2,.hero p{position:relative;z-index:1}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hero-side{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .hero-rand,.hero .heart{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;line-height:1;background:#fff;box-shadow:0 2px 6px rgba(222,79,128,.18);
    transition:transform 160ms var(--ease-out)}
  .hero-rand{color:var(--accent-deep)}
  .hero-rand svg{display:block;pointer-events:none}
  .hero-rand:active{transform:scale(.88)}
  .hero h2{margin:8px 0 0;font-size:1rem;font-weight:800;line-height:1.4;padding-right:28px}
  .hero .heart{font-size:.9375rem;color:var(--accent-deep)}
  .hero .heart.on{color:#fff;background:var(--accent-deep);transform:none}
  .hero .heart:active{transform:scale(.88)}
  .hero p{margin:5px 0 0;font-size:.8125rem;line-height:1.6;opacity:.95;padding-right:28px}
  .banner{--c:var(--accent);--cb:var(--accent-bg);background:var(--bg-elev);border:1px solid var(--line);
    border-radius:var(--r);padding:10px 11px;display:flex;align-items:center;gap:10px;margin-bottom:8px;width:100%;
    box-shadow:var(--shadow-card);transition:transform var(--dur-press) var(--ease-out)}
  .banner[data-alla]{--c:var(--mint);--cb:var(--mint-bg)}
  .banner[data-dispute]{--c:var(--sun);--cb:var(--sun-bg)}
  .banner:active{transform:scale(.97)}
  .banner::before{content:'';flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
  .banner .b1{flex:1;min-width:0}
  .banner b{font-size:.84375rem;display:block}
  .banner span{font-size:.71875rem;color:var(--muted);display:block;line-height:1.4;margin-top:1px}
  .banner .n{flex:none;min-width:36px;padding:3px 7px;border-radius:8px;text-align:center;
    font-size:.8125rem;font-weight:800;color:var(--c);background:var(--cb)}

  /* ---------- 底部页签 ---------- */
  .tabbar{flex:none;background:var(--chrome);
    backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
    display:flex;padding:5px 0 calc(5px + var(--safe-b));box-shadow:var(--shadow-chrome)}
  .tabbar button{flex:1;padding:3px 0;text-align:center;color:var(--muted);font-size:.65625rem;
    transition:color 180ms ease,transform var(--dur-press) var(--ease-out)}
  .tabbar button:active{transform:scale(.93)}
  .tabbar button .ti{display:block;font-size:1.125rem;line-height:1.4;filter:grayscale(1);opacity:.45;
    transition:filter 180ms ease,opacity 180ms ease,transform 220ms var(--ease-out)}
  .tabbar button.on{color:var(--accent-deep);font-weight:700}
  .tabbar button.on .ti{filter:none;opacity:1;transform:translateY(-1px) scale(1.12)}

  /* ---------- 抽屉 ---------- */
  .mask{position:fixed;inset:0;background:rgba(58,54,50,.28);z-index:40;opacity:0;pointer-events:none;
    transition:opacity 240ms ease}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg-elev);
    border-radius:16px 16px 0 0;padding:0;
    max-width:640px;margin:0 auto;transform:translateY(100%);
    transition:transform 320ms var(--ease-drawer);max-height:82dvh;
    display:flex;flex-direction:column;overflow:hidden;
    overscroll-behavior:contain;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
  .sheet.show{transform:translateY(0)}
  .sheet::before{content:'';display:block;width:32px;height:4px;margin:10px auto 0;border-radius:var(--r-pill);
    background:var(--line);flex:none}
  .sheet-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;padding:8px 16px 12px}
  .sheet-foot{flex:none;padding:10px 16px calc(12px + var(--safe-b));
    background:var(--bg-elev);box-shadow:0 -1px 0 var(--line);display:flex;flex-direction:column;gap:8px}
  .sheet-head{display:flex;align-items:center;gap:10px;margin:0 0 4px}
  .sheet-head h4{margin:0;flex:1;font-size:.9375rem;font-weight:800}
  .sheet-clear{flex:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--line-soft);color:var(--ink-2);border:0;padding:0;line-height:1;
    opacity:1;transition:opacity 120ms ease}
  .sheet-clear:disabled,.sheet-clear.is-empty{
    opacity:.28;pointer-events:none}
  .sheet-clear:not(:disabled):active{transform:scale(.92)}
  .sheet-clear svg{display:block;pointer-events:none}
  .sheet h4{margin:0 0 3px;font-size:.9375rem;font-weight:800}
  .sheet .sh{font-size:.75rem;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .fsect{margin-bottom:17px}
  .fsect .fl{font-size:.78125rem;color:var(--muted);margin-bottom:8px}
  .frow{display:flex;flex-wrap:wrap;gap:7px}
  .frow .tab{padding:7px 12px;border-radius:8px;border:0;
    background:var(--line-soft);color:var(--ink-2);font-size:.75rem;font-weight:600;
    transition:background var(--dur-fade) ease,color var(--dur-fade) ease}
  .frow .tab.on{background:var(--accent);color:#fff;font-weight:700}
  .frow .tab:active{transform:scale(.96)}
  .srclist{display:flex;flex-direction:column;gap:8px}
  .srcrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:10px;
    border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:var(--line-soft);transition:transform var(--dur-press) var(--ease-out),background var(--dur-press) ease}
  .srcrow:active{transform:scale(.985)}
  .srcrow .m{flex:1;min-width:0}
  .srcrow .dom{display:block;font-size:.75rem;font-weight:600;color:var(--accent);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcrow .cite{margin-top:3px;font-size:.75rem;color:var(--muted);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sheet .done{width:100%;margin:0;padding:11px;border-radius:10px;
    background:var(--accent);color:#fff;border:0;
    font-size:.875rem;font-weight:700;text-align:center;transition:transform var(--dur-press) var(--ease-out)}
  .sheet .done:active{transform:scale(.98)}
  .sheet .done.ghost{background:var(--line-soft);color:var(--ink);border:0;font-weight:600}
  .empty{text-align:center;color:var(--muted);font-size:.875rem;padding:52px 20px;line-height:1.85}

  /* 轻提示：不遮挡内容，跟手指近 */
  .toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px);transform:translateX(-50%) translateY(8px);
    background:var(--accent);color:#fff;font-size:.78125rem;font-weight:700;
    padding:7px 14px;border-radius:10px;opacity:0;
    transition:opacity 200ms ease,transform 200ms var(--ease-out);z-index:60;pointer-events:none;
    white-space:nowrap;max-width:90vw;box-shadow:var(--shadow-lift)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .foot{margin:28px 2px 6px;font-size:.71875rem;color:var(--muted);line-height:1.8}
  .foot.foot-compact{margin-top:14px;line-height:1.55;text-align:center}
  .foot a{border-bottom:1px solid var(--line)}

  /* 减少动态：保留透明度/颜色，去掉位移 */
  @media (prefers-reduced-motion: reduce){
    .detail{transition:none}
    .detail-inner{transition:opacity 120ms ease}
    .card.open .detail-inner{transition:opacity 150ms ease}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="tbrow">
    <button class="tbback" id="tbback" aria-label="返回">‹</button>
    <label class="searchbox">
      <span class="sico" aria-hidden="true">🔍</span>
      <input id="q" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
             placeholder="搜索建议、来源、正文…" aria-label="搜索">
      <button class="sclr" id="sclr" aria-label="清空">✕</button>
    </label>
  </div>
</header>

<div id="stack">
  <section class="page" id="p0"></section>
  <section class="page" id="p1" hidden></section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="home"><span class="ti">🏠</span>首页</button>
  <button data-tab="pick"><span class="ti">✨</span>精选</button>
  <button data-tab="mine"><span class="ti">🔖</span>收藏</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据由 tools/build.mjs 从原文编译内联。原文：《高性价比人生指南》
   https://github.com/eternity4719/HowToLiveBetter · CC BY 4.0
   ============================================================ */
const DB = /*__DATA__*/null;

const ITEMS = DB.items;
const BYID = Object.create(null); ITEMS.forEach(i => BYID[i.id] = i);
const SECBY = Object.create(null); DB.secs.forEach(s => SECBY[s.n] = s);
const SCNBY = Object.create(null); DB.scn.forEach(s => SCNBY[s.id] = s);
const MONEY = { '0': '不花钱', '少': '花少量钱', '多': '花不少钱' };
const TIME = { '少': '顺手', '中': '花几小时', '多': '每天占时间' };
const WILL = { '否': '不用毅力', '些': '要一点毅力', '是': '要很多毅力' };
const ROILV = { '极高': 3, '高': 2, '一般': 1 };

ITEMS.forEach(i => {
  const s = SECBY[i.sec];
  i.hay = [i.title, i.human, i.gain, i.cost, i.note, i.src, i.grade, s ? s.title : '',
    i.sc.map(x => SCNBY[x] ? SCNBY[x].nm : '').join(' ')].join('\n').toLowerCase();
});

/* 术语表 */
let GRE = null;
(function () {
  // 单字母术语（d / g / r 这类效应量符号）不参与自动注释，容易误伤
  const g = DB.gloss.filter(x => x.t.length > 1).sort((a, b) => b.t.length - a.t.length);
  const isLatin = x => /^[A-Za-z0-9%. ]+$/.test(x.t);
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const latin = g.filter(isLatin).map(x => esc(x.t));
  const cjk = g.filter(x => !isLatin(x)).map(x => esc(x.t));
  const build = lookbehind => {
    const parts = [];
    if (latin.length) parts.push((lookbehind ? '(?<![A-Za-z0-9])' : '') + '(?:' + latin.join('|') + ')(?![A-Za-z0-9])');
    if (cjk.length) parts.push('(?:' + cjk.join('|') + ')');
    return parts.length ? new RegExp(parts.join('|'), 'g') : null;
  };
  // Chrome 61 级 WebView 不支持后行断言
  try { GRE = build(true); } catch (e) { GRE = build(false); }
})();
const GBY = Object.create(null); DB.gloss.forEach(g => GBY[g.t] = g.m);

/* ---------------- 状态 ---------------- */
const LS = 'htlb.pocket.v1';
let S = Object.assign({
  fav: [], theme: 'home', mode: 'scn', pickDay: '', pickId: ''
}, load());
delete S.groups;
delete S.want;
delete S.done;
delete S.group;
if (S.theme !== 'home' && S.theme !== 'pick' && S.theme !== 'mine') S.theme = 'home';
S.theme = 'home'; // 每次打开默认首页
function load() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }

const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let EX = new Set();
let F = { grade: [], ratio: [], lens: [], money: [], time: [], will: [], flag: [] };
let Q = '';
let navStack = [];
let cur = { v: 'tab', theme: S.theme, scroll: 0 };
let LIMIT = 40;
const PAGE = 40;

/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1700);
}
function buzz(n) { if (navigator.vibrate) { try { navigator.vibrate(n); } catch (e) { } } }

const passF = i => {
  if (F.grade.length && !F.grade.includes(i.grade)) return false;
  if (F.ratio.length && !F.ratio.includes(i.ratio)) return false;
  if (F.lens.length && !F.lens.includes(i.lens)) return false;
  if (F.money.length && !F.money.includes(i.money)) return false;
  if (F.time.length && !F.time.includes(i.time)) return false;
  if (F.will.length && !F.will.includes(i.will)) return false;
  if (F.flag.includes('争议') && !i.dispute) return false;
  if (F.flag.includes('待核实') && !i.todo) return false;
  return true;
};
const matchQ = i => !Q || i.hay.includes(Q.toLowerCase());
const fCount = () => F.grade.length + F.ratio.length + F.lens.length + F.money.length +
  F.time.length + F.will.length + F.flag.length;

/* 富文本：转义 → 交叉引用可点 */
function rich(txt, sec) {
  let h = esc(txt);
  h = h.replace(/见第\s*(\d+)\s*节第\s*(\d+)\s*条/g, (m, a, b) =>
    BYID['s' + a + '-' + b] ? `<button class="refchip" data-ref="${a}-${b}">${m}</button>` : m);
  h = h.replace(/见本节第\s*(\d+)\s*条/g, (m, b) =>
    BYID['s' + sec + '-' + b] ? `<button class="refchip" data-ref="${sec}-${b}">${m}</button>` : m);
  return h;
}
function termify(root) {
  if (!GRE) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  let n; while ((n = w.nextNode())) if (!n.parentElement.closest('abbr,a,button')) nodes.push(n);
  for (const node of nodes) {
    const s = node.nodeValue;
    GRE.lastIndex = 0;
    if (!GRE.test(s)) continue;
    GRE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = GRE.exec(s))) {
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const ab = document.createElement('abbr');
      ab.className = 'term'; ab.textContent = m[0]; ab.title = GBY[m[0]] || '';
      frag.appendChild(ab); last = m.index + m[0].length;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

/* ---------------- 来源 ----------------
   原始 src 是一整段 400 字上下、最多十几个链接的引用，铺在详情里没人看。
   这里拆成「一条引用 = 一条可点链接」，详情里只留一个按钮。 */
function srcLinks(raw) {
  const out = [], seen = Object.create(null);
  String(raw == null ? '' : raw).split(/\s*[;；]\s*/).forEach(chunk => {
    const txt = chunk.replace(/https?:\/\/\S+/g, '').replace(/[\s，,。、；;）)]+$/, '').trim();
    const urls = chunk.match(/https?:\/\/[^\s；;，、）)】」"'<>]+/g) || [];
    if (!urls.length) { if (txt) out.push({ url: '', text: txt }); return; }
    urls.forEach(u => {
      const url = u.replace(/[.,;:。，；、)\]}]+$/, '');
      if (seen[url]) return;              // 同一条 src 里重复引同一份文献时只留一次
      seen[url] = 1;
      out.push({ url, text: txt });
    });
  });
  return out;
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
/* 小工具 / QMuse 容器常无系统分享面板，统一走剪贴板 */
function copyText(text, okMsg) {
  const ok = () => toast(okMsg || '已复制');
  const fb = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy') ? ok() : toast('复制失败');
      ta.remove();
    } catch (e) { toast('复制失败'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb);
  else fb();
}
function copyLink(u) { copyText(u, '已复制链接'); }

/* 来源：无外链平铺正文；有外链用底栏「来源」按钮（单链复制 / 多链抽屉） */
function srcField(i) {
  const raw = String(i.src || '').trim();
  if (!raw) return '';
  const links = srcLinks(raw).filter(l => l.url);
  if (links.length) return '';
  return `<div class="drow srcplain"><span class="dl">来源</span><div class="dv">${esc(raw)}</div></div>`;
}
function srcBtn(i) {
  const raw = String(i.src || '').trim();
  if (!raw || !srcLinks(raw).filter(l => l.url).length) return '';
  return `<button type="button" class="act act-src" data-act="src" data-id2="${i.id}">来源</button>`;
}
function detailActions(i) {
  const src = srcBtn(i);
  const share = `<button type="button" class="act act-share" data-act="share" data-id2="${i.id}">分享</button>`;
  return `<div class="detail-actions">${src}${share}</div>`;
}

/* ---------------- 卡片 ---------------- */
function card(i, scnId) {
  const on = S.fav.includes(i.id);
  const refs = (i.refs || []).map(r =>
    `<button class="refchip" data-ref="${r.sec}-${r.n}">第 ${r.sec} 节第 ${r.n} 条 ${esc(r.title)}</button>`).join('');
  const why = scnId
    ? (i.why && i.why[scnId] ? `命中关键词：${i.why[scnId].map(esc).join('、')}` : `所属章节：第 ${i.sec} 节`)
    : '';
  return `<article class="card${EX.has(i.id) ? ' open' : ''}" data-id="${i.id}">
    <div class="card-head">
      <h3>${esc(i.title)}</h3>
      <button class="star${on ? ' on' : ''}" data-star="${i.id}" aria-label="收藏">${on ? '★' : '☆'}</button>
    </div>
    <p class="plain" data-rich="${i.id}">${rich(i.human, i.sec)}</p>
    <div class="badges">
      <span class="bg ${i.grade.toLowerCase()}">证据 ${i.grade}</span>
      <span class="bg roi${ROILV[i.ratio]}">性价比 ${i.ratio}</span>
      <span class="bg">${esc(i.lens || '')}</span>
      <span class="bg">${esc(MONEY[i.money] || '')}</span>
      <span class="bg">${esc(WILL[i.will] || '')}</span>
      ${i.dispute ? '<span class="bg warn">争议</span>' : ''}
      ${i.todo ? '<span class="bg warn">待核实</span>' : ''}
    </div>
    ${why ? `<div class="whyline">${why}</div>` : ''}
    <div class="detail"><div class="detail-inner">
      <div class="detail-panel">
        <div class="drow"><span class="dl">成本</span><div class="dv">${esc(i.cost)}</div></div>
        <div class="drow"><span class="dl">收益</span><div class="dv" data-rich="${i.id}">${rich(i.gain, i.sec)}</div></div>
        ${srcField(i)}
        ${i.note ? `<div class="drow"><span class="dl">备注</span><div class="dv" data-rich="${i.id}">${rich(i.note, i.sec)}</div></div>` : ''}
        ${refs ? `<div class="drow"><span class="dl">相关条目</span><div class="refs">${refs}</div></div>` : ''}
        ${detailActions(i)}
      </div>
    </div></div>
  </article>`;
}
function listHTML(arr, limit, scnId) {
  if (!arr.length) return `<p class="empty">没有符合条件的条目<br>试试减少筛选条件</p>`;
  const slice = arr.slice(0, limit), rest = arr.length - slice.length;
  return slice.map(i => card(i, scnId)).join('') +
    (rest > 0 ? `<button class="more" data-more="1">还有 ${rest} 条，继续加载</button>` : '');
}
function afterRender(root) { root.querySelectorAll('[data-rich]').forEach(n => termify(n)); }

/* ---------------- 各页面 HTML ---------------- */
function pageHome() {
  const seg = `<div class="segwrap"><div class="seg">
    <button data-mode="scn" class="${S.mode === 'scn' ? 'on' : ''}">按场景</button>
    <button data-mode="sec" class="${S.mode === 'sec' ? 'on' : ''}">按章节</button>
  </div></div>`;
  if (S.mode === 'scn') {
    return seg + `<div class="grid">${DB.scn.map(s => `<button class="cell" data-scn="${s.id}">
        <span class="ico">${s.ico}</span><span class="nm">${esc(s.nm)}</span><span class="ct">${s.items.length} 条</span>
      </button>`).join('')}</div>
      <p class="foot foot-compact">一条建议可属多个场景；卡片上会写命中原因。</p>`;
  }
  return seg + `<div class="seclist">${DB.secs.map(s => `<button class="row" data-sec="${s.n}">
      <span class="num">${s.n}</span>
      <span class="tt">${esc(s.title)}${s.desc ? `<em>${esc(s.desc.slice(0, 38))}…</em>` : ''}</span>
      <span class="ct">${s.count}</span><span class="arw">›</span>
    </button>`).join('')}</div>`;
}

function pickDayKey(d = new Date()) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function pickDailyItem(d = new Date()) {
  return ITEMS[(d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate()) % ITEMS.length];
}
function syncPickDay() {
  const k = pickDayKey();
  if (S.pickDay !== k) { S.pickDay = k; S.pickId = ''; save(); }
}
function pickHeroItem() {
  syncPickDay();
  if (S.pickId && BYID[S.pickId]) return BYID[S.pickId];
  return pickDailyItem();
}
function spinPickHero() {
  syncPickDay();
  let i = ITEMS[Math.floor(Math.random() * ITEMS.length)];
  const cur = pickHeroItem();
  if (ITEMS.length > 1) while (i.id === cur.id) i = ITEMS[Math.floor(Math.random() * ITEMS.length)];
  S.pickId = i.id;
  save();
  return i;
}

function pagePick() {
  const d = new Date();
  const hero = pickHeroItem();
  const easy = ITEMS.filter(i => i.ratio === '极高' && i.cs === 0);
  const dis = ITEMS.filter(i => i.dispute);
  const topA = ITEMS.filter(i => i.grade === 'A');
  const onT = S.fav.includes(hero.id);
  return `<div class="pick-page"><div class="hero">
      <div class="hero-top">
        <div class="tag">今日精选 · ${d.getMonth() + 1} 月 ${d.getDate()} 日</div>
        <div class="hero-side">
          <button type="button" class="hero-rand" data-pick-rand="1" aria-label="随机换一条"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
          <button class="heart${onT ? ' on' : ''}" data-star="${hero.id}" aria-label="收藏">♥</button>
        </div>
      </div>
      <h2>${esc(hero.title)}</h2>
      <p data-rich="${hero.id}">${rich(hero.human, hero.sec)}</p>
    </div>
    <p class="seclabel">省力清单</p>
    <button class="banner" data-easy="1">
      <div class="b1"><b>不花钱 · 不花时间 · 不用毅力</b><span>收益还落在最大一档</span></div>
      <div class="n">${easy.length}</div>
    </button>
    <button type="button" class="banner" data-alla="1">
      <div class="b1"><b>结论最硬的</b><span>证据等级 A，有具体数字</span></div>
      <div class="n">${topA.length}</div>
    </button>
    <button class="banner" data-dispute="1">
      <div class="b1"><b>有争议的</b><span>原书标了反方证据，做决定前先看一眼</span></div>
      <div class="n">${dis.length}</div>
    </button></div>`;
}

function pageMine() {
  const arr = S.fav.map(id => BYID[id]).filter(Boolean);
  return `<div class="mine-page">
    ${arr.length ? listHTML(arr, LIMIT) : '<p class="empty">还没有收藏，去条目卡片点 ☆</p>'}
  </div>`;
}

function pageList(c) {
  const n = fCount();
  const arr = c.items.filter(i => matchQ(i) && passF(i));
  return `<div class="listhead">
      <button class="back" data-back="1" aria-label="返回">‹</button>
      <div class="t"><b>${esc(c.title)}</b><span>${esc(c.sub || '')}${Q ? ' · 搜索「' + esc(Q) + '」' : ''} · ${arr.length} 条</span></div>
      <button class="fbtn ${n ? 'on' : ''}" data-filter="1">筛选${n ? ' ' + n : ''}</button>
    </div>
    ${arr.length ? listHTML(arr, LIMIT, c.scn) : `<p class="empty">没有符合条件的条目<br>试试减少筛选条件</p>`}`;
}

function pageSearch() {
  const arr = Q ? ITEMS.filter(matchQ) : [];
  if (!Q) return `<p class="empty">输入关键词试试<br><br>标题、说人话、收益、来源、备注都能搜</p>`;
  return `<p class="seclabel"><span>搜索结果</span><span>${arr.length} 条</span></p>` +
    (arr.length ? listHTML(arr, LIMIT) : `<p class="empty">没找到。<br>试试更短的关键词，比如「头盔」「押金」「血尿」</p>`);
}

const htmlFor = p =>
  p.v === 'list' ? pageList(p) : p.v === 'search' ? pageSearch() : p.theme === 'pick' ? pagePick() : p.theme === 'mine' ? pageMine() : pageHome();

/* ---------------- 页面转场：右进右出（push / pop），页签用交叉淡入 ---------------- */
const P = [$('#p0'), $('#p1')];
let frontIdx = 0, animating = null;

function paint(el, page) {
  el.innerHTML = htmlFor(page);
  afterRender(el);
  el.scrollTop = page.scroll || 0;
}

/* 进场起始位：push 从右侧滑入、旧页左移 30%；pop 反向；页签切换只交叉淡入淡出 */
function transitionTo(page, mode) {
  finishTx();                     // 连点时先给上一段收尾
  syncTabs();
  const out = P[frontIdx], inn = P[1 - frontIdx];
  /* 必须先取消 hidden 再渲染：display:none 时赋 scrollTop 会被忽略，
     会导致返回列表时滚动位置丢失 */
  inn.hidden = false; out.hidden = false;
  paint(inn, page);

  out.classList.add('animating'); inn.classList.add('animating');
  out.style.transition = 'none'; inn.style.transition = 'none';

  const props = mode === 'fade'
    ? 'opacity var(--dur-fade) ease'
    : 'transform var(--dur-push) var(--ease-drawer)';

  const done = () => {
    out.hidden = true; out.innerHTML = '';
    [out, inn].forEach(el => {
      el.classList.remove('animating');
      el.style.transition = ''; el.style.transform = ''; el.style.opacity = '';
      el.style.zIndex = '';
    });
    frontIdx = 1 - frontIdx;
  };

  /* 层叠顺序显式指定，不依赖 DOM 顺序：
     push/fade 由新页压住旧页；pop 由正在退出的旧页压住新页。
     位移转场全程 opacity 保持 1（页面是不透明全屏层，一旦压暗下层就会透上来，
     视觉上就是两页文字互相穿插的“遮挡”） */
  const innOnTop = mode !== 'pop' && !REDUCE;
  if (innOnTop) { inn.style.zIndex = '2'; out.style.zIndex = '1'; }
  else { inn.style.zIndex = '1'; out.style.zIndex = '2'; }

  if (REDUCE) {
    out.style.transform = ''; inn.style.transform = '';
    out.style.opacity = '1'; inn.style.opacity = '0';
  } else if (mode === 'fade') {
    out.style.transform = ''; inn.style.transform = '';
    out.style.opacity = '1'; inn.style.opacity = '0';
  } else if (mode === 'push') {
    out.style.transform = 'translateX(0)'; out.style.opacity = '1';
    inn.style.transform = 'translateX(100%)'; inn.style.opacity = '1';
  } else {                        // pop
    out.style.transform = 'translateX(0)'; out.style.opacity = '1';
    inn.style.transform = 'translateX(-30%)'; inn.style.opacity = '1';
  }
  void inn.offsetWidth;   // 强制回流，让起始态生效

  out.style.transition = props; inn.style.transition = props;
  if (mode === 'fade' || REDUCE) {
    out.style.opacity = '0'; inn.style.opacity = '1';
  } else if (mode === 'push') {
    out.style.transform = 'translateX(-30%)';
    inn.style.transform = 'translateX(0)';
  } else {                        // pop
    out.style.transform = 'translateX(100%)';
    inn.style.transform = 'translateX(0)';
  }

  animating = { timer: null, done };
  animating.timer = setTimeout(finishTx, mode === 'fade' || REDUCE ? 180 : 360);
}
/* 幂等收尾：定时器与 flush 共用它，保证一段动画只收尾一次。
   若收尾跑两次，frontIdx 会被翻转两次，两页就都留在可见状态。 */
function finishTx() {
  if (!animating) return;
  const tx = animating;
  animating = null;
  clearTimeout(tx.timer);
  tx.done();
}
/* 快速连点时立刻把上一段动画收尾，不等它跑完 —— 不锁输入 */
function flush() { finishTx(); }

const front = () => P[frontIdx];
const setSearching = on => document.body.classList.toggle('searching', on);
const clearQ = () => { const q = $('#q'); if (q.value) q.value = ''; Q = ''; };
/* 底部三个页签的高亮 = 当前所在的分区（在列表页里也算，因为还属于那个分区） */
function syncTabs() {
  document.querySelectorAll('#tabbar button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === S.theme));
  const isHomeTab = cur.v === 'tab' && S.theme === 'home';
  const isOtherTab = cur.v === 'tab' && S.theme !== 'home';
  const showSearch = isHomeTab || cur.v === 'search';
  /* off=占位隐藏（切 tab 不跳）；gone=真卸掉（列表页给 listhead） */
  document.body.classList.toggle('search-chrome-off', isOtherTab);
  document.body.classList.toggle('search-chrome-gone', !showSearch && !isOtherTab);
}

function go(page, mode) {
  flush();
  const prev = cur;
  if (mode !== 'fade') { prev.scroll = front().scrollTop; navStack.push(prev); }
  cur = page;
  setSearching(page.v === 'search');
  transitionTo(page, mode);
}
function pop() {
  flush();
  cur.scroll = front().scrollTop;
  const back = navStack.pop() || { v: 'tab', theme: S.theme, scroll: 0 };
  if (cur.v === 'search') { clearQ(); $('#q').blur(); }
  cur = back;
  setSearching(back.v === 'search');
  transitionTo(back, 'pop');
}
function switchTab(t) {
  if (S.theme === t && cur.v === 'tab' && !navStack.length) return;
  flush();
  S.theme = t; save(); navStack = [];
  if (cur.v === 'search') { clearQ(); $('#q').blur(); }
  cur = { v: 'tab', theme: t, scroll: 0 };
  setSearching(false);
  transitionTo(cur, 'fade');
}
/* ---------------- 抽屉 ---------------- */
function openSheet(html) { $('#sheet').innerHTML = html; $('#sheet').classList.add('show'); $('#mask').classList.add('show'); }
function closeSheet() { $('#sheet').classList.remove('show'); $('#mask').classList.remove('show'); }
function filterSheet() {
  const g = (label, key, opts, lab) => `<div class="fsect"><div class="fl">${label}</div><div class="frow">${
    opts.map(o => `<button type="button" class="tab ${F[key].includes(o) ? 'on' : ''}" data-f="${key}" data-v="${esc(o)}">${esc(lab ? lab[o] : o)}</button>`).join('')}</div></div>`;
  /* 清空按钮始终占位，避免选项切换时头栏高度跳动 */
  const hasF = fCount() > 0;
  const clearBtn = `<button type="button" class="sheet-clear${hasF ? '' : ' is-empty'}" data-clear="1" aria-label="清空筛选"${hasF ? '' : ' disabled'}><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`;
  openSheet(`<div class="sheet-scroll">
    <div class="sheet-head"><h4>筛选</h4>${clearBtn}</div>
    <div class="sh">同级多选，不同级之间是「并且」</div>
    ${g('证据等级', 'grade', ['A', 'B', 'C'])}
    ${g('性价比', 'ratio', ['极高', '高', '一般'])}
    ${g('换回什么', 'lens', ['换寿命', '换钱', '换时间精力', '换人身自由'])}
    ${g('花钱', 'money', ['0', '少', '多'], MONEY)}
    ${g('花时间', 'time', ['少', '中', '多'], TIME)}
    ${g('要毅力', 'will', ['否', '些', '是'], WILL)}
    ${g('其他', 'flag', ['争议', '待核实'])}</div>
    <div class="sheet-foot">
      <button type="button" class="done" data-close="1">完成</button>
    </div>`);
}
function srcSheet(id) {
  const i = BYID[id];
  if (!i) return;
  const links = srcLinks(i.src).filter(l => l.url);
  const rows = links.map(l =>
    `<button type="button" class="srcrow" data-copy-url="${esc(l.url)}" aria-label="复制链接">
      <span class="m"><span class="dom">${esc(hostOf(l.url))}</span><span class="cite">${esc(l.text || l.url)}</span></span>
    </button>`).join('');
  openSheet(`<div class="sheet-scroll"><h4>来源</h4><div class="sh">共 ${links.length} 条 · 点按整行复制</div>
    <div class="srclist">${rows}</div></div>
    <div class="sheet-foot"><button type="button" class="done ghost" data-close="1">关闭</button></div>`);
}

/* 就地重绘当前页（不触发转场），用于收藏、筛选、加载更多这类同一页内的状态变化 */
function repaint() {
  const el = front();
  const keep = el.scrollTop;
  el.innerHTML = htmlFor(cur);
  afterRender(el);
  el.scrollTop = keep;
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) {
    // 点卡片正文 = 展开/收起；点详情区（选字、点引用）不动
    const cardEl = e.target.closest('.card');
    if (cardEl && !e.target.closest('.detail')) {
      const id = cardEl.dataset.id;
      EX.has(id) ? EX.delete(id) : EX.add(id);
      cardEl.classList.toggle('open');
    }
    return;
  }
  const d = t.dataset;

  if (d.star) {
    const id = d.star, k = S.fav.indexOf(id);
    k < 0 ? S.fav.push(id) : S.fav.splice(k, 1); save(); buzz(8);
    const on = S.fav.includes(id);
    document.querySelectorAll(`[data-star="${id}"]`).forEach(b => {
      b.classList.toggle('on', on);
      if (b.classList.contains('heart')) return;
      if (b.classList.contains('star')) b.textContent = on ? '★' : '☆';
      else b.textContent = on ? '★ 已收藏' : '☆ 收藏';
    });
    return;
  }

  if (d.ref) {
    const [sec, n] = d.ref.split('-').map(Number), i = BYID['s' + sec + '-' + n];
    if (!i) return toast('找不到这一条');
    EX.add(i.id);
    const el = front().querySelector('.card[data-id="' + i.id + '"]');
    if (el) {   // 目标就在当前这一页里，就地展开并滚过去，不动页面
      el.classList.add('open');
      el.scrollIntoView({ block: 'center', behavior: REDUCE ? 'auto' : 'smooth' });
    } else {
      go({ v: 'list', title: i.title, sub: '第 ' + i.sec + ' 节第 ' + i.n + ' 条', items: [i], scroll: 0 }, 'push');
    }
    return;
  }
  if (d.copyUrl) { copyLink(d.copyUrl); return; }
  if (d.act) {
    const id = d.id2;
    if (d.act === 'share') {
      const i = BYID[id];
      if (!i) return toast('找不到这一条');
      const txt = `《高质量人生指南》第 ${i.sec} 节第 ${i.n} 条\n${i.title}\n\n${i.human}\n\n成本：${i.cost}\n证据等级：${i.grade}\n来源：${i.src}\n\n改编自《高性价比人生指南》 CC BY 4.0 · https://github.com/eternity4719/HowToLiveBetter`;
      // 容器里 navigator.share 常无面板且静默失败，直接复制并提示
      copyText(txt, '已复制，可粘贴分享');
      if (navigator.share) {
        try { navigator.share({ text: txt }).catch(() => { }); } catch (err) { /* ignore */ }
      }
      return;
    }
    if (d.act === 'src') {
      const links = srcLinks(BYID[id].src).filter(l => l.url);
      if (links.length === 1) copyLink(links[0].url); else srcSheet(id);
      return;
    }
    return;
  }

  if (d.mode) { S.mode = d.mode; save(); LIMIT = PAGE; repaint(); return; }
  if (d.scn) { const s = SCNBY[d.scn]; go({ v: 'list', title: s.ico + ' ' + s.nm, sub: s.desc, items: s.items.map(id => BYID[id]).filter(Boolean), scn: s.id, scroll: 0 }, 'push'); return; }
  if (d.sec) {
    const s = SECBY[+d.sec];
    go({ v: 'list', title: '第 ' + s.n + ' 节 ' + s.title, sub: s.desc || '共 ' + s.count + ' 条', items: ITEMS.filter(i => i.sec === s.n), scroll: 0 }, 'push');
    return;
  }
  if (d.easy) { go({ v: 'list', title: '省力清单', sub: '不花钱 · 不花时间 · 不用毅力 · 收益还最大', items: ITEMS.filter(i => i.ratio === '极高' && i.cs === 0), scroll: 0 }, 'push'); return; }
  /* data-allA 在 HTML 里会被折叠成 data-alla → dataset.alla */
  if (d.alla || d.allA) { go({ v: 'list', title: '结论最硬的', sub: '证据等级 A：有具体数字', items: ITEMS.filter(i => i.grade === 'A'), scroll: 0 }, 'push'); return; }
  if (d.dispute) { go({ v: 'list', title: '有争议的', sub: '原书标了反方证据', items: ITEMS.filter(i => i.dispute), scroll: 0 }, 'push'); return; }
  if (d.pickRand) {
    spinPickHero();
    if (cur.v === 'tab' && S.theme === 'pick') repaint();
    buzz(8);
    return;
  }

  if (d.io === 'export') {
    const blob = new Blob([JSON.stringify({ fav: S.fav }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'life-guide-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('已导出'); return;
  }
  if (d.io === 'import') {
    const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
    f.onchange = () => {
      const r = new FileReader();
      r.onload = () => {
        try {
          const j = JSON.parse(r.result);
          S.fav = j.fav || [];
          save(); repaint(); toast('已导入');
        } catch (err) { toast('文件格式不对'); }
      };
      r.readAsText(f.files[0]);
    };
    f.click(); return;
  }

  if (d.more) { LIMIT += PAGE; repaint(); return; }
  if (d.back) { pop(); return; }
  if (d.filter) { filterSheet(); return; }
  if (d.clear) { F = { grade: [], ratio: [], lens: [], money: [], time: [], will: [], flag: [] }; closeSheet(); repaint(); return; }
  if (d.close) { closeSheet(); repaint(); return; }
  if (d.f) {
    const k = d.f, v = d.v, a = F[k], n = a.indexOf(v);
    n < 0 ? a.push(v) : a.splice(n, 1);
    filterSheet(); repaint(); return;
  }
});

$('#mask').addEventListener('click', closeSheet);
$('#tbback').addEventListener('click', () => { if (cur.v === 'search') pop(); });
$('#sclr').addEventListener('click', () => { const q = $('#q'); q.value = ''; Q = ''; q.focus(); repaint(); });
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchTab(b.dataset.tab); });

/* 搜索：输入框常驻顶栏，永远不重绘它 —— 中文输入法不会被打断 */
$('#q').addEventListener('focus', () => { if (cur.v !== 'search') go({ v: 'search', scroll: 0 }, 'push'); });
$('#q').addEventListener('input', e => {
  if (cur.v !== 'search') return;
  Q = e.target.value; LIMIT = PAGE; repaint();
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* 初始化 */
$('#q').placeholder = '搜索 ' + ITEMS.length + ' 条建议、来源、正文…';
setSearching(cur.v === 'search');
syncTabs();
paint(P[0], cur);
</script>
</body>
</html>
