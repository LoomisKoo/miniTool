  <g transform="translate(256 256)" fill="none" stroke-linecap="butt" stroke-linejoin="miter" shape-rendering="geometricPrecision">
    <use xlink:href="#starPath" stroke="#9a8458" stroke-opacity=".22" stroke-width="13" transform="translate(1 2)"/>
