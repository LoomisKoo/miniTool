<div class="app">

  <div class="app-scroll">
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <defs>
            <linearGradient id="bmGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6d7bff"/>
              <stop offset="1" stop-color="#a259f7"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#bmGrad)"/>
          <g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
            <rect x="8" y="8" width="9" height="9" rx="2.6"/>
            <rect x="23" y="8" width="9" height="9" rx="2.6"/>
            <rect x="8" y="23" width="9" height="9" rx="2.6"/>
          </g>
          <g fill="#fff" opacity="0.92">
            <circle cx="12.5" cy="12.5" r="1.7"/>
            <circle cx="27.5" cy="12.5" r="1.7"/>
            <circle cx="12.5" cy="27.5" r="1.7"/>
            <rect x="23" y="23" width="4" height="4" rx="1.1"/>
            <rect x="28.5" y="28.5" width="4" height="4" rx="1.1"/>
            <rect x="23" y="28.5" width="3.2" height="3.2" rx="0.9"/>
          </g>
        </svg>
      </span>
      <span class="brand-txt">
        <b>彩码</b>
        <small>链接 · 文字 · WiFi · 名片 · 花束二维码</small>
      </span>
    </div>
  </header>

  <!-- 内容类型 -->
  <nav class="tabs" id="tabs">
    <i class="tab-slider" id="tab-slider" aria-hidden="true"></i>
    <button type="button" class="tab" data-type="url">链接</button>
    <button type="button" class="tab" data-type="text">文字</button>
    <button type="button" class="tab" data-type="wifi">WiFi</button>
    <button type="button" class="tab" data-type="card">名片</button>
  </nav>

  <!-- 预览 -->
  <section class="preview-card">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="bloom-host" id="bloom-host" hidden></div>
      <div class="stage-empty" id="stage-empty">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#c8ccd8" stroke-width="1.7" stroke-linecap="round">
          <rect x="7" y="7" width="14" height="14" rx="3.4"/>
          <rect x="27" y="7" width="14" height="14" rx="3.4"/>
          <rect x="7" y="27" width="14" height="14" rx="3.4"/>
          <circle cx="14" cy="14" r="2.6" fill="#c8ccd8" stroke="none"/>
          <circle cx="34" cy="14" r="2.6" fill="#c8ccd8" stroke="none"/>
          <circle cx="14" cy="34" r="2.6" fill="#c8ccd8" stroke="none"/>
          <rect x="27" y="27" width="6.4" height="6.4" rx="1.8" fill="#c8ccd8" stroke="none"/>
          <rect x="36" y="36" width="5.4" height="5.4" rx="1.5" fill="#c8ccd8" stroke="none"/>
          <rect x="27" y="37" width="4.2" height="4.2" rx="1.2" fill="#c8ccd8" stroke="none"/>
        </svg>
        <p>选择类型并填写内容</p>
      </div>
      <p class="bloom-hint" id="bloom-hint" hidden>轻点花束，绽放成可扫二维码</p>
    </div>
    <div class="qr-title" id="qr-title" hidden>
      <span class="qt-type"></span><span class="qt-text"></span>
    </div>
  </section>

  <!-- 输入面板 -->
  <main class="panels">

    <section class="panel" data-panel="url">
      <label class="field">
        <span class="label">网址 / 链接</span>
        <input type="text" id="in-url" inputmode="url" placeholder="https://…" autocomplete="off" />
      </label>
      <label class="field">
        <span class="label">标题（导出显示在码下方）</span>
        <input type="text" id="in-title-url" maxlength="30" placeholder="留空则自动用内容摘要" autocomplete="off" />
      </label>
    </section>

    <section class="panel" data-panel="text">
      <label class="field">
        <span class="label">文字内容</span>
        <textarea id="in-text" rows="4" maxlength="2000" placeholder="想写的话、小抄、通知…"></textarea>
      </label>
      <p class="count" id="text-count">0 / 2000</p>
      <label class="field">
        <span class="label">标题（导出显示在码下方）</span>
        <input type="text" id="in-title-text" maxlength="30" placeholder="留空则自动用内容摘要" autocomplete="off" />
      </label>
    </section>

    <section class="panel" data-panel="wifi">
      <label class="field">
        <span class="label">WiFi 名称 (SSID)</span>
        <input type="text" id="in-ssid" placeholder="如 MyHome_5G" autocomplete="off" />
      </label>
      <label class="field">
        <span class="label">密码</span>
        <input type="text" id="in-pass" placeholder="无密码可留空" autocomplete="off" />
      </label>
      <div class="row">
        <label class="field grow">
          <span class="label">加密方式</span>
          <input type="hidden" id="in-sec" value="WPA" />
          <div class="select" id="sel-sec">
            <button type="button" class="select-trigger">
              <span class="select-val">WPA / WPA2</span>
              <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="select-pop" id="pop-sec" hidden>
              <button type="button" class="select-opt on" data-value="WPA">WPA / WPA2<span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
              <button type="button" class="select-opt" data-value="WEP">WEP<span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
              <button type="button" class="select-opt" data-value="nopass">无密码<span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
            </div>
          </div>
        </label>
        <label class="field check">
          <input type="checkbox" id="in-hidden" />
          <span class="check-box"></span>
          <span class="label">隐藏网络</span>
        </label>
      </div>
      <label class="field">
        <span class="label">标题（导出显示在码下方）</span>
        <input type="text" id="in-title-wifi" maxlength="30" placeholder="留空则自动用内容摘要" autocomplete="off" />
      </label>
      <p class="field-note">对方扫码后即可连上这个 WiFi，不用手动输密码。</p>
    </section>

    <section class="panel" data-panel="card">
      <label class="field">
        <span class="label">姓名 *</span>
        <input type="text" id="in-cname" placeholder="张三" autocomplete="off" />
      </label>
      <div class="row">
        <label class="field grow">
          <span class="label">手机 / 电话</span>
          <input type="tel" id="in-ctel" inputmode="tel" placeholder="13800000000" autocomplete="off" />
        </label>
        <label class="field grow">
          <span class="label">公司</span>
          <input type="text" id="in-corg" placeholder="某某公司" autocomplete="off" />
        </label>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label">职位</span>
          <input type="text" id="in-ctitle" placeholder="产品经理" autocomplete="off" />
        </label>
        <label class="field grow">
          <span class="label">邮箱</span>
          <input type="email" id="in-cemail" inputmode="email" placeholder="name@mail.com" autocomplete="off" />
        </label>
      </div>
      <label class="field">
        <span class="label">主页 / 备注（选填）</span>
        <input type="text" id="in-cnote" placeholder="https://… 或 备注一句话" autocomplete="off" />
      </label>
      <label class="field">
        <span class="label">名片格式</span>
        <input type="hidden" id="in-cardfmt" value="vcard" />
        <div class="select" id="sel-cardfmt">
          <button type="button" class="select-trigger">
            <span class="select-val">vCard · iPhone 通讯录推荐</span>
            <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="select-pop" id="pop-cardfmt" hidden>
            <button type="button" class="select-opt on" data-value="vcard">vCard · iPhone 通讯录推荐<span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
            <button type="button" class="select-opt" data-value="mecard">MeCard · 安卓 / 通用<span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></button>
          </div>
        </div>
      </label>
      <label class="field">
        <span class="label">标题（导出显示在码下方）</span>
        <input type="text" id="in-title-card" maxlength="30" placeholder="留空则自动用内容摘要" autocomplete="off" />
      </label>
      <p class="field-note">扫码后可把信息直接存为手机联系人。</p>
    </section>

    <!-- 美化 -->
    <section class="panel style-panel">
      <div class="style-cell">
        <span class="label">样式模式</span>
        <div class="chips" id="mode-chips">
          <button type="button" class="chip on" data-mode="classic">经典</button>
          <button type="button" class="chip" data-mode="bloom">花束</button>
        </div>
      </div>

      <div id="classic-style-opts">
        <button type="button" class="color-entry" id="btn-colors">
          <span class="ce-swatches">
            <i class="ce-bg" id="dot-bg"></i>
            <i class="ce-fg" id="dot-fg"></i>
          </span>
          <span class="ce-text">
            <b>配色</b>
            <small id="ce-sub">码点 · 背景</small>
          </span>
          <svg class="ce-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#b6bcc9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <div class="style-cell">
          <span class="label">点的形状</span>
          <div class="chips" id="shape-chips">
            <button type="button" class="chip" data-shape="square">方形</button>
            <button type="button" class="chip" data-shape="dot">圆点</button>
            <button type="button" class="chip" data-shape="round">圆角</button>
          </div>
        </div>

        <div class="style-cell">
          <span class="label">定位角</span>
          <div class="chips" id="finder-chips">
            <button type="button" class="chip" data-finder="square">方形</button>
            <button type="button" class="chip" data-finder="round">圆角</button>
            <button type="button" class="chip" data-finder="dot">圆点</button>
          </div>
        </div>

        <div class="style-cell">
          <span class="label">中心 Logo</span>
          <div class="logo-ui" id="logo-ui">
            <input type="file" id="in-logo" accept="image/*" hidden />
            <button type="button" class="add-box sm" id="btn-logo" aria-label="添加 Logo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="logo-thumb" id="logo-thumb" hidden>
              <img id="logo-thumb-img" alt="Logo 预览" />
              <button type="button" class="thumb-x" id="btn-logo-clear" aria-label="移除 Logo">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="bloom-style-opts" hidden>
        <div class="style-cell">
          <span class="label">花种</span>
          <div class="chips wrap" id="flower-chips">
            <button type="button" class="chip on" data-flower="peony">牡丹</button>
            <button type="button" class="chip" data-flower="lily">百合</button>
            <button type="button" class="chip" data-flower="rose">玫瑰</button>
            <button type="button" class="chip" data-flower="tulip">郁金香</button>
          </div>
        </div>
        <div class="style-cell">
          <span class="label">花束配色</span>
          <div class="pal-row" id="palette-chips">
            <button type="button" class="pal-swatch on" data-palette="original" style="--c:#c45c6a" aria-label="原色"></button>
            <button type="button" class="pal-swatch" data-palette="blush" style="--c:#e8a0b0" aria-label="腮红"></button>
            <button type="button" class="pal-swatch" data-palette="marigold" style="--c:#e08a3c" aria-label="金盏"></button>
            <button type="button" class="pal-swatch" data-palette="sunbeam" style="--c:#e6c35c" aria-label="日光"></button>
            <button type="button" class="pal-swatch" data-palette="poppy" style="--c:#d63b3b" aria-label="罂粟"></button>
            <button type="button" class="pal-swatch" data-palette="azure" style="--c:#5b8fd9" aria-label="晴空"></button>
            <button type="button" class="pal-swatch" data-palette="dusk" style="--c:#7a5ea8" aria-label="暮色"></button>
          </div>
        </div>
        <p class="field-note">左右拖动可旋转花束；轻点预览在花瓶与二维码间切换。</p>
      </div>
    </section>
  </main>
  </div>

  <footer class="bottom-bar">
    <button type="button" class="btn-primary" id="btn-save">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
      保存图片
    </button>
  </footer>
</div>

<!-- 保存预览 -->
<div class="mask" id="save-mask" aria-hidden="true">
  <button type="button" class="mask-backdrop" id="save-backdrop" aria-label="关闭"></button>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">保存二维码</p>
    <p class="sheet-sub">长按图片可保存到相册</p>
    <div class="sheet-body save-body">
      <div class="save-stage"><img id="save-img" alt="生成的二维码" /></div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-ghost" id="btn-close">关闭</button>
      <a class="btn-primary" id="btn-download" download="colorqr.png">下载 PNG</a>
    </div>
  </div>
</div>

<!-- 配色面板 -->
<div class="mask" id="color-mask" aria-hidden="true">
  <button type="button" class="mask-backdrop" id="color-backdrop" aria-label="关闭"></button>
  <div class="sheet sheet-tall">
    <div class="sheet-handle"></div>
    <p class="sheet-title">配色</p>

    <div class="sheet-body sheet-scroll">
      <section class="c-sec">
        <div class="c-title"><span>码点颜色</span></div>
        <div class="dots-row" id="dots-fg-row">
          <div class="dots" id="dots-fg"></div>
          <button type="button" class="sw-btn" id="sheet-fg" aria-label="自定义码点颜色"><i>+</i></button>
        </div>
      </section>

      <section class="c-sec">
        <div class="c-title">
          <span>背景</span>
          <div class="seg sm" id="bgmode-seg">
            <button type="button" class="seg-btn on" data-bgmode="pure">纯色</button>
            <button type="button" class="seg-btn" data-bgmode="image">图片</button>
          </div>
        </div>
        <div class="swap" id="dots-bg-swap">
          <div class="dots-row">
            <div class="dots" id="dots-bg"></div>
            <button type="button" class="sw-btn" id="sheet-bg" aria-label="自定义背景颜色"><i>+</i></button>
          </div>
        </div>

        <div class="swap" id="bg-wrap-swap" hidden>
          <div class="bg-wrap" id="bg-wrap">
            <div class="bg-top">
              <div class="add-box" id="bg-thumbbox">
                <input type="file" id="in-bgimg" accept="image/*" hidden />
                <img id="bg-thumb" alt="背景图" />
                <span class="bg-veil" id="bg-veil"></span>
                <span class="bg-empty" id="bg-empty">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <button type="button" class="thumb-x" id="btn-bgimg-clear" aria-label="移除背景图" hidden>
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
              </div>
              <div class="bg-right">
                <p class="field-note">图片背景会略降识别率，浅色罩调高更好扫。</p>
                <div class="row veil-row">
                  <span class="label">浅色罩</span>
                  <div class="slider" id="veil" role="slider" aria-label="浅色罩强度" aria-valuemin="40" aria-valuemax="95" aria-valuenow="78" tabindex="0">
                    <span class="slider-track"><i class="slider-fill" id="veil-fill"></i></span>
                    <span class="slider-thumb" id="veil-thumb"></span>
                  </div>
                  <span class="val" id="veil-val">78%</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <button type="button" class="sheet-done" id="color-cancel">完成</button>
  </div>
</div>

<!-- 自定义取色器 -->
<div class="picker" id="picker" aria-hidden="true">
  <button type="button" class="picker-bd" id="picker-bd" aria-label="关闭取色器"></button>
  <div class="picker-card" role="dialog" aria-label="自定义颜色">
    <div class="picker-head">
      <span class="picker-title" id="picker-title">码点颜色</span>
      <span class="picker-hexbox">
        <i id="picker-swatch"></i>
        <input type="text" id="picker-hex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="十六进制颜色值" />
      </span>
    </div>
    <div class="picker-sv" id="picker-sv">
      <i class="picker-ring" id="picker-ring"></i>
    </div>
    <div class="bar-row">
      <div class="bar-hue" id="picker-hue">
        <span class="bar-thumb" id="picker-hue-thumb"><i id="picker-hue-in"></i></span>
      </div>
    </div>
    <div class="picker-actions">
      <button type="button" class="btn-ghost" id="picker-cancel">取消</button>
      <button type="button" class="btn-primary" id="picker-ok">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
