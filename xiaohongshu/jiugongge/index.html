<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>发图工具箱</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f6;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #888;
      --accent: #ff2442;
      --accent-soft: #fff0f2;
      --border: #eee;
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .header {
      flex-shrink: 0;
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-back {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--surface);
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow);
      flex-shrink: 0;
      display: none;
    }

    .header-back.visible { display: block; }

    .header-text { flex: 1; text-align: center; padding-right: 32px; }
    .header-back.visible + .header-text { padding-right: 0; padding-left: 0; }

    .header h1 { font-size: 17px; font-weight: 600; }
    .header p { margin-top: 2px; font-size: 12px; color: var(--text-secondary); }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .screen.active { display: flex; }

    /* 首页工具列表 */
    .tool-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: none;
      text-align: left;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    .tool-card:active { background: var(--accent-soft); }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .tool-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .tool-card p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    /* 选图 */
    .upload-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    .upload-box {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
      border: 2px dashed var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .upload-box:active { border-color: var(--accent); background: var(--accent-soft); }

    .upload-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .upload-box span { font-size: 15px; font-weight: 500; }
    .upload-box small { font-size: 12px; color: var(--text-secondary); }
    .tips { max-width: 300px; font-size: 12px; color: var(--text-secondary); line-height: 1.7; text-align: center; }

    /* 裁切 */
    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0 16px;
    }

    .crop-viewport {
      flex: 1;
      position: relative;
      min-height: 0;
      margin: 8px 0;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }

    .crop-viewport canvas { display: block; width: 100%; height: 100%; }

    .option-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      flex-wrap: wrap;
    }

    .option-bar label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
    .option-bar input[type="range"] { flex: 1; min-width: 100px; accent-color: var(--accent); }

    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .chip {
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      cursor: pointer;
    }

    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .layout-group { display: flex; gap: 8px; width: 100%; }
    .layout-btn {
      flex: 1;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-size: 12px;
      cursor: pointer;
    }
    .layout-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

    .thumb-row {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      overflow-x: auto;
    }

    .thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid transparent;
    }

    .thumb.active { border-color: var(--accent); }

    .editor-actions {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 8px 0 16px;
    }

    /* 结果 */
    .result-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px 16px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--border);
    }

    .result-grid.cols-1 { grid-template-columns: 1fr; max-width: 320px; margin: 0 auto; }
    .result-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    .result-cell {
      position: relative;
      aspect-ratio: 1;
      background: #ddd;
    }

    .result-cell.ratio-34 { aspect-ratio: 3 / 4; }
    .result-cell.ratio-auto { aspect-ratio: auto; }
    .result-cell.ratio-auto img { width: 100%; height: auto; display: block; }

    .result-cell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-cell .num {
      position: absolute;
      top: 4px;
      left: 4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-hint {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--accent-soft);
      border-radius: 10px;
      font-size: 12px;
      color: #c41e3a;
      line-height: 1.7;
      text-align: center;
    }

    .result-actions {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 8px 16px 16px;
    }

    .btn {
      flex: 1;
      height: 46px;
      border: none;
      border-radius: 23px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }

    #file-input, #file-input-multi { display: none; }
    .hidden-canvas { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="header-back" id="btn-header-back" type="button" aria-label="返回">‹</button>
      <div class="header-text">
        <h1 id="page-title">发图工具箱</h1>
        <p id="subtitle">小红书发笔记常用图片处理</p>
      </div>
    </header>

    <!-- 首页 -->
    <section class="screen active" id="screen-home">
      <div class="tool-list">
        <button class="tool-card" type="button" data-tool="grid9">
          <div class="tool-icon">9</div>
          <div>
            <h3>九宫格切图</h3>
            <p>正方形裁切，等分 3×3，按序号发笔记拼大图</p>
          </div>
        </button>
        <button class="tool-card" type="button" data-tool="slice">
          <div class="tool-icon">📜</div>
          <div>
            <h3>长图切片</h3>
            <p>长截图按高度切成 3～9 张，适合轮播发图</p>
          </div>
        </button>
        <button class="tool-card" type="button" data-tool="cover34">
          <div class="tool-icon">3:4</div>
          <div>
            <h3>封面裁切</h3>
            <p>按 3:4 竖版比例裁切，导出笔记封面</p>
          </div>
        </button>
        <button class="tool-card" type="button" data-tool="collage">
          <div class="tool-icon">🧩</div>
          <div>
            <h3>多图拼图</h3>
            <p>2～4 张图横拼、竖拼或四宫格合成一张</p>
          </div>
        </button>
        <button class="tool-card" type="button" data-tool="compress">
          <div class="tool-icon">↓</div>
          <div>
            <h3>图片压缩</h3>
            <p>调节画质压缩体积，发图更流畅</p>
          </div>
        </button>
      </div>
    </section>

    <!-- 选图 -->
    <section class="screen" id="screen-upload">
      <div class="upload-area">
        <label class="upload-box" for="file-input" id="upload-label">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
          </div>
          <span id="upload-text">点击选择图片</span>
          <small>JPG · PNG · WebP</small>
        </label>
        <p class="tips" id="upload-tips"></p>
      </div>
    </section>

    <!-- 裁切/编辑 -->
    <section class="screen" id="screen-edit">
      <div class="editor-wrap">
        <div class="crop-viewport" id="crop-viewport">
          <canvas id="crop-canvas"></canvas>
        </div>
        <div class="option-bar" id="option-slice" style="display:none">
          <label>切片数</label>
          <div class="chip-group" id="slice-chips"></div>
        </div>
        <div class="option-bar" id="option-collage" style="display:none">
          <div class="layout-group" id="layout-group"></div>
          <div class="thumb-row" id="thumb-row"></div>
        </div>
        <div class="option-bar" id="option-compress" style="display:none">
          <label>画质</label>
          <input type="range" id="quality-slider" min="40" max="95" value="80" />
          <span id="quality-label" style="font-size:12px;color:var(--text-secondary);min-width:36px">80%</span>
        </div>
        <div class="option-bar" id="option-zoom">
          <label>缩放</label>
          <input type="range" id="zoom-slider" min="100" max="400" value="100" />
        </div>
        <div class="editor-actions">
          <button class="btn btn-ghost" id="btn-back-upload" type="button">重选</button>
          <button class="btn btn-primary" id="btn-process" type="button">开始处理</button>
        </div>
      </div>
    </section>

    <!-- 结果 -->
    <section class="screen" id="screen-result">
      <div class="result-wrap">
        <div class="result-grid" id="result-grid"></div>
        <p class="result-hint" id="result-hint"></p>
      </div>
      <div class="result-actions">
        <button class="btn btn-secondary" id="btn-back-edit" type="button">返回调整</button>
        <button class="btn btn-primary" id="btn-restart" type="button">回到首页</button>
      </div>
    </section>
  </div>

  <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/*" />
  <input type="file" id="file-input-multi" accept="image/jpeg,image/png,image/webp,image/*" multiple />
  <canvas class="hidden-canvas" id="work-canvas"></canvas>

  <script>
    (function () {
      'use strict';

      var TOOLS = {
        grid9: {
          title: '九宫格切图',
          upload: '选择一张图，裁切为正方形',
          tips: '裁切区域会等分为 3×3，按 1→9 顺序发布',
          aspect: [1, 1],
          grid: 3,
          hint: '长按保存，按 1→9 顺序发布笔记'
        },
        slice: {
          title: '长图切片',
          upload: '选择一张长图',
          tips: '按高度均匀切成多张，适合聊天记录、长截图',
          aspect: null,
          hint: '长按保存，按序号从上到下顺序发布'
        },
        cover34: {
          title: '封面裁切',
          upload: '选择一张图，裁切为 3:4 封面',
          tips: '小红书笔记封面常用竖版 3:4 比例',
          aspect: [3, 4],
          hint: '长按图片保存到相册，用作笔记封面'
        },
        collage: {
          title: '多图拼图',
          upload: '选择 2～4 张图片',
          tips: '支持横拼、竖拼、四宫格布局',
          aspect: null,
          hint: '长按保存合成后的图片'
        },
        compress: {
          title: '图片压缩',
          upload: '选择要压缩的图片',
          tips: '拖动滑块调节画质，体积会明显变小',
          aspect: null,
          hint: '长按保存压缩后的图片'
        }
      };

      var COLLAGE_LAYOUTS = [
        { id: '2h', label: '横拼', count: 2 },
        { id: '2v', label: '竖拼', count: 2 },
        { id: '4g', label: '四宫格', count: 4 }
      ];

      var state = {
        tool: null,
        image: null,
        images: [],
        scale: 1,
        offsetX: 0,
        offsetY: 0,
        minScale: 1,
        cropW: 0,
        cropH: 0,
        viewportW: 0,
        viewportH: 0,
        dragging: false,
        lastX: 0,
        lastY: 0,
        pinchStartDist: 0,
        pinchStartScale: 1,
        sliceCount: 4,
        collageLayout: '2h',
        quality: 0.8
      };

      var screens = {
        home: document.getElementById('screen-home'),
        upload: document.getElementById('screen-upload'),
        edit: document.getElementById('screen-edit'),
        result: document.getElementById('screen-result')
      };

      var pageTitle = document.getElementById('page-title');
      var subtitle = document.getElementById('subtitle');
      var headerBack = document.getElementById('btn-header-back');
      var uploadTips = document.getElementById('upload-tips');
      var uploadText = document.getElementById('upload-text');
      var fileInput = document.getElementById('file-input');
      var fileInputMulti = document.getElementById('file-input-multi');
      var cropViewport = document.getElementById('crop-viewport');
      var cropCanvas = document.getElementById('crop-canvas');
      var cropCtx = cropCanvas.getContext('2d');
      var workCanvas = document.getElementById('work-canvas');
      var workCtx = workCanvas.getContext('2d');
      var zoomSlider = document.getElementById('zoom-slider');
      var qualitySlider = document.getElementById('quality-slider');
      var qualityLabel = document.getElementById('quality-label');
      var resultGrid = document.getElementById('result-grid');
      var resultHint = document.getElementById('result-hint');
      var optionSlice = document.getElementById('option-slice');
      var optionCollage = document.getElementById('option-collage');
      var optionCompress = document.getElementById('option-compress');
      var optionZoom = document.getElementById('option-zoom');
      var sliceChips = document.getElementById('slice-chips');
      var layoutGroup = document.getElementById('layout-group');
      var thumbRow = document.getElementById('thumb-row');

      function showScreen(name) {
        Object.keys(screens).forEach(function (k) {
          screens[k].classList.toggle('active', k === name);
        });
        headerBack.classList.toggle('visible', name !== 'home');
        if (name === 'home') {
          pageTitle.textContent = '发图工具箱';
          subtitle.textContent = '小红书发笔记常用图片处理';
        }
      }

      function setTool(tool) {
        state.tool = tool;
        var cfg = TOOLS[tool];
        pageTitle.textContent = cfg.title;
        subtitle.textContent = cfg.upload;
        uploadTips.textContent = cfg.tips;
        uploadText.textContent = tool === 'collage' ? '点击选择 2～4 张图' : '点击选择图片';
        showScreen('upload');
      }

      function resetImageState() {
        state.image = null;
        state.images = [];
        state.scale = 1;
        state.offsetX = 0;
        state.offsetY = 0;
        fileInput.value = '';
        fileInputMulti.value = '';
        resultGrid.innerHTML = '';
      }

      function goHome() {
        resetImageState();
        state.tool = null;
        showScreen('home');
      }

      function updateEditorOptions() {
        var tool = state.tool;
        optionSlice.style.display = tool === 'slice' ? 'flex' : 'none';
        optionCollage.style.display = tool === 'collage' ? 'flex' : 'none';
        optionCompress.style.display = tool === 'compress' ? 'flex' : 'none';
        optionZoom.style.display = (tool === 'collage' || tool === 'compress') ? 'none' : 'flex';
        cropViewport.style.display = tool === 'collage' ? 'none' : 'flex';

        if (tool === 'slice') {
          sliceChips.innerHTML = '';
          [3, 4, 5, 6, 7, 8, 9].forEach(function (n) {
            var chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip' + (n === state.sliceCount ? ' active' : '');
            chip.textContent = n + ' 张';
            chip.addEventListener('click', function () {
              state.sliceCount = n;
              updateEditorOptions();
              drawCrop();
            });
            sliceChips.appendChild(chip);
          });
        }

        if (tool === 'collage') {
          layoutGroup.innerHTML = '';
          COLLAGE_LAYOUTS.forEach(function (lay) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'layout-btn' + (lay.id === state.collageLayout ? ' active' : '');
            btn.textContent = lay.label;
            btn.addEventListener('click', function () {
              state.collageLayout = lay.id;
              updateEditorOptions();
            });
            layoutGroup.appendChild(btn);
          });
          thumbRow.innerHTML = '';
          state.images.forEach(function (img, i) {
            var t = document.createElement('img');
            t.className = 'thumb';
            t.src = img.src;
            t.alt = '图' + (i + 1);
            thumbRow.appendChild(t);
          });
        }
      }

      function loadSingleImage(file, cb) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () { cb(img); };
          img.onerror = function () { alert('图片加载失败'); };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function onFilesSelected(files) {
        if (!files || !files.length) return;
        var tool = state.tool;

        if (tool === 'collage') {
          if (files.length < 2 || files.length > 4) {
            alert('请选择 2～4 张图片');
            return;
          }
          var pending = files.length;
          var loaded = [];
          var idx = 0;
          Array.prototype.forEach.call(files, function (file) {
            loadSingleImage(file, function (img) {
              loaded.push(img);
              idx++;
              if (idx === pending) {
                state.images = loaded;
                showScreen('edit');
                updateEditorOptions();
              }
            });
          });
          return;
        }

        loadSingleImage(files[0], function (img) {
          state.image = img;
          resetTransform();
          showScreen('edit');
          updateEditorOptions();
          if (tool === 'compress') {
            drawCompressPreview();
          } else {
            requestAnimationFrame(function () {
              resizeCropCanvas();
              clampOffset();
              drawCrop();
            });
          }
        });
      }

      function getAspectRatio() {
        var cfg = TOOLS[state.tool];
        if (state.tool === 'slice') return state.image.naturalWidth / state.image.naturalHeight;
        if (cfg.aspect) return cfg.aspect[0] / cfg.aspect[1];
        return 1;
      }

      function computeCropSize() {
        var vw = state.viewportW;
        var vh = state.viewportH;
        var ratio = getAspectRatio();
        var maxW = vw * 0.9;
        var maxH = vh * 0.82;

        if (state.tool === 'slice') {
          state.cropW = maxW;
          state.cropH = maxH;
          return;
        }

        var w = maxW;
        var h = w / ratio;
        if (h > maxH) {
          h = maxH;
          w = h * ratio;
        }
        state.cropW = w;
        state.cropH = h;
      }

      function resetTransform() {
        state.offsetX = 0;
        state.offsetY = 0;
        computeMinScale();
        state.scale = state.minScale;
        updateZoomSlider();
      }

      function computeMinScale() {
        if (!state.image) return;
        var img = state.image;
        computeCropSize();
        if (state.tool === 'slice') {
          var fitScale = Math.min(state.cropW / img.naturalWidth, state.cropH / img.naturalHeight);
          state.minScale = fitScale;
          return;
        }
        var scaleX = state.cropW / img.naturalWidth;
        var scaleY = state.cropH / img.naturalHeight;
        state.minScale = Math.max(scaleX, scaleY);
      }

      function updateZoomSlider() {
        var pct = Math.round((state.scale / state.minScale) * 100);
        zoomSlider.value = Math.max(100, Math.min(400, pct));
      }

      function sliderToScale(pct) {
        return state.minScale * (pct / 100);
      }

      function getImageDrawParams() {
        var img = state.image;
        var dw = img.naturalWidth * state.scale;
        var dh = img.naturalHeight * state.scale;
        var cx = state.viewportW / 2;
        var cy = state.viewportH / 2;
        return {
          dx: cx - dw / 2 + state.offsetX,
          dy: cy - dh / 2 + state.offsetY,
          dw: dw, dh: dh, cx: cx, cy: cy
        };
      }

      function getCropRect() {
        var p = getImageDrawParams();
        return {
          left: p.cx - state.cropW / 2,
          top: p.cy - state.cropH / 2,
          width: state.cropW,
          height: state.cropH
        };
      }

      function clampOffset() {
        if (!state.image || state.tool === 'slice') return;
        var p = getImageDrawParams();
        var c = getCropRect();
        if (p.dx > c.left) state.offsetX -= p.dx - c.left;
        if (p.dy > c.top) state.offsetY -= p.dy - c.top;
        if (p.dx + p.dw < c.left + c.width) state.offsetX += c.left + c.width - (p.dx + p.dw);
        if (p.dy + p.dh < c.top + c.height) state.offsetY += c.top + c.height - (p.dy + p.dh);
      }

      function drawCrop() {
        if (!state.image) return;
        var w = state.viewportW;
        var h = state.viewportH;
        cropCtx.clearRect(0, 0, w, h);
        cropCtx.fillStyle = '#111';
        cropCtx.fillRect(0, 0, w, h);

        var p = getImageDrawParams();
        cropCtx.drawImage(state.image, p.dx, p.dy, p.dw, p.dh);

        var c = getCropRect();

        cropCtx.save();
        cropCtx.fillStyle = 'rgba(0,0,0,0.55)';
        cropCtx.fillRect(0, 0, w, c.top);
        cropCtx.fillRect(0, c.top + c.height, w, h - c.top - c.height);
        cropCtx.fillRect(0, c.top, c.left, c.height);
        cropCtx.fillRect(c.left + c.width, c.top, w - c.left - c.width, c.height);
        cropCtx.restore();

        cropCtx.strokeStyle = 'rgba(255,255,255,0.9)';
        cropCtx.lineWidth = 1.5;
        cropCtx.strokeRect(c.left + 0.75, c.top + 0.75, c.width - 1.5, c.height - 1.5);

        cropCtx.strokeStyle = 'rgba(255,255,255,0.45)';
        cropCtx.lineWidth = 1;

        if (state.tool === 'grid9') {
          var cell = c.width / 3;
          for (var i = 1; i < 3; i++) {
            cropCtx.beginPath();
            cropCtx.moveTo(c.left + cell * i, c.top);
            cropCtx.lineTo(c.left + cell * i, c.top + c.height);
            cropCtx.stroke();
            cropCtx.beginPath();
            cropCtx.moveTo(c.left, c.top + cell * i);
            cropCtx.lineTo(c.left + c.width, c.top + cell * i);
            cropCtx.stroke();
          }
        }

        if (state.tool === 'slice') {
          var sliceH = c.height / state.sliceCount;
          for (var j = 1; j < state.sliceCount; j++) {
            cropCtx.beginPath();
            cropCtx.moveTo(c.left, c.top + sliceH * j);
            cropCtx.lineTo(c.left + c.width, c.top + sliceH * j);
            cropCtx.stroke();
          }
        }
      }

      function resizeCropCanvas() {
        if (!cropViewport.offsetParent && state.tool !== 'slice') return;
        var rect = cropViewport.getBoundingClientRect();
        if (!rect.width) return;
        var dpr = window.devicePixelRatio || 1;
        state.viewportW = rect.width;
        state.viewportH = rect.height;
        cropCanvas.width = Math.round(rect.width * dpr);
        cropCanvas.height = Math.round(rect.height * dpr);
        cropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        computeMinScale();
        if (state.scale < state.minScale) state.scale = state.minScale;
        clampOffset();
        drawCrop();
      }

      function getCropSourceRect() {
        var p = getImageDrawParams();
        var c = getCropRect();
        var img = state.image;
        var sx = (c.left - p.dx) / p.dw * img.naturalWidth;
        var sy = (c.top - p.dy) / p.dh * img.naturalHeight;
        var sw = c.width / p.dw * img.naturalWidth;
        var sh = c.height / p.dh * img.naturalHeight;
        sx = Math.max(0, sx);
        sy = Math.max(0, sy);
        sw = Math.min(sw, img.naturalWidth - sx);
        sh = Math.min(sh, img.naturalHeight - sy);
        return { sx: sx, sy: sy, sw: sw, sh: sh };
      }

      function renderResults(items, gridClass, hint) {
        resultGrid.className = 'result-grid' + (gridClass ? ' ' + gridClass : '');
        resultGrid.innerHTML = '';
        items.forEach(function (item) {
          var cell = document.createElement('div');
          cell.className = 'result-cell' + (item.ratioClass ? ' ' + item.ratioClass : '');
          var img = document.createElement('img');
          img.src = item.dataUrl;
          img.alt = item.label || '';
          img.draggable = false;
          cell.appendChild(img);
          if (item.num) {
            var num = document.createElement('span');
            num.className = 'num';
            num.textContent = item.num;
            cell.appendChild(num);
          }
          resultGrid.appendChild(cell);
        });
        resultHint.textContent = hint || TOOLS[state.tool].hint;
        showScreen('result');
      }

      function processGrid9() {
        var src = getCropSourceRect();
        var side = Math.floor(Math.min(src.sw, src.sh));
        workCanvas.width = side;
        workCanvas.height = side;
        workCtx.drawImage(state.image, src.sx, src.sy, side, side, 0, 0, side, side);
        var cell = Math.floor(side / 3);
        var items = [];
        for (var row = 0; row < 3; row++) {
          for (var col = 0; col < 3; col++) {
            var tile = document.createElement('canvas');
            tile.width = cell;
            tile.height = cell;
            tile.getContext('2d').drawImage(workCanvas, col * cell, row * cell, cell, cell, 0, 0, cell, cell);
            items.push({ dataUrl: tile.toDataURL('image/jpeg', 0.92), num: row * 3 + col + 1 });
          }
        }
        renderResults(items, '', TOOLS.grid9.hint);
      }

      function processSlice() {
        var src = getCropSourceRect();
        var w = Math.floor(src.sw);
        var h = Math.floor(src.sh);
        workCanvas.width = w;
        workCanvas.height = h;
        workCtx.drawImage(state.image, src.sx, src.sy, w, h, 0, 0, w, h);
        var n = state.sliceCount;
        var sliceH = Math.floor(h / n);
        var items = [];
        for (var i = 0; i < n; i++) {
          var th = i === n - 1 ? h - sliceH * (n - 1) : sliceH;
          var tile = document.createElement('canvas');
          tile.width = w;
          tile.height = th;
          tile.getContext('2d').drawImage(workCanvas, 0, sliceH * i, w, th, 0, 0, w, th);
          items.push({ dataUrl: tile.toDataURL('image/jpeg', 0.92), num: i + 1, ratioClass: 'ratio-auto' });
        }
        renderResults(items, 'cols-1', TOOLS.slice.hint);
      }

      function processCover34() {
        var src = getCropSourceRect();
        var w = Math.floor(src.sw);
        var h = Math.floor(src.sh);
        workCanvas.width = w;
        workCanvas.height = h;
        workCtx.drawImage(state.image, src.sx, src.sy, w, h, 0, 0, w, h);
        renderResults([{ dataUrl: workCanvas.toDataURL('image/jpeg', 0.92), ratioClass: 'ratio-34' }], 'cols-1', TOOLS.cover34.hint);
      }

      function processCollage() {
        var imgs = state.images;
        var layout = state.collageLayout;
        var gap = 4;
        var outW, outH;

        if (layout === '2h') {
          outH = 1200;
          outW = outH * 2;
          workCanvas.width = outW;
          workCanvas.height = outH;
          workCtx.fillStyle = '#fff';
          workCtx.fillRect(0, 0, outW, outH);
          var half = (outW - gap) / 2;
          [imgs[0], imgs[1]].forEach(function (img, i) {
            var scale = Math.max(half / img.naturalWidth, outH / img.naturalHeight);
            var dw = img.naturalWidth * scale;
            var dh = img.naturalHeight * scale;
            var dx = i * (half + gap) + (half - dw) / 2;
            var dy = (outH - dh) / 2;
            workCtx.drawImage(img, dx, dy, dw, dh);
          });
        } else if (layout === '2v') {
          outW = 900;
          outH = outW * 2;
          workCanvas.width = outW;
          workCanvas.height = outH;
          workCtx.fillStyle = '#fff';
          workCtx.fillRect(0, 0, outW, outH);
          var halfH = (outH - gap) / 2;
          [imgs[0], imgs[1]].forEach(function (img, i) {
            var scale = Math.max(outW / img.naturalWidth, halfH / img.naturalHeight);
            var dw = img.naturalWidth * scale;
            var dh = img.naturalHeight * scale;
            var dx = (outW - dw) / 2;
            var dy = i * (halfH + gap) + (halfH - dh) / 2;
            workCtx.drawImage(img, dx, dy, dw, dh);
          });
        } else {
          outW = 1200;
          outH = 1200;
          workCanvas.width = outW;
          workCanvas.height = outH;
          workCtx.fillStyle = '#fff';
          workCtx.fillRect(0, 0, outW, outH);
          var cell = (outW - gap) / 2;
          var positions = [[0, 0], [cell + gap, 0], [0, cell + gap], [cell + gap, cell + gap]];
          for (var i = 0; i < 4; i++) {
            var img = imgs[i] || imgs[imgs.length - 1];
            var scale = Math.max(cell / img.naturalWidth, cell / img.naturalHeight);
            var dw = img.naturalWidth * scale;
            var dh = img.naturalHeight * scale;
            var px = positions[i][0] + (cell - dw) / 2;
            var py = positions[i][1] + (cell - dh) / 2;
            workCtx.save();
            workCtx.beginPath();
            workCtx.rect(positions[i][0], positions[i][1], cell, cell);
            workCtx.clip();
            workCtx.drawImage(img, px, py, dw, dh);
            workCtx.restore();
          }
        }

        renderResults([{ dataUrl: workCanvas.toDataURL('image/jpeg', 0.92), ratioClass: 'ratio-auto' }], 'cols-1', TOOLS.collage.hint);
      }

      function drawCompressPreview() {
        if (!state.image) return;
        var rect = cropViewport.getBoundingClientRect();
        if (!rect.width) {
          requestAnimationFrame(drawCompressPreview);
          return;
        }
        var img = state.image;
        var dpr = window.devicePixelRatio || 1;
        var maxW = rect.width;
        var maxH = rect.height;
        var scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
        var dw = img.naturalWidth * scale;
        var dh = img.naturalHeight * scale;
        state.viewportW = maxW;
        state.viewportH = maxH;
        cropCanvas.width = Math.round(maxW * dpr);
        cropCanvas.height = Math.round(maxH * dpr);
        cropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cropCtx.fillStyle = '#111';
        cropCtx.fillRect(0, 0, maxW, maxH);
        cropCtx.drawImage(img, (maxW - dw) / 2, (maxH - dh) / 2, dw, dh);
      }

      function processCompress() {
        var img = state.image;
        var maxSide = 2048;
        var scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.round(img.naturalWidth * scale);
        var h = Math.round(img.naturalHeight * scale);
        workCanvas.width = w;
        workCanvas.height = h;
        workCtx.drawImage(img, 0, 0, w, h);
        var q = state.quality;
        var dataUrl = workCanvas.toDataURL('image/jpeg', q);
        var kb = Math.round(dataUrl.length * 0.75 / 1024);
        renderResults(
          [{ dataUrl: dataUrl, ratioClass: 'ratio-auto' }],
          'cols-1',
          '压缩后约 ' + kb + ' KB，长按保存（画质 ' + Math.round(q * 100) + '%）'
        );
      }

      function process() {
        if (state.tool === 'collage') return processCollage();
        if (state.tool === 'compress') return processCompress();
        if (!state.image) return;
        if (state.tool === 'grid9') processGrid9();
        else if (state.tool === 'slice') processSlice();
        else if (state.tool === 'cover34') processCover34();
      }

      // 事件
      document.querySelectorAll('.tool-card').forEach(function (card) {
        card.addEventListener('click', function () {
          setTool(card.getAttribute('data-tool'));
        });
      });

      headerBack.addEventListener('click', goHome);
      document.getElementById('btn-restart').addEventListener('click', goHome);
      document.getElementById('btn-back-upload').addEventListener('click', function () {
        resetImageState();
        showScreen('upload');
      });
      document.getElementById('btn-back-edit').addEventListener('click', function () {
        showScreen('edit');
        requestAnimationFrame(function () {
          if (state.tool === 'compress') drawCompressPreview();
          else resizeCropCanvas();
        });
      });
      document.getElementById('btn-process').addEventListener('click', process);

      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files[0]) onFilesSelected(fileInput.files);
      });

      document.getElementById('upload-label').addEventListener('click', function (e) {
        if (state.tool === 'collage') {
          e.preventDefault();
          fileInputMulti.click();
        }
      });

      fileInputMulti.addEventListener('change', function () {
        if (fileInputMulti.files && fileInputMulti.files.length) onFilesSelected(fileInputMulti.files);
      });

      zoomSlider.addEventListener('input', function () {
        state.scale = sliderToScale(Number(zoomSlider.value));
        clampOffset();
        drawCrop();
      });

      qualitySlider.addEventListener('input', function () {
        state.quality = Number(qualitySlider.value) / 100;
        qualityLabel.textContent = qualitySlider.value + '%';
      });

      function onPointerDown(x, y) { state.dragging = true; state.lastX = x; state.lastY = y; }
      function onPointerMove(x, y) {
        if (!state.dragging) return;
        state.offsetX += x - state.lastX;
        state.offsetY += y - state.lastY;
        state.lastX = x;
        state.lastY = y;
        clampOffset();
        drawCrop();
      }
      function onPointerUp() { state.dragging = false; }

      cropViewport.addEventListener('mousedown', function (e) { e.preventDefault(); onPointerDown(e.clientX, e.clientY); });
      window.addEventListener('mousemove', function (e) { onPointerMove(e.clientX, e.clientY); });
      window.addEventListener('mouseup', onPointerUp);

      cropViewport.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        else if (e.touches.length === 2) {
          state.dragging = false;
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          state.pinchStartDist = Math.hypot(dx, dy);
          state.pinchStartScale = state.scale;
        }
      }, { passive: true });

      cropViewport.addEventListener('touchmove', function (e) {
        if (e.touches.length === 1 && state.dragging) {
          e.preventDefault();
          onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
          e.preventDefault();
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          var dist = Math.hypot(dx, dy);
          if (state.pinchStartDist > 0) {
            state.scale = Math.max(state.minScale, state.pinchStartScale * (dist / state.pinchStartDist));
            updateZoomSlider();
            clampOffset();
            drawCrop();
          }
        }
      }, { passive: false });

      cropViewport.addEventListener('touchend', onPointerUp);

      window.addEventListener('resize', function () {
        if (screens.edit.classList.contains('active')) {
          if (state.tool === 'compress') drawCompressPreview();
          else resizeCropCanvas();
        }
      });

      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd < 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</body>
</html>
