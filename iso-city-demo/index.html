/* ====================== 刚体互斥：车 / 人 / 动物 / 玩家不能相互穿过 ====================== */
// 玩家作为不可推动的刚体登记进来；车见到玩家会刹车避让。
actors.push({ kind: 'player', group: player.group, radius: 0.36, mass: 6, prio: 2, mob: 0, side: null, brake: null });

function resolveCollisions() {
  for (const a of actors) if (a.brake != null) a.brake = 0;
  const n = actors.length;
  for (let i = 0; i < n; i++) {
    const A = actors[i], ap = A.group.position;
    for (let j = i + 1; j < n; j++) {
      const B = actors[j], bp = B.group.position;
      // 只隔离不同高度层；同一层的地面对象、高架车辆和匝道行人都要碰撞
      const ay = A.group.position.y || 0;
      const by = B.group.position.y || 0;
      if (Math.abs(ay - by) > 0.45) continue;
      const dx = bp.x - ap.x, dz = bp.z - ap.z;
      const d2 = dx * dx + dz * dz;
      const rsum = A.radius + B.radius;

      // 车辆带前瞻（对行人/动物留更长安全距离），其余只看贴身范围
      const carInvolved = A.kind === 'car' || B.kind === 'car';
      const bothCar = A.kind === 'car' && B.kind === 'car';
      const lim = rsum + (bothCar ? 0.8 : carInvolved ? 1.4 : 0.3);
      if (d2 > lim * lim || d2 < 1e-6) continue;

      const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
      const f = 1 - d / lim;

      // 真正重叠时：自由移动体直接位移，沿路径行走的用侧向偏移分离
      if (d < rsum) {
        const push = (d - rsum) * 0.5 * -1;         // 重叠量的一半
        if (A.freeMover) { A.group.position.x += nx * push; A.group.position.z += nz * push; }
        if (B.freeMover) { B.group.position.x -= nx * push; B.group.position.z -= nz * push; }
        const fr = 1 - d / rsum;
        const arx = -Math.cos(A.group.rotation.y), arz = Math.sin(A.group.rotation.y);
        const brx = -Math.cos(B.group.rotation.y), brz = Math.sin(B.group.rotation.y);
        if (A.side != null) A.side = clamp(A.side - (nx * arx + nz * arz) * fr * 0.6, -0.6, 0.6);
        if (B.side != null) B.side = clamp(B.side + (nx * brx + nz * brz) * fr * 0.6, -0.6, 0.6);
      }

      // 让行：只对"前方同伴车"和"前方行人/动物"刹车，避免被对向/路边对象误刹
      const afx = Math.sin(A.group.rotation.y), afz = Math.cos(A.group.rotation.y);
      const bfx = Math.sin(B.group.rotation.y), bfz = Math.cos(B.group.rotation.y);
      const aSees = afx * nx + afz * nz;            // B 在 A 正前方程度
      const bSees = -(bfx * nx + bfz * nz);         // A 在 B 正前方程度
      const sameDir = afx * bfx + afz * bfz > 0.6;
      const aCar = A.kind === 'car', bCar = B.kind === 'car';

      if (A.brake != null && aSees > 0.25 && (!bCar || sameDir)) A.brake = Math.max(A.brake, f * aSees);
      if (B.brake != null && bSees > 0.25 && (!aCar || sameDir)) B.brake = Math.max(B.brake, f * bSees);
      // 车辆礼让正前方的人 / 动物 / 玩家
      if (aCar && !bCar && A.brake != null && aSees > 0.5 && d < rsum + 0.9) A.brake = Math.max(A.brake, f);
      if (bCar && !aCar && B.brake != null && bSees > 0.5 && d < rsum + 0.9) B.brake = Math.max(B.brake, f);
      // 垂直交叉（含对向）：低优先者让行
      if (Math.abs(aSees) <= 0.25 && Math.abs(bSees) <= 0.25) {
        if (A.prio <= B.prio) { if (A.brake != null) A.brake = Math.max(A.brake, f * 0.9); }
        else                  { if (B.brake != null) B.brake = Math.max(B.brake, f * 0.9); }
      }
    }
  }
}

function updateFountains(t) {
  for (const f of fountains) {
    const s = 0.9 + Math.sin(t * 3 + f.phase) * 0.2;
    f.jet.scale.y = s;
    f.jet2.scale.y = 1.1 - (s - 0.9);
    f.jet.rotation.y += 0.02;
    f.water.position.y = 0.15 + Math.sin(t * 2 + f.phase) * 0.008;
  }
}
/* ====================== 键盘输入 ====================== */
const keys = Object.create(null);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

const MOVE_SPEED = 4.2;      // 单位/秒
// 匝道入口位于最外侧道路节点，边界必须留到入口外侧，不能提前截断玩家
const BOUND = HALF + 0.65;   // 仍在水岸地块内，但可以走到所有匝道入口
const PLAYER_RADIUS = 0.24;  // 小人碰撞半径

/* ---- 高架行走：只能从匝道口上桥，桥上会贴边但不会掉下去 ---- */
// 玩家当前踩在哪个面上：ground（地面）/ ramp（匝道）/ ring（立交主桥）
const playerRide = { kind: 'ground' };
const RAMP_EDGE = RAMP_W * 0.5 - PLAYER_RADIUS;   // 匝道内可站立的横向半宽
const RING_EDGE = ROAD_W * 0.5 - PLAYER_RADIUS;   // 主桥内可站立的横向半宽
const MERGE_ZONE = 1.4;                            // 匝道口前后多长弧距内允许下桥

// 把 XZ 点投影到折线上，返回最近点 / 归一化弧长参数 / 横向距离 / 切向
function projectPolyline(points, cum, total, x, z, closed) {
  let bi = 0, bf = 0, bd2 = Infinity, px = 0, pz = 0, tx = 1, tz = 0;
  const n = closed ? points.length : points.length - 1;
  for (let i = 0; i < n; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len2 = dx * dx + dz * dz || 1;
    let f = ((x - a.x) * dx + (z - a.z) * dz) / len2;
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    const qx = a.x + dx * f, qz = a.z + dz * f;
    const d2 = (x - qx) ** 2 + (z - qz) ** 2;
    if (d2 < bd2) { bd2 = d2; bi = i; bf = f; px = qx; pz = qz; tx = dx; tz = dz; }
  }
  const s = cum[bi] + (cum[bi + 1] - cum[bi]) * bf;
  const tl = Math.hypot(tx, tz) || 1;
  return { s, t: total ? s / total : 0, d: Math.sqrt(bd2), px, pz, tx: tx / tl, tz: tz / tl };
}

// 匝道某处"上桥"的前进方向
function rampForward(r, t) {
  const a = rampAt(r, Math.max(0, Math.min(1, t - 0.05)));
  const b = rampAt(r, Math.min(1, t + 0.02));
  const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1;
  return { x: dx / L, z: dz / L };
}

function updatePlayerElevation(moving, moveDir, dt) {
  const p = player.group.position;
  let y = 0;
  const maxPull = MOVE_SPEED * dt * 1.6;           // 每帧横向修正上限，避免瞬移吸附

  if (playerRide.kind === 'ramp') {
    const r = playerRide.ramp;
    const q = projectPolyline(r.pts, r.cum, r.len3, p.x, p.z, false);
    if (q.d > RAMP_EDGE) {                         // 贴回桥面：平滑滑入，不瞬移
      const nx = p.x - q.px, nz = p.z - q.pz, nl = Math.hypot(nx, nz) || 1;
      const tx = q.px + nx / nl * RAMP_EDGE, tz = q.pz + nz / nl * RAMP_EDGE;
      const dx = tx - p.x, dz = tz - p.z, dl = Math.hypot(dx, dz);
      if (dl > 1e-6) { const st = Math.min(dl, maxPull); p.x += dx / dl * st; p.z += dz / dl * st; }
    }
    if (q.t >= 0.995) {                            // 并上主桥
      playerRide.kind = 'ring'; y = RING_Y;
    } else if (q.t <= 0.004) {                     // 走回匝道口，落到地面
      playerRide.kind = 'ground'; y = 0;
    } else {
      y = rampAt(r, q.t).y;
    }
  } else if (playerRide.kind === 'ring') {
    const q = projectPolyline(ringPts, RING_CUM, RPERIM, p.x, p.z, true);
    if (q.d > RING_EDGE) {
      const nx = p.x - q.px, nz = p.z - q.pz, nl = Math.hypot(nx, nz) || 1;
      p.x = q.px + nx / nl * RING_EDGE;
      p.z = q.pz + nz / nl * RING_EDGE;
    }
    playerRide.s = q.s; y = RING_Y;
    if (moving) {                                  // 仅在匝道口、且顺着匝道方向时才下桥
      for (const r of RAMPS) {
        let ds = Math.abs(q.s - r.mergeS); ds = Math.min(ds, RPERIM - ds);
        if (ds > MERGE_ZONE) continue;
        const f = rampForward(r, 1);
        if (moveDir.x * f.x + moveDir.z * f.z < -0.1) {
          playerRide.kind = 'ramp'; playerRide.ramp = r;
          y = rampAt(r, 1).y;                      // 不瞬移，位置保持不变，平滑接上
          break;
        }
      }
    }
  } else if (moving) {                             // 地面：站在匝道口并朝坡上前进才会上桥
    for (const r of RAMPS) {
      const q = projectPolyline(r.pts, r.cum, r.len3, p.x, p.z, false);
      if (q.d > RAMP_EDGE + 0.4 || q.t > 0.06) continue;
      const f = rampForward(r, q.t);
      if (moveDir.x * f.x + moveDir.z * f.z > 0.2) {
        playerRide.kind = 'ramp'; playerRide.ramp = r; y = rampAt(r, q.t).y;  // 不瞬移
        break;
      }
    }
  }
  return y;
}

/* ---- 碰撞：分轴推进 + 分轴回退，撞墙时沿墙滑动而不是卡死 ---- */
function resolveCollision(p, axis) {
  for (let i = 0; i < colliders.length; i++) {
    const b = colliders[i];
    if (b.disabled) continue;
    const minX = b.minX - PLAYER_RADIUS, maxX = b.maxX + PLAYER_RADIUS;
    const minZ = b.minZ - PLAYER_RADIUS, maxZ = b.maxZ + PLAYER_RADIUS;
    if (p.x <= minX || p.x >= maxX || p.z <= minZ || p.z >= maxZ) continue;
    if (axis === 'x') p.x = (p.x < (minX + maxX) * 0.5) ? minX : maxX;
    else              p.z = (p.z < (minZ + maxZ) * 0.5) ? minZ : maxZ;
  }
}

const camFwd = new THREE.Vector3();
const camRight = new THREE.Vector3();
const moveDir = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
const followDelta = new THREE.Vector3();

let walkPhase = 0;   // 走路摆动相位
let movingFlag = 0;  // 0~1 平滑过渡
let playerSurfaceY = 0;

function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

/* ====================== 关键 3：Bloom 让灯光发亮 ====================== */
// 自建渲染目标：带模板缓冲（遮挡透视需要）+ MSAA 抗锯齿
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, {
  type: THREE.HalfFloatType, samples: 4, stencilBuffer: true
}));
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.setSize(innerWidth * PIXEL_SCALE, innerHeight * PIXEL_SCALE);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.18, 0.15, 1.5);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());   // 色调映射 + sRGB 输出，缺了它画面会发灰发平

/* ====================== 主题应用：白天 ⇄ 黑夜 ====================== */
let themeMix = 1;      // 0 = 白天, 1 = 黑夜（当前插值值）
let themeTarget = 1;   // 目标值

function applyTheme(t) {
  drawSky(t);

  // 雾
  mixC(scene.fog.color, THEMES.day.fog, THEMES.night.fog, t);
  scene.fog.density = THREE.MathUtils.lerp(THEMES.day.fogDensity, THEMES.night.fogDensity, t);

  // 光照
  mixC(hemi.color, THEMES.day.hemiSky, THEMES.night.hemiSky, t);
  mixC(hemi.groundColor, THEMES.day.hemiGround, THEMES.night.hemiGround, t);
  hemi.intensity = THREE.MathUtils.lerp(THEMES.day.hemiIntensity, THEMES.night.hemiIntensity, t);
  mixC(sun.color, THEMES.day.sun, THEMES.night.sun, t);
  sun.intensity = THREE.MathUtils.lerp(THEMES.day.sunIntensity, THEMES.night.sunIntensity, t);
  mixC(fill.color, THEMES.day.fill, THEMES.night.fill, t);
  fill.intensity = THREE.MathUtils.lerp(THEMES.day.fillIntensity, THEMES.night.fillIntensity, t);

  // 所有登记的材质颜色（墙 / 屋顶 / 窗户 / 地面 / 灯罩）
  for (const m of themeMats) m.color.copy(m.userData.themeDay).lerp(m.userData.themeNight, t);

  // 路灯自发光 + 点光源亮度
  mixC(lampGlassMat.emissive, THEMES.day.lampEmissive, THEMES.night.lampEmissive, t);
  lampGlassMat.emissiveIntensity = THREE.MathUtils.lerp(0.15, 4.5, t);
  const li = THREE.MathUtils.lerp(THEMES.day.lampLight, THEMES.night.lampLight, t);
  for (const l of lampLights) l.intensity = li;

  // 后处理 + 曝光
  bloomPass.strength = THREE.MathUtils.lerp(THEMES.day.bloom, THEMES.night.bloom, t);
  renderer.toneMappingExposure = THREE.MathUtils.lerp(THEMES.day.exposure, THEMES.night.exposure, t);
}

const themeBtn = document.getElementById('themeBtn');
const clockEl = document.getElementById('clock');
function setTheme(target) {
  themeTarget = target;
  const night = target > 0.5;
  themeBtn.textContent = night ? '🌙 夜晚' : '☀️ 白天';
  clockEl.textContent = night ? THEMES.night.clock : THEMES.day.clock;
}
themeBtn.addEventListener('click', () => setTheme(themeTarget > 0.5 ? 0 : 1));
addEventListener('keydown', e => { if (e.code === 'KeyN') setTheme(themeTarget > 0.5 ? 0 : 1); });

applyTheme(1);
setTheme(1);

/* ============================== 循环 ============================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  /* ---- 0. 主题过渡（约 1.2s 平滑过渡） ---- */
  if (Math.abs(themeMix - themeTarget) > 0.001) {
    themeMix += (themeTarget - themeMix) * Math.min(1, dt * 2.5);
    if (Math.abs(themeMix - themeTarget) <= 0.001) themeMix = themeTarget;
    applyTheme(themeMix);
  }

  /* ---- 1. 按 WASD 计算相对相机的移动方向 ---- */
  camera.getWorldDirection(camFwd);
  camFwd.y = 0;
  camFwd.normalize();
  camRight.crossVectors(camFwd, UP).normalize();

  moveDir.set(0, 0, 0);
  if (keys.KeyW || keys.ArrowUp)    moveDir.add(camFwd);
  if (keys.KeyS || keys.ArrowDown)  moveDir.sub(camFwd);
  if (keys.KeyD || keys.ArrowRight) moveDir.add(camRight);
  if (keys.KeyA || keys.ArrowLeft)  moveDir.sub(camRight);

  const moving = moveDir.lengthSq() > 0.0001;

  if (moving) {
    moveDir.normalize();
    const p = player.group.position;
    // 分轴移动：先走 X 再走 Z，撞墙时能自然沿墙滑动
    p.x += moveDir.x * MOVE_SPEED * dt;
    resolveCollision(p, 'x');
    p.z += moveDir.z * MOVE_SPEED * dt;
    resolveCollision(p, 'z');

    // 限制在城市范围内
    p.x = Math.max(-BOUND, Math.min(BOUND, p.x));
    p.z = Math.max(-BOUND, Math.min(BOUND, p.z));

    // 转身朝向移动方向
    const targetYaw = Math.atan2(moveDir.x, moveDir.z);
    player.group.rotation.y = lerpAngle(player.group.rotation.y, targetYaw, 1 - Math.pow(0.001, dt));
  }

  const elevatedY = updatePlayerElevation(moving, moveDir, dt);
  playerSurfaceY += (elevatedY + (elevatedY > 0 ? 0.05 : 0) - playerSurfaceY) * Math.min(1, dt * 10);

  /* ---- 2. 走路摆动 / 呼吸 ---- */
  movingFlag += ((moving ? 1 : 0) - movingFlag) * Math.min(1, dt * 12);
  walkPhase += dt * 11 * movingFlag;

  const swing = Math.sin(walkPhase) * 0.65 * movingFlag;
  player.legL.rotation.x =  swing;
  player.legR.rotation.x = -swing;
  player.armL.rotation.x = -swing * 0.8;
  player.armR.rotation.x =  swing * 0.8;
  // 上下起伏
  player.group.position.y = playerSurfaceY + Math.abs(Math.sin(walkPhase)) * 0.045 * movingFlag;
  // 静止时轻微呼吸
  player.group.scale.y = 1 + Math.sin(clock.elapsedTime * 2) * 0.012 * (1 - movingFlag);

  /* ---- 车流 / 行人 / 动物 / 飞鸟 / 高架 / 喷泉（全部纯算法） ---- */
  updateCars(dt);
  updateRingCars(dt);
  updateRampCars(dt);
  updateRampPeds(dt);
  updatePedestrians(dt);
  updateAnimals(dt);
  updateBirds(dt, clock.elapsedTime);
  updateFountains(clock.elapsedTime);

  /* ---- 刚体互斥：所有地面对象两两分离并让行 ---- */
  resolveCollisions();

  /* ---- 3. 相机跟随（把 target 和相机同步平移，保留用户旋转/缩放） ---- */
  followDelta.set(
    player.group.position.x - controls.target.x,
    0,
    player.group.position.z - controls.target.z
  );
  const k = 1 - Math.pow(0.02, dt);
  controls.target.addScaledVector(followDelta, k);
  camera.position.addScaledVector(followDelta, k);

  controls.update();
  composer.render();
}
animate();

// 方便在控制台里调参（改灯光、camera、小人位置等）
window.__demo = { scene, camera, controls, player, renderer, composer, colliders, resolveCollision, sun, fill, hemi, THEMES, applyTheme, setTheme, cars, ringCars, rampCars, rampPeds, pedestrians, animals, birds, fountains, actors, isRoundabout, RAMPS, findPath, adj, parks };

/* ============================== 自适应 ============================== */
addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -VIEW * aspect;
  camera.right = VIEW * aspect;
  camera.top = VIEW;
  camera.bottom = -VIEW;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth * PIXEL_SCALE, innerHeight * PIXEL_SCALE, false);
  composer.setSize(innerWidth * PIXEL_SCALE, innerHeight * PIXEL_SCALE);
});
</script>
</body>
