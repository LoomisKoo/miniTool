<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ============ 渲染基础 ============
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
let DPR = Math.min(window.devicePixelRatio, 1.75);
// 反射贴图分辨率系数：3D 场景里的倒影本来就要被雨水扰动糊掉，降到 0.3 看不出差别
const REFLECT_SCALE = 0.3;
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// 场景里唯一会动又能投影的东西是旗帜、灯笼、雨刷、猫尾巴，但它们极小。
// 阴影贴图每帧重画一遍整个场景（4096²）太亏，改成隔帧更新。
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.6, 120);
camera.position.set(17, 13, 19);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.6, 1.6, -0.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 9;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
let idleTimer = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => { idleTimer = setTimeout(() => (controls.autoRotate = true), 8000); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') location.href = './index.html'; });

// ============ 纹理工具 ============
const CN = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif';
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function star(g, cx, cy, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
    g.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  g.closePath(); g.fill();
}

scene.background = canvasTex(16, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#070a1f'); gr.addColorStop(0.45, '#1a1840'); gr.addColorStop(0.8, '#3a2552'); gr.addColorStop(1, '#4d2d58');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

// ============ 三渲二材质 + 描边 ============
const grad = (() => {
  const t = new THREE.DataTexture(new Uint8Array([70, 160, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const toonCache = new Map();
function toon(c, extra) {
  if (extra) return new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...extra });
  if (!toonCache.has(c)) toonCache.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad }));
  return toonCache.get(c);
}
const M = (m) => (typeof m === 'string' || typeof m === 'number' ? toon(m) : m);
function glow(c, k = 1.2, extra = {}) {
  return new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), ...extra });
}
function glowMap(map, k = 1.05, extra = {}) {
  return new THREE.MeshBasicMaterial({ map, color: new THREE.Color(k, k, k), ...extra });
}

const lineColor = new THREE.Color('#1b1630');
const outlineMats = new Map();
function outlineMat(w) {
  if (!outlineMats.has(w)) outlineMats.set(w, new THREE.ShaderMaterial({
    uniforms: { uColor: { value: lineColor }, uWidth: { value: w } },
    vertexShader: 'uniform float uWidth; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * uWidth, 1.0); }',
    fragmentShader: 'uniform vec3 uColor; void main(){ gl_FragColor = vec4(uColor, 1.0); }',
    side: THREE.BackSide,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  }));
  return outlineMats.get(w);
}
const hullCache = new WeakMap();
// 描边外壳：按“位置”焊接顶点后求平均法线，再沿平均法线整体外扩。
// 之前按面法线外扩（每个面各自平移），盒体棱角处会裂开、相邻面互相重叠成薄片，
// 叠在人行道 / 建筑底部的轮廓上就是一条条闪烁的碎面。
function hullGeo(geo) {
  if (hullCache.has(geo)) return hullCache.get(geo);
  let src = geo.index ? geo.toNonIndexed() : geo;
  if (!src.attributes.normal) {
    src = src.clone();
    src.computeVertexNormals();
  }
  const pos = src.attributes.position;
  const nor = src.attributes.normal;
  const map = new Map();
  const verts = [];
  const index = [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const key = `${Math.round(x * 1e4)},${Math.round(y * 1e4)},${Math.round(z * 1e4)}`;
    let rec = map.get(key);
    if (!rec) {
      rec = { x, y, z, nx: 0, ny: 0, nz: 0, i: verts.length };
      verts.push(rec); map.set(key, rec);
    }
    rec.nx += nor.getX(i); rec.ny += nor.getY(i); rec.nz += nor.getZ(i);
    index.push(rec.i);
  }
  const position = new Float32Array(verts.length * 3);
  const normal = new Float32Array(verts.length * 3);
  verts.forEach((v, i) => {
    position[i * 3] = v.x; position[i * 3 + 1] = v.y; position[i * 3 + 2] = v.z;
    let { nx, ny, nz } = v;
    const len = Math.hypot(nx, ny, nz) || 1;
    normal[i * 3] = nx / len; normal[i * 3 + 1] = ny / len; normal[i * 3 + 2] = nz / len;
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(position, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(normal, 3));
  g.setIndex(index);
  hullCache.set(geo, g);
  return g;
}

function mesh(geo, mat, o = {}) {
  const { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, outline = 0.02, cast = true, receive = true, parent = scene } = o;
  const m = new THREE.Mesh(geo, Array.isArray(mat) ? mat : M(mat));
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = cast; m.receiveShadow = receive;
  if (outline > 0) m.add(new THREE.Mesh(hullGeo(geo), outlineMat(outline)));
  parent.add(m);
  return m;
}
// y 为底面高度。底面统一往下埋 SINK：坐在人行道 / 屋顶上的物体，底面不会与支撑面
// 落在同一个深度平面上（那正是建筑底部一块块闪烁的原因）。顶面位置保持不变，
// 所以叠放关系不受影响。
const SINK = 0.008;
const box = (w, h, d, mat, x, y, z, o = {}) =>
  mesh(new THREE.BoxGeometry(w, h + SINK, d), mat, { ...o, x, y: y + h / 2 - SINK / 2, z });
const cyl = (rt, rb, h, mat, x, y, z, o = {}) =>
  mesh(new THREE.CylinderGeometry(rt, rb, h + SINK, o.seg || 16), mat, { ...o, x, y: y + h / 2 - SINK / 2, z });
function plane(w, h, mat, x, y, z, o = {}) {
  // 贴面统一向相机方向偏移深度：墙面/地面上的平面与建筑表面共面时不会闪烁（马赛克）
  if (mat.polygonOffset === false || mat.polygonOffset === undefined) {
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -2;
    mat.polygonOffsetUnits = -2;
    mat.needsUpdate = true;
  }
  return mesh(new THREE.PlaneGeometry(w, h), mat, { outline: 0, cast: false, receive: false, ...o, x, y, z });
}
const _up = new THREE.Vector3(0, 1, 0);
function rod(a, b, r, mat, o = {}) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat, { outline: 0.012, ...o });
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(_up, d.normalize());
  return m;
}
const group = (x = 0, y = 0, z = 0, ry = 0, parent = scene) => {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g;
};

// 雨滴落点（屋顶 / 人行道）
const roofs = [];
const addRoof = (x0, x1, z0, z1, h) => roofs.push({ x0, x1, z0, z1, h });
function surfaceY(x, z) {
  let h = 0.005;
  for (const r of roofs) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1 && r.h > h) h = r.h;
  return h;
}

// ============ 光照 ============
scene.add(new THREE.HemisphereLight('#7383c8', '#3a2a50', 1.0));
const moon = new THREE.DirectionalLight('#a9b8ff', 0.75);
moon.position.set(-7, 14, 6);
moon.castShadow = true;
moon.shadow.mapSize.set(4096, 4096);
Object.assign(moon.shadow.camera, { left: -6.8, right: 6.8, top: 6.8, bottom: -6.8, near: 1, far: 36 });
moon.shadow.camera.updateProjectionMatrix();
moon.shadow.bias = -0.0006;
moon.shadow.normalBias = 0.035;
scene.add(moon);
function pointLight(color, intensity, distance, x, y, z) {
  const l = new THREE.PointLight(color, intensity, distance, 2);
  l.position.set(x, y, z); scene.add(l); return l;
}
function spotLight(color, intensity, distance, angle, from, to) {
  const l = new THREE.SpotLight(color, intensity, distance, angle, 0.6, 1.6);
  l.position.copy(from); l.target.position.copy(to);
  scene.add(l, l.target); return l;
}

// 常用贴图
const softGlowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
// 地面光斑用更陡的衰减：中心亮、边缘完全消失，不会在路面上留下“一块雾”
const poolTex = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,.9)');
  gr.addColorStop(0.3, 'rgba(255,255,255,.42)');
  gr.addColorStop(0.62, 'rgba(255,255,255,.12)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
// 光源本体的柔和光晕（面向相机的 billboard），比实心锥体可信得多
function halo(x, y, z, size, color, opacity) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: softGlowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  s.position.set(x, y, z);
  s.scale.set(size, size, 1);
  s.renderOrder = 4;
  scene.add(s);
  return s;
}
function fakeReflection(w, d, color, opacity, x, y, z, ry = 0) {
  const m = plane(w, d, new THREE.MeshBasicMaterial({
    map: softGlowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false,
  }), x, y, z, { rx: -Math.PI / 2, rz: ry });
  m.renderOrder = 2;
  return m;
}
// 地面光斑（湿润路面上的灯光落点）
function pool(x, y, z, w, d, rot, color, opacity) {
  const m = plane(w, d, new THREE.MeshBasicMaterial({
    map: poolTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false,
  }), x, y, z, { rx: -Math.PI / 2, rz: rot });
  m.renderOrder = 2;
  return m;
}

// ============ 底座 ============
const wood = toon('#3c2b44');
const asphalt = toon('#3b4062');
mesh(new THREE.BoxGeometry(12, 1.21, 12), [wood, wood, asphalt, wood, wood, wood], { y: -0.605, outline: 0.045 });
box(12.7, 0.35, 12.7, '#241a2f', 0, -1.55, 0, { outline: 0.045 });
box(12.25, 0.06, 12.25, '#c9a86a', 0, -1.22, 0, { outline: 0.02 });

// 人行道
const walk = toon('#8e90ad');
const curb = toon('#c3c4d6');
box(8.6, 0.15, 8.4, walk, 1.7, 0, -1.8, { outline: 0.02 });           // 街区 x[-2.6,6] z[-6,2.4]
box(12, 0.15, 0.8, walk, 0, 0, 5.6, { outline: 0.02 });               // 前侧 z[5.2,6]
box(0.8, 0.15, 11.2, walk, -5.6, 0, -0.4, { outline: 0.02 });         // 左侧 x[-6,-5.2]
box(8.6, 0.17, 0.12, curb, 1.7, 0, 2.36, { outline: 0.01 });
box(0.12, 0.17, 8.4, curb, -2.54, 0, -1.8, { outline: 0.01 });
box(12, 0.17, 0.12, curb, 0, 0, 5.24, { outline: 0.01 });
box(0.12, 0.17, 11.2, curb, -5.24, 0, -0.4, { outline: 0.01 });
// 人行道砖缝
const seam = toon('#7a7c99');
for (let x = -2.0; x < 6; x += 0.6) box(0.02, 0.005, 1.6, seam, x, 0.15, 1.55, { outline: 0, cast: false });
for (let x = -5.6; x < 6; x += 0.6) box(0.02, 0.005, 0.8, seam, x, 0.15, 5.6, { outline: 0, cast: false });
addRoof(-2.6, 6, -6, 2.4, 0.15); addRoof(-6, 6, 5.2, 6, 0.15); addRoof(-6, -5.2, -6, 5.2, 0.15);

// 路面标线
const paint = toon('#dfe1ee');
for (let x = -0.4; x < 5.8; x += 0.9) box(0.5, 0.01, 0.07, paint, x, 0, 3.8, { outline: 0, cast: false });
for (let z = -5.6; z < -0.1; z += 0.9) box(0.07, 0.01, 0.5, paint, -3.9, 0, z, { outline: 0, cast: false });
for (let i = 0; i < 4; i++) box(0.22, 0.01, 2.5, paint, -2.3 + i * 0.42, 0, 3.8, { outline: 0, cast: false });
for (let i = 0; i < 4; i++) box(2.4, 0.01, 0.22, paint, -3.9, 0, 0.6 + i * 0.42, { outline: 0, cast: false });
box(0.08, 0.01, 1.3, paint, -0.5, 0, 3.1, { outline: 0, cast: false });
box(1.25, 0.01, 0.08, paint, -4.55, 0, 0.25, { outline: 0, cast: false });

// ============ 便利店 ============
const wallW = toon('#eef0f6');
box(4.72, 0.06, 3.12, '#dde2ec', 0.5, 0.15, -0.9, { outline: 0 });
box(4.88, 2.35, 0.12, wallW, 0.5, 0.15, -2.54);
box(0.12, 2.35, 3.4, wallW, -1.94, 0.15, -0.9);
box(0.12, 2.35, 3.4, wallW, 2.94, 0.15, -0.9);
box(5.2, 0.18, 3.6, '#d0d4de', 0.5, 2.5, -0.9, { outline: 0.03 });
box(4.88, 0.25, 0.12, '#4a5170', 0.5, 0.15, 0.74);
box(4.88, 0.55, 0.14, wallW, 0.5, 1.95, 0.75);
addRoof(-2.06, 3.06, -2.66, 0.86, 2.68);

const brandRed = toon('#e0322f'), warmYellow = toon('#ffc23d');
box(5.04, 0.06, 0.18, brandRed, 0.5, 1.9, 0.75, { outline: 0.01 });
box(0.18, 0.06, 3.44, brandRed, -1.95, 1.9, -0.9, { outline: 0.01 });

const fasciaTex = canvasTex(1024, 112, (g, w, h) => {
  g.fillStyle = '#e0322f'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffc23d'; g.fillRect(0, 0, w, 9); g.fillRect(0, h - 8, w, 8);
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(64, h / 2 + 4, 33, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#e0322f'; star(g, 64, h / 2 + 5, 21);
  g.fillStyle = '#fffdf6'; g.font = `800 54px ${CN}`; g.textBaseline = 'middle';
  g.fillText('星光便利店', 114, h / 2 + 6);
  g.fillStyle = '#fff1c2'; g.font = `900 44px ${CN}`; g.textAlign = 'right';
  g.fillText('24小时', w - 26, h / 2 + 6);
});
plane(4.96, 0.5, glowMap(fasciaTex, 1.05), 0.5, 2.2, 0.83);
plane(3.36, 0.5, glowMap(fasciaTex, 1.05), -2.015, 2.2, -0.9, { ry: -Math.PI / 2 });

// 橱窗玻璃 + 立柱
const frameMat = toon('#3e4562');
for (const x of [-1.9, -0.7, 0.5, 1.72, 2.9]) box(0.07, 1.55, 0.1, frameMat, x, 0.4, 0.76, { outline: 0.01 });
box(4.88, 0.06, 0.1, frameMat, 0.5, 1.88, 0.76, { outline: 0.01 });
box(0.04, 1.4, 0.04, frameMat, 2.31, 0.4, 0.75, { outline: 0 });
const glassTex = canvasTex(512, 160, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.28)';
  g.beginPath(); g.moveTo(60, h); g.lineTo(130, h); g.lineTo(220, 0); g.lineTo(150, 0); g.fill();
  g.fillStyle = 'rgba(255,255,255,.16)';
  g.beginPath(); g.moveTo(150, h); g.lineTo(170, h); g.lineTo(260, 0); g.lineTo(240, 0); g.fill();
  g.beginPath(); g.moveTo(340, h); g.lineTo(390, h); g.lineTo(480, 0); g.lineTo(430, 0); g.fill();
});
const glassMat = new THREE.MeshBasicMaterial({ map: glassTex, color: '#d6f0ff', transparent: true, opacity: 0.9, depthWrite: false });
plane(4.9, 1.5, glassMat, 0.5, 1.15, 0.735).renderOrder = 3;

// 店内
const fridgeTex = canvasTex(1024, 320, (g, w, h) => {
  g.fillStyle = '#e9f3ff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, 22);
  const cols = ['#ff5d73', '#ffd166', '#06d6a0', '#4cc9f0', '#f8961e', '#b5179e', '#90be6d', '#ffffff', '#3a86ff'];
  for (let r = 0; r < 4; r++) {
    const y = 34 + r * 72;
    g.fillStyle = '#b9c6dc'; g.fillRect(0, y + 58, w, 6);
    for (let i = 0; i < 40; i++) {
      g.fillStyle = cols[(i * 7 + r * 3) % cols.length];
      rr(g, 8 + i * 25.4, y + 8, 18, 50, 5); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(12 + i * 25.4, y + 16, 3, 30);
    }
  }
  for (let i = 1; i < 4; i++) { g.fillStyle = '#9aa7bf'; g.fillRect(i * w / 4 - 3, 0, 6, h); }
});
box(4.6, 1.6, 0.3, '#ccd4e2', 0.5, 0.21, -2.31, { outline: 0.015 });
plane(4.4, 1.4, glowMap(fridgeTex, 1.0), 0.5, 1.0, -2.145);
for (const z of [-0.45, -1.4]) {
  box(3.2, 1.05, 0.1, '#c8cfdc', -0.1, 0.21, z, { outline: 0.012 });
  for (let t = 0; t < 3; t++) box(3.2, 0.03, 0.5, '#aeb7c8', -0.1, 0.25 + t * 0.32, z, { outline: 0.01 });
}
{
  const N = 300;
  const prods = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.15, 0.09), toon('#ffffff', {}), N);
  const pal = ['#ff6b81', '#ffd166', '#06d6a0', '#4cc9f0', '#f8961e', '#c77dff', '#ffffff', '#8ecae6', '#ef476f'];

const PuddleShader = {
  name: 'PuddleShader',
  uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uTime: { value: 0 } },
  vertexShader: `
    uniform mat4 textureMatrix;
    varying vec4 vUvR;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vUvR = textureMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec4 vUvR;
    varying vec2 vUv;
    void main() {
      vec2 p = vUv * 26.0;
      vec2 d = vec2(sin(p.y * 1.7 + uTime * 3.1) + sin(p.x * 2.3 - uTime * 2.4),
                    cos(p.x * 1.9 + uTime * 2.7) + sin(p.y * 2.9 + uTime * 1.8)) * 0.0035;
      vec4 uvr = vUvR;
      uvr.xy += d * uvr.w;
      vec3 base = texture2DProj(tDiffuse, uvr).rgb;
      float a = smoothstep(1.0, 0.7, length(vUv - 0.5) * 2.0);
      gl_FragColor = vec4(base * color + vec3(0.02, 0.025, 0.05), a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};
const puddles = [];
// 一个真实 Reflector = 每帧把整个场景额外渲染一遍，所以只留给最显眼的那块积水。
function puddle(x, y, z, sx, sz, rot = 0) {
  const geo = new THREE.CircleGeometry(1, 40);
  geo.scale(sx, sz, 1);
  const r = new Reflector(geo, {
    shader: PuddleShader, color: 0x9aa4c8,
    textureWidth: Math.round(innerWidth * DPR * REFLECT_SCALE), textureHeight: Math.round(innerHeight * DPR * REFLECT_SCALE),
  });
  r.material.transparent = true;
  r.material.depthWrite = false;
  r.position.set(x, y, z);
  r.rotation.set(-Math.PI / 2, 0, rot);
  r.renderOrder = 1;
  scene.add(r);
  puddles.push(r);
  return r;
}

const ripM = new THREE.Matrix4(), ripC = new THREE.Color();
for (let i = 0; i < RIP; i++) {
  ripData[i * 4 + 3] = 99;
  ripples.setMatrixAt(i, ripM.makeScale(0, 0, 0));
  ripples.setColorAt(i, ripC.setRGB(0, 0, 0));
}
scene.add(ripples);
let ripIdx = 0;
const RIP_LIFE = 0.45;

// ============ 后期：泛光 ============
// samples 2：三渲二大面积纯色，2x MSAA 已经够了；4x 在这个分辨率下纯粹是带宽开销
const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 2 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.45, 1.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  refreshSizes();
});

// 尺寸 / 像素比变化时统一刷新，供 resize 和自适应降档复用
function refreshSizes() {
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(DPR);
  composer.setSize(innerWidth, innerHeight);
  const rw = Math.max(160, Math.round(innerWidth * DPR * REFLECT_SCALE));
  const rh = Math.max(160, Math.round(innerHeight * DPR * REFLECT_SCALE));
  for (const p of puddles) p.getRenderTarget().setSize(rw, rh);
}

// 自适应画质：连续掉帧就逐级降 DPR，降到最低还不行才关掉泛光
const DPR_STEPS = [DPR, 1.4, 1.1, 0.9];
let dprStep = 0, adaptAcc = 0, adaptFrames = 0, warmup = 2;
function adaptQuality(dt) {
  if (warmup > 0) { warmup -= dt; return; }
  adaptAcc += dt; adaptFrames++;
  if (adaptAcc < 1.2) return;
  const avg = adaptAcc / adaptFrames;
  adaptAcc = 0; adaptFrames = 0;
  if (avg < 0.026) return;
  if (dprStep < DPR_STEPS.length - 1) {
    DPR = DPR_STEPS[++dprStep];
    refreshSizes();
  } else if (bloom.enabled) {
    bloom.enabled = false;
  }
}

// ============ 动画 ============
const clock = new THREE.Clock();
const neonBase = neonMat.color.clone();
let flickerT = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (let i = 0; i < RAIN; i++) {
    const k = i * 5;
    drops[k + 1] -= drops[k + 3] * dt;
    if (drops[k + 1] < drops[k + 4]) {
      if (Math.random() < 0.35) {
        const r = ripIdx++ % RIP;
        ripData[r * 4] = drops[k]; ripData[r * 4 + 1] = drops[k + 4] + 0.006; ripData[r * 4 + 2] = drops[k + 2]; ripData[r * 4 + 3] = 0;
      }
      resetDrop(i, true);
    }
    const x = drops[k], y = drops[k + 1], z = drops[k + 2], p = i * 6;
    rainPos[p] = x; rainPos[p + 1] = y; rainPos[p + 2] = z;
    rainPos[p + 3] = x + 0.035; rainPos[p + 4] = y + 0.28; rainPos[p + 5] = z + 0.01;
  }
  rainGeo.attributes.position.needsUpdate = true;

  for (let i = 0; i < RIP; i++) {
    const k = i * 4;
    if (ripData[k + 3] > RIP_LIFE) continue;
    ripData[k + 3] += dt;
    const a = Math.min(ripData[k + 3] / RIP_LIFE, 1);
    const s = 0.02 + a * 0.09;
    ripM.makeScale(s, 1, s).setPosition(ripData[k], ripData[k + 1], ripData[k + 2]);
    ripples.setMatrixAt(i, ripM);
    const c = (1 - a) * 0.55;
    ripples.setColorAt(i, ripC.setRGB(c * 0.8, c * 0.88, c));
  }
  ripples.instanceMatrix.needsUpdate = true;
  ripples.instanceColor.needsUpdate = true;

  for (const p of puddles) p.material.uniforms.uTime.value = t;

  flickerT -= dt;
  let k = 1;
  if (flickerT < 0) { if (Math.random() < 0.02) flickerT = 0.08 + Math.random() * 0.25; }
  else k = Math.random() < 0.5 ? 0.25 : 0.9;
  neonMat.color.copy(neonBase).multiplyScalar(k);
  neonLight.intensity = 2.0 * k;

  flags.forEach((f, i) => (f.rotation.y = Math.sin(t * 1.6 + i * 1.3) * 0.25));
  lanterns.forEach((l, i) => (l.rotation.z = Math.sin(t * 1.3 + i) * 0.07));
  wipers.forEach((w) => (w.rotation.x = Math.sin(t * 3.2) * 0.85));
  catTail.forEach((c) => (c.rotation.y = Math.sin(t * 1.8) * 0.4));

  // 阴影只有旗帜 / 灯笼 / 雨刷 / 猫尾在动，6 帧更新一次完全看不出来
  if (frameCount++ % 6 === 0) renderer.shadowMap.needsUpdate = true;
  adaptQuality(dt);

  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
let frameCount = 0;
tick();
</script>
</body>
</html>
